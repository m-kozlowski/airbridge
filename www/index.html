  const entries = Object.entries(d).sort((a,b) => category(a[0]) - category(b[0]));
  for (const [k,v] of entries) {
    // Setup completion accepts only credentials; advanced access stays in Config.
    if (root.id === 'setup-access' && !['http_user','http_pass'].includes(k)) continue;
    const categoryInfo = CFG_SECTIONS[category(k)];
    if (!configStorageSupported && ['smb','sleephq'].includes(categoryInfo?.id)) continue;
    const group = categoryInfo?.id || 'other';
    if (group !== lastGroup) {
      lastGroup = group;
      const heading = document.createElement('h4');
      heading.className = 'config-section-title';
      uiText(heading, uiMessage('config.section.' + group, {}, categoryInfo?.label));
      root.appendChild(heading);
    }
    var row = document.createElement('div'); row.className = 'row';
    var isPass = k.includes('pass') || k.includes('secret');
    var opts = categoryInfo?.options[k];
    var label = document.createElement('label');
    label.textContent = k;
    if (UI_CATALOGS.en['config.help.' + k]) {
      var help = document.createElement('small');
      uiText(help, uiMessage('config.help.' + k));
      label.appendChild(help);
    }
    row.appendChild(label);
    var control = document.createElement(opts ? 'select' : 'input');
    control.id = root.id + '-' + k;
    label.htmlFor = control.id;
    control.dataset.key = k;
    control.dataset.orig = isPass ? '' : v;
    if (opts) {
      // Preserve an older/newer saved value until the user chooses a replacement.
      if (!opts.some(option => option[0] === String(v))) opts = [...opts, [String(v), null]];
      opts.forEach(function(o) {
        var option = document.createElement('option');
        option.value = o[0];
        uiText(option, o[1] == null ? uiMessage('config.unknown', {value:o[0]}) :
          k === 'ui_language' && o[0] !== 'auto' ? o[1] :
          uiMessage('config.option.' + k + '.' + o[0], {}, o[1]));
        control.appendChild(option);
      });
    } else {
      control.type = isPass ? 'password' : 'text';
      if (isPass) {
        uiText(control, uiMessage('config.unchanged'), 'placeholder');
        control.dataset.pass = '1';
      }
    }
    control.value = isPass ? '' : v;
    row.appendChild(control);
    root.appendChild(row);
    if (isPass) row.querySelector('input').addEventListener('input', function() { this.setAttribute('data-dirty', '1'); uiText(this, uiMessage('config.emptyRemove'), 'placeholder'); });
    if (k === 'tz') attachTzHelper(row.querySelector('input'));
  }
}

function confirmAccessChange(root, changes) {
  if (!Object.hasOwn(changes, 'http_user') && !Object.hasOwn(changes, 'http_pass')) return true;
  const user = root.querySelector('[data-key="http_user"]');
  if (!user || user.value || changes.http_pass) return true;
  return confirm(t('config.confirmAccess'));
}

function collectConfigChanges(root) {
  const changes = {};
  const fields = root.querySelectorAll('[data-key]');
  fields.forEach(inp => {
    if (inp.dataset.pass) {
      if (inp.getAttribute('data-dirty')) changes[inp.dataset.key] = inp.value;
    } else {
      if (inp.value !== inp.dataset.orig) changes[inp.dataset.key] = inp.value;
    }
  });
  return changes;
}

async function loadConfigFields(root, section, messageId) {
  if (root.dataset.loading === '1' || root.dataset.saving === '1') return;
  root.dataset.loading = '1';
  delete root.dataset.stale;
  try {
    const r = await api('/api/config' + (section ? '?section=' + encodeURIComponent(section) : ''));
    if (!r) { root.dataset.stale = '1'; return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'config_read_failed');
    const drafts = collectConfigChanges(root);
    renderConfigFields(root, d);
    root.querySelectorAll('[data-key]').forEach(input => {
      if (!Object.hasOwn(drafts, input.dataset.key)) return;
      input.value = drafts[input.dataset.key];
      if (input.dataset.pass) {
        input.setAttribute('data-dirty', '1');
        uiText(input, uiMessage('config.emptyRemove'), 'placeholder');
      }
    });
    root.dataset.loaded = '1';
    showMsg(document.getElementById(messageId), '', 'ok');
    return true;
  } catch(e) {
    root.dataset.stale = '1';
    showMsg(document.getElementById(messageId), uiMessage('common.error', {detail:uiError(e)}), 'err');
  } finally {
    delete root.dataset.loading;
  }
}

async function loadConfig(selected = configSection) {
  const categories = document.getElementById('configCategories');
  const container = document.getElementById('configFields');
  if (!categories.children.length) {
    for (const section of CFG_SECTIONS) {
      if (!configStorageSupported && ['smb','sleephq'].includes(section.id)) continue;
      const button = document.createElement('button');
      uiText(button, uiMessage('config.section.' + section.id, {}, section.label));
      button.dataset.section = section.id;
      button.onclick = () => loadConfig(section.id);
      categories.appendChild(button);

      const panel = document.createElement('div');
      panel.id = 'config-panel-' + section.id;
      panel.hidden = true;
      if (section.id === 'network') {
        const wifi = document.getElementById('configWifi');
        wifi.hidden = false;
        panel.appendChild(wifi);
      }
      const root = document.createElement('div');
      root.id = 'config-' + section.id;
      root.dataset.configForm = section.id;
      panel.appendChild(root);
      const actions = document.createElement('div');
      actions.className = 'btn-row';
      const message = document.createElement('div');
      message.id = root.id + '-msg';
      message.className = 'msg';
      const save = document.createElement('button');
      save.className = 'btn btn-accent';
      uiText(save, uiMessage('config.save'));
      save.onclick = () => saveConfig(root.id, message.id);
      actions.appendChild(save);
      const refresh = document.createElement('button');
      refresh.className = 'btn';
      uiText(refresh, uiMessage('common.refresh'));
      refresh.onclick = () => loadConfigFields(root, section.id, message.id);
      actions.appendChild(refresh);
      panel.appendChild(actions);
      panel.appendChild(message);
      container.appendChild(panel);
    }
  }
  configSection = selected;
  for (const button of categories.children) {
    const active = button.dataset.section === selected;
    button.className = active ? 'btn btn-accent' : 'btn';
    button.setAttribute('aria-pressed', String(active));
    document.getElementById('config-panel-' + button.dataset.section).hidden = !active;
  }
  if (selected === 'network') loadWifiNets();
  const root = document.getElementById('config-' + selected);
  if (root.dataset.loaded !== '1' || root.dataset.stale === '1')
    return loadConfigFields(root, selected, root.id + '-msg');
}

async function saveConfig(rootId, messageId) {
  const root = document.getElementById(rootId);
  if (root.dataset.saving === '1' || root.dataset.loading === '1') return;
  const changes = collectConfigChanges(root);
  const fields = root.querySelectorAll('[data-key]');
  const msgEl = document.getElementById(messageId);
  if (!Object.keys(changes).length) { showMsg(msgEl, uiMessage('common.noChanges'), 'ok'); return true; }
  if (!confirmAccessChange(root, changes)) return false;
  root.dataset.saving = '1';
  try {
    const r = await api('/api/config', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(changes)});
    if (!r) return;
    const d = await r.json();
    if (!r.ok || d.ok !== true) throw new Error(d.error || 'config_save_failed');
    if (d.saved !== Object.keys(changes).length)
      throw uiFailure('config.partialSave', {count:d.saved});
    fields.forEach(inp => {
      const key = inp.dataset.key;
      if (!Object.hasOwn(changes, key)) return;
      if (inp.dataset.pass) {
        if (inp.value === changes[key]) {
          inp.value = '';
          inp.removeAttribute('data-dirty');
          uiText(inp, uiMessage('config.unchanged'), 'placeholder');
        }
      } else inp.dataset.orig = changes[key];
    });
    document.querySelectorAll('[data-config-form]').forEach(other => {
      if (other === root) return;
      const section = CFG_SECTIONS.find(section => section.id === other.dataset.configForm);
      if (!section || section.keys.some(key => Object.hasOwn(changes, key)))
        other.dataset.stale = '1';
    });
    showMsg(msgEl, uiMessage('config.saved'), 'ok');
    return true;
  } catch(e) { showMsg(msgEl, uiMessage('common.error', {detail:uiError(e)}), 'err'); }
  finally { delete root.dataset.saving; }
}


const SYNC_ENDPOINTS = {smb: 'SMB', sleephq: 'SleepHQ'};

function syncStorageTimestamp(epochSeconds) {
  const date = new Date(epochSeconds * 1000);
  const pad = value => String(value).padStart(2, '0');
  return String(date.getFullYear()).padStart(4, '0') + '-' +
    [date.getMonth() + 1, date.getDate()].map(pad).join('-') + ' ' +
    [date.getHours(), date.getMinutes(), date.getSeconds()].map(pad).join(':');
}

let exportsSnapshot = null;
let exportsFresh = false;
const syncRequests = new Set();
const syncRequestErrors = new Map();

function syncCardStatus(id, state, fresh, requestError) {
  const syncError = requestError?.check ? null : requestError?.error ?? requestError;
  const errors = [syncError, state.error,
    state.backlog_state === 'error' ? state.backlog_error : '']
    .filter((error, index, all) => error && all.indexOf(error) === index).map(uiError);
  const reason = uiMessage('common.value', {value:{items:errors, separator:'; '}});
  const result = (key, tone = '', params = {}, file = '') => ({message:uiMessage(key, params), tone, reason, file});
  if (!fresh) return result('sync.reconnecting');
  if (syncError) return result('sync.requestFailed', 'error');
  if (state.state === 'disabled' || state.sync_blocked === 'disabled') return result('sync.state.disabled');
  if (state.backlog_state === 'unconfigured' || state.sync_blocked === 'not_configured')
    return result('sync.configureFirst');
  if (state.state === 'unsupported') return result('sync.state.unsupported');
  if (state.state === 'error' || state.error || state.backlog_state === 'error')
    return result('sync.failed', 'error');
  const waits = {offline:'sync.waitingWifi', not_idle:'sync.waitingStandby',
    usb_storage_active:'sync.waitingUsb', sd_unavailable:'error.sd_unavailable', unavailable:'sync.unavailable'};
  if (waits[state.sync_blocked]) return result(waits[state.sync_blocked]);
  if (['working','pending'].includes(state.state)) {
    const activity = state.activity || {};
    const waiting = {queued:'sync.state.pending', export_queue:'sync.waitingExport',
      storage_busy:'sync.waitingStorage', sd_write_wait:'sync.waitingStorage',
      sd_io_wait:'sync.waitingStorage', sd_reader_wait:'sync.waitingDownload',
      network:'sync.waitingWifi', standby:'sync.waitingStandby', usb:'sync.waitingUsb',
      retry_backoff:'sync.waitingRetry'};
    if (waiting[activity.wait]) return result(waiting[activity.wait], '', {}, activity.file || '');
    if (state.state === 'working') {
      const phase = 'sync.phase.' + activity.phase;
      return result(Object.hasOwn(UI_CATALOGS.en, phase) ? phase : 'sync.state.working',
        'active', {}, activity.file || '');
    }
  }
  if (state.retry_pending) return result('sync.waitingRetry');
  if (state.state === 'pending') return result('sync.state.pending');
  if (state.backlog_state === 'confirming') return result('sync.awaitingConfirmation');
  if (state.backlog_state === 'ready') {
    if (state.backlog_sessions > 0)
      return result('sync.sessionsToSync', '', {count:state.backlog_sessions});
    if (state.backlog_files > 0) return result('sync.dataWaiting');
    if (state.backlog_waiting > 0) return result('sync.waitingRecordings');
    if (state.backlog_sessions === 0 && state.backlog_files === 0 && state.backlog_waiting === 0)
      return result('sync.upToDate', 'good');
  }
  return result('sync.statusUnknown');
}

  for (const [id, name] of Object.entries(SYNC_ENDPOINTS)) {

      <div class="sync-status" role="status" aria-live="polite" aria-atomic="true" tabindex="0">

      </div>
      <div class="time-row"><span class="label" data-i18n="sync.endpoint"></span><span class="value sync-value" data-sync="endpoint">&mdash;</span></div>

        <div class="time-row"><span class="label" data-i18n="sync.skippedFiles"></span><span class="value" data-sync="skipped"></span></div>
        ${id === 'sleephq' ? '<div class="time-row"><span class="label" data-i18n="sync.attachedFiles"></span><span class="value" data-sync="attached"></span></div>' : ''}

      </details>

    card.querySelector('[data-sync="check"]').onclick = () => startSync(id, true);

    card.querySelector('[data-sync="save"]').onclick = () => saveConfig(id + 'ConfigFields', id + 'ConfigMsg');

function renderExports(changed = null) {
  const data = exportsSnapshot;
  if (!data) return;
  const supported = data.supported === true;
  document.querySelectorAll('[data-tab="sync"]').forEach(link => { link.hidden = !supported; });
  document.getElementById('syncCards').hidden = !supported;
  document.getElementById('syncUnavailable').hidden = supported;
  if (!supported) return;
  if (!document.getElementById('p-sync').classList.contains('active')) return;
  createSyncCards();
  for (const id of Object.keys(SYNC_ENDPOINTS)) {
    if (changed && !changed[id]) continue;
    const state = data[id];
    if (!state) continue;
    const card = document.getElementById(id + 'SyncCard');
    const text = (key, value) => { uiText(card.querySelector('[data-sync="' + key + '"]'), value); };
    const status = syncCardStatus(id, state, exportsFresh, syncRequestErrors.get(id));
    text('state', status.message);
    text('file', status.file);
    text('error', status.reason);
    card.dataset.syncTone = status.tone;
    text('endpoint', id === 'smb' ? state.endpoint || uiMessage('sync.notConfigured') :
      uiMessage('common.value', {value:{items:['SleepHQ',
        ...(state.team_id ? [uiMessage('sync.team', {id:String(state.team_id)})] : []),
        ...(state.device_id ? [uiMessage('sync.device', {id:String(state.device_id)})] : [])], separator:' / '}}));
    text('last', state.last_sync_epoch ? syncStorageTimestamp(state.last_sync_epoch) : '\u2014');
    const count = (key, value, known) => text(key, known && Number.isFinite(value)
      ? uiMessage('common.value', {value}) : '\u2014');
    const run = state.last_run;
    count('uploaded', run?.files_uploaded, run?.available);
    count('skipped', run?.files_skipped, run?.available);
    count('attached', run?.files_attached, run?.available);
    const backlogKnown = ['ready','confirming'].includes(state.backlog_state);
    count('pending-files', state.backlog_files, backlogKnown);
    count('pending-sessions', state.backlog_sessions, backlogKnown);
    count('waiting-sessions', state.backlog_waiting, backlogKnown);
    text('run-result', run?.available ? uiMessage('common.value', {value:{items:[
      uiMessage(run.success ? 'sync.runSucceeded' : 'sync.runFailed'),
      ...(run.finished_epoch ? [syncStorageTimestamp(run.finished_epoch)] : []),
      ...(id === 'sleephq' && run.import_id ? [uiMessage(run.import_status ? 'sync.importStatus' : 'sync.import', {
        id:String(run.import_id), status:uiMessage('sync.importState.' + run.import_status, {}, run.import_status)})] : []),
      ...(run.error ? [uiError(run.error)] : [])], separator:' / '}}) : '\u2014');
    card.querySelector('[data-sync="run-result"]').dataset.error = String(!!run?.available && !run.success);
    const requestError = syncRequestErrors.get(id);
    const checkError = requestError?.check ? requestError.error :
      state.check_state === 'failed' ? state.check_error : null;
    text('check-result', checkError ? uiMessage('sync.checkFailedReason', {reason:uiError(checkError)}) :
      state.check_state === 'passed' ? uiMessage('sync.checkPassed') :
      state.check_state === 'failed' ? uiMessage('sync.checkFailed') :
      ['pending','working'].includes(state.check_state) ? uiMessage('sync.checking') : '');
    card.querySelector('[data-sync="check-result"]').dataset.error = String(!!checkError || state.check_state === 'failed');
    card.querySelector('[data-sync="start"]').disabled = !exportsFresh || !!state.sync_blocked || syncRequests.size > 0;
    card.querySelector('[data-sync="check"]').disabled = !exportsFresh || !!state.check_blocked || syncRequests.size > 0;
  }
}

let storagePath = '/', storageOffset = 0, storageMore = false, storageLoading = false;
let storageUsbRequest = false, storageListAbort = null, storageViewState = '';
let storageReloadPending = false;
let storageMutation = '';
const storageSelection = new Set();
const STORAGE_STATES = {mounted:'storage.state.mounted', unavailable:'storage.state.unavailable',
  unsupported:'storage.state.unsupported', usb_starting:'storage.state.usbStarting',
  usb:'storage.state.usb', usb_stopping:'storage.state.usbStopping'};

function renderDashboardStorage(data) {
  const summary = document.getElementById('dashStorageSummary');
  const meter = document.getElementById('dashStorageMeter');
  const fill = document.getElementById('dashStorageFill');
  if (data.sd === undefined && data.version === undefined) return;
  const total = Number(data.sd_total_mb), used = Number(data.sd_used_mb);
  const mounted = data.sd === 'mounted' && Number.isFinite(total) && total > 0 &&
    Number.isFinite(used) && used >= 0;
  meter.hidden = !mounted;
  if (!mounted) {
    uiText(summary, uiMessage(STORAGE_STATES[data.sd] || 'storage.state.unsupported'));
    fill.style.width = '0%';
    meter.removeAttribute('aria-valuenow');
    return;
  }
  const format = mb => uiMessage('common.unit', {value:{number:mb >= 1024 ? mb / 1024 : Math.round(mb),
    max:mb >= 1024 ? 1 : 0, min:mb >= 1024 ? 1 : 0}, unit:mb >= 1024 ? 'GiB' : 'MiB'});
  const percent = Math.min(100, used / total * 100);
  uiText(summary, uiMessage('storage.usedFree', {used:format(used), free:format(Math.max(0, total - used))}));
  fill.style.width = percent.toFixed(1) + '%';
  meter.setAttribute('aria-valuenow', percent.toFixed(1));
  uiText(meter, uiMessage('storage.percentUsed', {percent:{number:percent,max:1,min:1}, total:format(total)}), 'title');
}

function renderStorageStatus(data) {
  if (data.sd === undefined) return;
  const supported = data.sd !== 'unsupported';
  document.querySelectorAll('[data-tab="storage"]').forEach(link => { link.hidden = !supported; });
  uiText(document.getElementById('storageState'), uiMessage(STORAGE_STATES[data.sd] || 'storage.state.unavailable'));
  uiText(document.getElementById('storageUsage'), data.sd === 'mounted' ?
    uiMessage('storage.usedTotal', {used:data.sd_used_mb || 0, total:data.sd_total_mb || 0}) : '');
  const usb = document.getElementById('storageUsb');
  usb.hidden = !data.sd_usb_supported;
  uiText(usb, uiMessage(data.sd === 'mounted' ? 'storage.usbShare' :
    data.sd === 'usb_stopping' && data.sd_error ? 'storage.usbRetry' : 'storage.usbReturn'));
  if (data.sd !== 'mounted') {
    if (storageListAbort) storageListAbort.abort();
    storageSelection.clear();
    document.getElementById('storageEntries').replaceChildren();
    uiText(document.getElementById('storagePage'), '');
    uiText(document.getElementById('storageMessage'), uiError(data.sd_error) ||
      ({usb_starting:uiMessage('storage.closingFiles'), usb:uiMessage('storage.recordingPaused'),
        usb_stopping:uiMessage('storage.remounting')}[data.sd] || ''));
  } else {
    if (storageViewState && storageViewState !== 'mounted') storageReloadPending = true;
    if (!storageMutation && (data.sd_error || storageReloadPending))
      uiText(document.getElementById('storageMessage'), uiError(data.sd_error) || '');
  }
  storageViewState = data.sd;
  storageControls();
  reloadStorageIfNeeded();
}

function reloadStorageIfNeeded() {
  if (storageReloadPending && document.getElementById('p-storage').classList.contains('active'))
    loadStorage(storagePath, 0);
}

function storageControls() {
  const blocked = !!storageMutation || storageLoading || storageReloadPending || storageUsbRequest || (lastStatus.sd && lastStatus.sd !== 'mounted');
  document.getElementById('storageRefresh').disabled = blocked;
  document.getElementById('storageUp').disabled = blocked || storagePath === '/';
  document.getElementById('storagePrev').disabled = blocked || !storageOffset;
  document.getElementById('storageNext').disabled = blocked || !storageMore;
  document.getElementById('storageZip').disabled = blocked;
  document.getElementById('storageSelected').disabled = blocked || !storageSelection.size;
  document.getElementById('storageDelete').disabled = blocked || !storageSelection.size;
  document.querySelectorAll('#storageEntries button, #storageEntries input').forEach(el => { el.disabled = blocked; });
  document.querySelectorAll('#storageEntries a').forEach(el => { el.setAttribute('aria-disabled', String(blocked)); });
  document.getElementById('storageUsb').disabled = !!storageMutation || storageUsbRequest ||
    !(lastStatus.sd === 'mounted' || lastStatus.sd === 'usb' ||
      (lastStatus.sd === 'usb_stopping' && lastStatus.sd_error));
}

async function storageUsb() {
  if (storageMutation || storageUsbRequest) return;
  const enabled = lastStatus.sd === 'mounted';
  if (enabled && !confirm(t('storage.confirmUsbShare'))) return;
  if (!enabled && lastStatus.sd === 'usb' && !confirm(t('storage.confirmUsbReturn'))) return;
  storageUsbRequest = true;
  storageControls();
  try {
    const response = await api('/api/storage/usb', {method:'POST', body:new URLSearchParams({enabled:enabled ? '1' : '0'})});
    if (!response) return;
    const data = await response.json();
    if (!response.ok) throw data.error ? new Error(data.error) : uiFailure('storage.usbFailed');
  } catch (error) {
    uiText(document.getElementById('storageMessage'), uiError(error));
  } finally {
    storageUsbRequest = false;
    storageControls();
    reloadStorageIfNeeded();
  }
}

function storageChild(name) { return (storagePath === '/' ? '' : storagePath) + '/' + name; }

async function loadStorage(path = storagePath, offset = storageOffset) {
  if (storageMutation || storageLoading || storageUsbRequest || (lastStatus.sd && lastStatus.sd !== 'mounted')) return;
  storageReloadPending = false;
  const controller = new AbortController();
  storageListAbort = controller;
  storageLoading = true;
  storageControls();
  const message = document.getElementById('storageMessage');
  uiText(message, uiMessage('storage.readingDirectory'));
  try {
    const response = await api('/api/storage/list?path=' + encodeURIComponent(path) + '&offset=' + offset, {signal:controller.signal});
    if (!response) return;
    const data = await response.json();
    if (controller.signal.aborted) return;
    if (!response.ok || !data.ok) throw data.error ? new Error(data.error) : uiFailure('storage.directoryUnavailable');
    storagePath = data.path;
    storageOffset = offset;
    storageMore = data.more;
    storageSelection.clear();
    document.getElementById('storagePath').textContent = storagePath;
    const entries = document.getElementById('storageEntries');
    entries.replaceChildren();
    for (const entry of data.entries) {
      const row = document.createElement('div'); row.className = 'storage-row';
      const check = document.createElement('input'); check.type = 'checkbox';
      uiText(check, uiMessage('storage.selectEntry', {name:entry.name}), 'aria-label');
      check.onchange = () => { if (check.checked) storageSelection.add(entry.name); else storageSelection.delete(entry.name); storageControls(); };
      const content = document.createElement('div');
      const link = document.createElement('a'); link.textContent = entry.name + (entry.directory ? '/' : '');
      link.href = entry.directory ? '#storage' : '/api/storage/download?path=' + encodeURIComponent(storageChild(entry.name));
      link.onclick = event => {
        if (link.getAttribute('aria-disabled') === 'true') { event.preventDefault(); return; }
        if (entry.directory) { event.preventDefault(); loadStorage(storageChild(entry.name), 0); }
      };
      if (!entry.directory) link.download = entry.name;
      const detail = document.createElement('small');
      const unit = entry.size >= 1048576 ? 2 : entry.size >= 1024 ? 1 : 0;
      uiText(detail, uiMessage('common.value', {value:{items:[entry.directory ? uiMessage('storage.directory') :
        uiMessage('common.unit', {value:{number:entry.size / 1024 ** unit, max:unit ? 1 : 0, min:unit ? 1 : 0},
          unit:['B', 'KiB', 'MiB'][unit]}),
        ...(entry.modified ? [syncStorageTimestamp(entry.modified)] : [])], separator:' | '}}));
      content.append(link, detail);
      const action = document.createElement('button'); action.className = 'btn btn-accent storage-download';
      action.textContent = '\u2193';
      const downloadLabel = uiMessage(entry.directory ? 'storage.downloadFolder' : 'storage.downloadFile', {name:entry.name});
      uiText(action, downloadLabel, 'title');
      uiText(action, downloadLabel, 'aria-label');
      action.onclick = () => storageDownload(entry.directory ? 'archive' : 'download', entry.name);
      const rename = document.createElement('button'); rename.className = 'btn';
      uiText(rename, uiMessage('storage.rename'));
      uiText(rename, uiMessage('storage.renameEntry', {name:entry.name}), 'aria-label');
      rename.onclick = () => storageRename(entry.name);
      const actions = document.createElement('div'); actions.className = 'storage-entry-actions';
      actions.append(rename, action);
      row.append(check, content, actions); entries.append(row);
    }
    uiText(document.getElementById('storagePage'), uiMessage('storage.page', {number:offset / 32 + 1}));
    uiText(message, data.entries.length ? '' : uiMessage('storage.emptyDirectory'));
  } catch (error) {
    if (!controller.signal.aborted) uiText(message, uiError(error));
  } finally {
    storageListAbort = null;
    storageLoading = false;
    storageControls();
    reloadStorageIfNeeded();
  }
}

function storageUp() {
  const slash = storagePath.lastIndexOf('/');
  loadStorage(slash > 0 ? storagePath.slice(0, slash) : '/', 0);

function storageDownload(kind, name = null, selected = false) {
  if (storageMutation || storageLoading || storageReloadPending || storageUsbRequest || (lastStatus.sd && lastStatus.sd !== 'mounted')) return;
  let url = '/api/storage/' + kind + '?path=' + encodeURIComponent(name === null ? storagePath : storageChild(name));
  if (selected) {
    if (!storageSelection.size) return;
    const names = [...storageSelection];
    if (new TextEncoder().encode(names.join('\n')).length >= 2048) {
      uiText(document.getElementById('storageMessage'), uiMessage('storage.selectFewer'));
      return;
    }
    for (const item of names) url += '&item=' + encodeURIComponent(item);
  }
  const link = document.createElement('a'); link.href = url;
  link.download = kind === 'archive' ? 'airbridge.zip' : name;
  document.body.append(link); link.click(); link.remove();
}

async function storageMutate(kind, body, repository = false) {
  if (storageMutation || storageLoading || storageUsbRequest) return;
  if (repository ? !firmwareRepository?.ready || firmwareRepositoryDirty || firmwareRepositoryRead ||
      firmwareRepositoryError || !resmedFresh || resmedRequest || firmwareUploadRequest :
      storageReloadPending || (lastStatus.sd && lastStatus.sd !== 'mounted')) return;
  storageMutation = kind;
  // Do not let a file revision replace either list before mutation completion.
  firmwareRepositorySerial++;
  firmwareRepositoryDirty = true;
  storageReloadPending = true;
  if (!repository) storageLoading = true;
  storageControls();
  renderResmedStatus();
  const message = document.getElementById(repository ? 'firmwareRepositoryState' : 'storageMessage');
  uiText(message, uiMessage(kind === 'delete' ? 'storage.deleting' : 'storage.renaming'));
  let result;
  try {
    const response = await api('/api/storage/' + kind, {method:'POST', body});
    if (!response) {
      if (repository) { resmedAuthFailed = true; resmedDisconnected(); }
      return;
    }
    const data = await response.json();
    if (!response.ok || !data.ok) {
      const detail = data.error ? uiError(data.error) : uiMessage('storage.operationFailed');
      throw uiFailure('common.value', {value:data.changed ?
        uiMessage('storage.entriesChanged', {detail, count:data.changed}) : detail});
    }
    result = uiMessage(kind === 'delete' ? 'storage.deleted' : 'storage.renamed');
  } catch (error) {
    result = uiError(error);
  } finally {
    storageMutation = '';
    if (!repository) storageLoading = false;
    // Completion is terminal; refresh also after partial failure or lost reply.
    if (repository) await loadFirmwareRepository();
    else await loadStorage(storagePath, 0);
    storageControls();
    renderResmedStatus();
    reloadStorageIfNeeded();
    loadFirmwareRepository();
  }
  if (repository || lastStatus.sd === 'mounted') uiText(message, result);
}

async function storageRename(name, path = storageChild(name), repository = false) {
  if (storageMutation || storageLoading || storageUsbRequest ||
      (repository ? resmedRequest : storageReloadPending)) return;
  const replacement = prompt(t('storage.newName', {name}), path);
  if (replacement === null || replacement === path || replacement === name) return;
  if (!replacement || /[\\\r\n]/.test(replacement)) {
    uiText(document.getElementById(repository ? 'firmwareRepositoryState' : 'storageMessage'), uiMessage('storage.invalidDestination'));
    return;
  }
  await storageMutate('rename', new URLSearchParams({path, name:replacement}), repository);
}

async function storageDelete() {
  if (storageMutation || storageLoading || storageReloadPending || !storageSelection.size) return;
  const names = [...storageSelection];
  if (!confirm(t('storage.confirmDelete', {names:{items:names, separator:'\n'}}))) return;
  const body = new URLSearchParams({path:storagePath});
  for (const name of names) body.append('item', name);
  await storageMutate('delete', body);
}

function applyExports(data) {
  const wasFresh = exportsFresh;
  if (!exportsSnapshot) exportsSnapshot = {};
  for (const [key, value] of Object.entries(data)) {
    if (key === 'smb' || key === 'sleephq') {
      const previous = exportsSnapshot[key] || {};
      const failed = syncRequestErrors.get(key);
      const progressed = failed?.check
        ? value.check_state !== undefined && value.check_state !== previous.check_state &&
          ['pending','working','passed'].includes(value.check_state)
        : (value.state !== previous.state && ['pending','working'].includes(value.state)) ||
          (value.last_sync_epoch > 0 && value.last_sync_epoch !== previous.last_sync_epoch);
      if (progressed) syncRequestErrors.delete(key);
      exportsSnapshot[key] = {...previous, ...value};
      for (const group of ['activity', 'last_run']) {
        if (value[group] && typeof value[group] === 'object')
          exportsSnapshot[key][group] = {...previous[group], ...value[group]};
      }
    } else exportsSnapshot[key] = value;
  }
  exportsFresh = true;
  renderExports(wasFresh ? data : null);
}

async function startSync(id, check = false) {
  if (syncRequests.size) return;
  syncRequests.add(id);
  syncRequestErrors.delete(id);
  renderExports();
  try {
    const response = await api('/api/export/' + id + (check ? '?action=check' : ''), {method: 'POST'});
    if (!response) return;
    const data = await response.json();
    if (!response.ok || !data.ok) throw data.error ? new Error(data.error) : uiFailure('sync.requestFailed');
  } catch(e) {
    syncRequestErrors.set(id, {error:e, check});
  } finally {
    syncRequests.delete(id);
    renderExports();
  }
}

function showMsg(el, text, type, timeout) {
  const empty = !uiValue(text).trim();
  // Inline msg element
  if (el) {
    if (el._msgTimer) clearTimeout(el._msgTimer);
    el._msgTimer = null;
    el.style.removeProperty('display');
    uiText(el, empty ? '' : text);
    el.className = empty ? 'msg' : 'msg ' + type;
    if (empty) return;
    if (timeout !== 0) el._msgTimer = setTimeout(() => { el.className = 'msg'; }, timeout || 5000);
    return;
  }
  if (empty) return;
  // Toast
  var tc = document.getElementById('toastContainer');
  if (tc) {
    var toast = document.createElement('div');
    toast.className = 'toast ' + type;
    uiText(toast, text);
    tc.appendChild(toast);
    var dur = timeout || 5000;
    if (dur > 0) setTimeout(function() { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(function() { toast.remove(); }, 300); }, dur);
  }
}

function loadBle() {
  if (bleRead) return bleRead;
  const revision = bleRevision;
  const configRevision = lastStatus.config_revision;
  bleRead = (async () => {
  try {
    const r = await api('/api/ble', undefined, 5000); if (!r) return null;
    if (!r.ok) throw new Error('oxi_status_failed');
    const d = await r.json();
    if (revision !== bleRevision || configRevision !== lastStatus.config_revision) return;
    Object.assign(d, {state:lastStatus.oxi, feeding:lastStatus.feeding,
      spo2:lastStatus.spo2, pulse:lastStatus.pulse});
    const g = document.getElementById('bleStatusGrid'); g.innerHTML = '';
    const fields = {state:d.state,feeding:d.feeding,spo2:d.spo2>=0?d.spo2+'%':'--',pulse:d.pulse>=0?d.pulse+' bpm':'--',auto_start:d.auto_start};
    for (const [k,v] of Object.entries(fields)) {
      const stat = document.createElement('div'); stat.className = 'stat';
      stat.innerHTML = '<span class="k"></span> <span class="v"></span>';
      uiText(stat.querySelector('.k'), uiMessage('ble.field.' + k, {}, k));
      const value = stat.querySelector('.v');
      value.dataset.field = k;
      uiText(value, k === 'state' ? uiMessage('state.' + v, {}, v)
        : ['feeding','auto_start'].includes(k) ? uiMessage('common.' + v, {}, v) : v);
      g.appendChild(stat);
    }
    const fb = document.getElementById('btnFeed');
    if (d.feeding === 'yes') { uiText(fb, uiMessage('ble.stopFeed')); fb.onclick = () => bleAction('stop_feed'); }
    else { uiText(fb, uiMessage('ble.startFeed')); fb.onclick = () => bleAction('start_feed'); }
    var ot = document.getElementById('btnOxiToggle');
    if (ot) uiText(ot, uiMessage(d.state === 'DISABLED' ? 'common.enable' : 'common.disable'));
    const sp = document.getElementById('bleScanSpinner');
    sp.style.display = d.state === 'SCANNING' ? 'inline-block' : 'none';
    renderBleDevices('bleDevices', d.devices || [], false);
    renderBleDevices('bleBonds', d.known || [], true);
    document.getElementById('bleForgetAll').hidden = !d.known || d.known.length < 2;
    updateBleConnections();
    bleLoadedRevision = revision;
    return d;
  } catch(e) { console.error(e); }
  })().finally(() => {
    bleRead = null;
    if ((revision !== bleRevision || configRevision !== lastStatus.config_revision) &&
        document.getElementById('p-bluetooth').classList.contains('active')) loadBle();
  });
  return bleRead;
}

async function bleAction(action, addr, settings = {}, message = 'bleMsg') {
  try {
    const body = {action, ...settings};

}

function appendReleaseNotesInline(parent, value) {
  const token = /(\*\*[^*]+\*\*|\x60[^\x60]+\x60)/g;
  let offset = 0, match;
  while ((match = token.exec(value)) !== null) {
    parent.append(document.createTextNode(value.slice(offset, match.index)));
    const element = document.createElement(match[0][0] === '`' ? 'code' : 'strong');
    const trim = match[0][0] === '`' ? 1 : 2;
    element.textContent = match[0].slice(trim, -trim);
    parent.append(element);
    offset = token.lastIndex;
  }
  parent.append(document.createTextNode(value.slice(offset)));
}

function renderReleaseNotesMarkdown(container, markdown) {
  uiText(container, '');
  const lines = markdown.replace(/\r\n?/g, '\n').split('\n');
  let paragraph = [], list = null, listItem = null, listParagraph = [], code = null;
  const appendParagraph = (parent, values) => {
    if (!values.length) return;
    const element = document.createElement('p');
    appendReleaseNotesInline(element, values.join(' '));
    parent.append(element);
    values.length = 0;
  };
  const closeList = () => {
    if (listItem) appendParagraph(listItem, listParagraph);
    list = null;
    listItem = null;
  };
  const appendCode = () => {
    const pre = document.createElement('pre');
    const element = document.createElement('code');
    element.textContent = code.join('\n');
    pre.append(element);
    container.append(pre);
    code = null;
  };
  for (const line of lines) {
    if (code !== null) {
      if (line.startsWith('```')) appendCode();
      else code.push(line);
      continue;
    }
    if (line.startsWith('```')) {
      appendParagraph(container, paragraph);
      closeList();
      code = [];
      continue;
    }
    const heading = line.match(/^(#{1,6})\s+(.+)$/);
    if (heading) {
      appendParagraph(container, paragraph);
      closeList();
      const element = document.createElement('h' + heading[1].length);
      appendReleaseNotesInline(element, heading[2]);
      container.append(element);
      continue;
    }
    const item = line.match(/^-\s+(.+)$/);
    if (item) {
      appendParagraph(container, paragraph);
      if (listItem) appendParagraph(listItem, listParagraph);
      if (!list) {
        list = document.createElement('ul');
        container.append(list);
      }
      listItem = document.createElement('li');
      appendReleaseNotesInline(listItem, item[1]);
      list.append(listItem);
      continue;
    }
    if (listItem && /^\s{2,}\S/.test(line)) {
      listParagraph.push(line.trim());
      continue;
    }
    if (!line.trim()) {
      appendParagraph(container, paragraph);
      if (listItem) appendParagraph(listItem, listParagraph);
      continue;
    }
    closeList();
    paragraph.push(line.trim());
  }
  appendParagraph(container, paragraph);
  closeList();
  if (code !== null) appendCode();
  if (!container.childNodes.length) uiText(container, uiMessage('ota.notesEmpty'));
}

async function otaShowReleaseNotes() {
  if (!otaStatus?.release_notes_id || !otaStatus.update_version) return;
  const dialog = document.getElementById('otaReleaseNotesDialog');
  if (dialog.open) return;
  const request = {id:otaStatus.release_notes_id, version:otaStatus.update_version, controller:new AbortController()};
  otaNotes = request;
  uiText(document.getElementById('otaReleaseNotesTitle'), uiMessage('ota.notesTitle', {version:request.version}));
  const text = document.getElementById('otaReleaseNotesText');
  uiText(text, uiMessage('ota.notesLoading'));
  text.setAttribute('aria-busy', 'true');
  dialog.showModal();
  let reader = null;
  try {
    const response = await api('/api/ota/release-notes?id=' + request.id,
      {cache:'no-store', signal:request.controller.signal});
    reader = response?.body?.getReader() || null;
    if (otaNotes !== request) return;
    if (response?.status === 404) throw uiFailure('ota.notesUnavailable');
    if (!response?.ok || !reader) throw uiFailure('ota.notesFailed');
    const limit = 32768;
    if (Number(response.headers.get('Content-Length')) > limit) throw uiFailure('ota.notesTooLarge');
    const decoder = new TextDecoder();
    let bytes = 0, markdown = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (otaNotes !== request) return;
      if (done) break;
      bytes += value.byteLength;
      if (bytes > limit) throw uiFailure('ota.notesTooLarge');
      markdown += decoder.decode(value, {stream:true});
    }
    markdown += decoder.decode();
    renderReleaseNotesMarkdown(text, markdown);
  } catch(error) {
    if (otaNotes === request) uiText(text, error.ui || uiMessage('ota.notesFailed'));
  } finally {
    if (reader) { await reader.cancel().catch(() => {}); reader.releaseLock(); }
    if (otaNotes === request) text.setAttribute('aria-busy', 'false');
  }
}

function renderOtaStatus(d, keepMessage = false) {
  var latest = d.update_version || '--';
  if (d.state === 'disabled') latest = uiMessage('ota.checksDisabled');
  else if (d.state === 'checking') latest = uiMessage('ota.checking');
  else if (d.state === 'available') latest = uiMessage('ota.availableVersion', {version:latest});
  uiText(document.getElementById('espFwLatest'), latest);
  var active = espSubmitting || espReady || !!otaWatch?.restarting ||
    ['checking', 'installing', 'rebooting', 'busy'].includes(d.state);
  const installable = d.release_installable === true;
  const versionHint = document.getElementById('otaVersionHint');
  versionHint.hidden = !installable || active || d.version_comparable !== false;
  uiText(versionHint, versionHint.hidden ? '' : uiMessage('ota.versionUncomparable', {version:d.update_version}));

  var check = document.getElementById('btnOtaCheck');
  var install = document.getElementById('btnOtaInstall');
  install.style.display = installable ? '' : 'none';
  uiText(install, d.update_version ? uiMessage('ota.installVersion', {version:d.update_version}) : uiMessage('ota.install'));
  const blocked = d.blocked ? uiMessage('ota.blockedReason', {reason:uiError(d.blocked)}) : '';
  uiText(check, blocked, 'title');
  uiText(install, blocked, 'title');

  var progress = document.getElementById('otaReleaseProgress');
  var bar = document.getElementById('otaReleaseBar');
  if (!espSubmitting && !espReady) {
    progress.style.display = ['installing', 'rebooting'].includes(d.state) ? 'block' : 'none';
    const percent = d.state === 'rebooting' ? 100 : (d.progress || 0);
    bar.style.width = percent + '%';
    uiText(document.getElementById('espProgressText'),
      ['installing', 'rebooting'].includes(d.state) ? percent + '%' : '--');
  }

  var msgEl = document.getElementById('otaReleaseMsg');
  var text = d.state === 'rebooting' ? uiMessage('ota.updateRestarting') :
    d.state === 'installing' ? uiMessage('ota.installingProgress', {progress:d.progress || 0}) :
    d.state === 'checking' ? uiMessage('ota.checkingUpdates') :
    d.state === 'busy' ? uiMessage('ota.operationBusy') :
    d.state === 'error' && d.error ? uiMessage('ota.error', {error:uiError(d.error)}) : '';
  if (!espSubmitting && !espReady && !keepMessage) {
    uiText(msgEl, text);
    msgEl.className = text ? 'msg ' + (d.state === 'error' ? 'err' : 'ok') : 'msg';
  }
  renderEspInstall(d);
}

function applyOtaStatus(d) {
  if (otaStatus && d.revision <= otaStatus.revision) { finishOtaObservation(); return; }
  otaStatus = d;
  renderOtaNotice(d);
  updateOtaNotes(d);
  if (document.getElementById('p-ota').classList.contains('active')) renderOtaStatus(d);
  finishOtaObservation();
}

function finishOtaObservation() {
  if (!otaWatch || !otaStatus) return;
  const d = otaStatus;
  var message = '', type = 'ok';
  const restarted = (otaWatch.version && lastStatus.version && lastStatus.version !== otaWatch.version) ||
    (Number.isFinite(otaWatch.uptime) && Number.isFinite(lastStatus.uptime) && lastStatus.uptime < otaWatch.uptime);
  if (otaWatch.restarting && restarted) {
    espReady = false;
    message = uiMessage('ota.backOnline', {version:lastStatus.version || '--'});
  } else if (d.state === 'error') { message = d.error ? uiMessage('ota.error', {error:uiError(d.error)}) : ''; type = 'err'; }
  else if (otaWatch.restarting) return;
  else if (d.state === 'current' || d.state === 'available') {
    message = d.state === 'available' ? uiMessage('ota.versionAvailable', {version:d.update_version}) : uiMessage('ota.upToDate');
  } else return;
  clearTimeout(otaStatusTimer); otaStatusTimer = null; otaWatch = null;
  renderEspInstall();
  showMsg(document.getElementById('otaReleaseMsg'), message, type, 0);
}

function watchOta(restarting, baseline) {
  if (otaStatusTimer) clearTimeout(otaStatusTimer);
  otaWatch = {restarting, version:baseline.version, uptime:baseline.uptime};
  otaStatusTimer = setTimeout(() => {
    otaStatusTimer = null;
    otaWatch = null;
    showMsg(document.getElementById('otaReleaseMsg'), uiMessage('ota.observationTimeout'), 'err', 0);
  }, 120000);
}

async function otaAction(action, url = '') {
  const restarting = action === 'install';
  const baseline = {...lastStatus};
  const serial = otaSerial;
  var msgEl = document.getElementById('otaReleaseMsg');
  espSubmitting = true;
  if (otaStatus) renderOtaStatus(otaStatus);
  showMsg(msgEl, uiMessage(restarting ? 'ota.startingUpdate' : 'ota.checkingUpdates'), 'ok', 0);
  try {
    var r = await api('/api/ota/' + action + (url ? '?' + new URLSearchParams({url}) : ''), {method:'POST'});
    if (!r) return;
    var d = await r.json();
    if (!r.ok) throw d.error ? new Error(d.error) : uiFailure('ota.requestRejected');
    watchOta(restarting, {version:baseline.version || d.version, uptime:baseline.uptime ?? d.uptime});
    const newerPush = serial !== otaSerial && otaStatus &&
      (otaStatus.revision > d.revision || lastStatus.version !== baseline.version || lastStatus.uptime < baseline.uptime);
    applyOtaStatus(newerPush ? otaStatus : d);
  } catch(e) { showMsg(msgEl, uiMessage('ota.error', {error:uiError(e)}), 'err', 0); }
  finally {
    espSubmitting = false;
    if (otaStatus) renderOtaStatus(otaStatus, true);
  }
}

function otaCheckRelease() { return otaAction('check'); }
function otaInstallRelease() { return otaAction('install'); }

const rfi = document.getElementById('firmwareRepositoryInput');
fi.addEventListener('change', renderResmedStatus);
rfi.addEventListener('change', e => prepareFirmwareUpload(e.target.files[0], true));
const firmwareDrop = document.querySelector('#firmwareRepository .firmware-list');
firmwareDrop.addEventListener('dragover', e => { e.preventDefault(); firmwareDrop.classList.add('dragover'); });
firmwareDrop.addEventListener('dragleave', () => firmwareDrop.classList.remove('dragover'));
