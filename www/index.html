<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirBridge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light dark}
html:not([data-theme-ready]) .app,html:not([data-theme-ready]) .bottom-nav{visibility:hidden}
[hidden]{display:none!important}
.sync-value{overflow-wrap:anywhere;min-width:0;text-align:right}
.sync-note,.sync-error{font-size:12px;margin:10px 0;color:var(--text-dim)}
.sync-error{color:var(--red)}
#syncCards{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));align-items:start}
.sync-card{min-width:0}
.sync-status{block-size:4em;font-size:14px;line-height:1.5;overflow:auto;scrollbar-gutter:stable;margin-bottom:8px}
.sync-status [data-sync="state"]{font-size:16px;font-weight:600;line-height:1.4}
.sync-status [data-sync="file"]{font-size:12px;color:var(--text-dim);overflow-wrap:anywhere}
.sync-status .sync-error{margin:8px 0 0;overflow-wrap:anywhere}
.sync-card[data-sync-tone="good"] [data-sync="state"]{color:var(--green)}
.sync-card[data-sync-tone="active"] [data-sync="state"]{color:var(--cyan)}
.sync-card[data-sync-tone="error"] [data-sync="state"]{color:var(--red)}
.sync-card .time-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:start;font-size:12px;min-block-size:3em}
.sync-card .time-row .value{font-size:12px;text-align:right;min-width:0;overflow-wrap:anywhere}
.sync-card>.time-row{block-size:3.75em;overflow:auto;scrollbar-gutter:stable;line-height:1.5}
.sync-card .btn-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
.sync-card>.btn-row .btn{flex:none;white-space:nowrap}
.sync-actions [data-sync="check-result"]{flex-basis:100%;block-size:1.5em;min-width:0;font-size:12px;line-height:1.5;text-align:right;overflow:auto;overflow-wrap:anywhere;scrollbar-gutter:stable;color:var(--text-dim)}
.sync-actions [data-error="true"]{color:var(--red)}
.sync-details{margin-top:8px;border-top:1px solid var(--border);padding-top:12px;font-size:12px}
.sync-details summary{cursor:pointer;color:var(--text-dim);width:fit-content}
.sync-details h4{font-size:12px;margin-top:16px;color:var(--text-dim)}
.sync-run-heading{display:flex;align-items:center;gap:8px;block-size:1.5em;line-height:1.5;min-width:0}
.sync-run-heading>[data-i18n]{flex:none}
.sync-run-heading [data-sync="run-result"]{flex:1;min-width:0;block-size:1.5em;line-height:1.5;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;text-align:right;font-weight:400}
.sync-run-heading [data-error="true"]{color:var(--red)}
#p-setup .btn-row{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
#p-setup input,#p-setup select{max-width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg,Canvas);color:var(--text,CanvasText);min-height:100vh;overflow:hidden}
button,input,select,textarea{font-family:inherit}
input::file-selector-button{font:inherit}
.app{display:grid;grid-template-columns:220px 1fr;height:100vh}

/* Sidebar */
.sidebar{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar .brand{padding:20px 16px;border-bottom:1px solid var(--border)}
.sidebar .brand h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:0.5px}
.sidebar .brand small{font-size:11px;color:var(--text-dim);display:block;margin-top:2px}
.update-notice{display:block;margin-top:9px;color:var(--orange);font-size:12px;font-weight:600;line-height:1.4;text-decoration:none;overflow-wrap:anywhere}
.update-notice:hover{color:var(--text);text-decoration:underline}
.update-notice:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sidebar nav{flex:1;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--text-dim);text-decoration:none;font-size:16px;cursor:pointer;border-left:3px solid transparent;transition:all 0.15s}
.nav-item:hover{color:var(--text);background:var(--hover)}
.nav-item.active{color:var(--accent);background:var(--accent-dim);border-left-color:var(--accent)}
.icon{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;flex:none}
.icon svg,.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar .left{display:flex;align-items:center;gap:12px}
.topbar .page-title{font-size:16px;font-weight:600}
.live-badge{background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:1px}
.topbar .right{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:8px 16px;min-width:0;font-size:12px;color:var(--text-dim)}
.topbar .wifi-status{display:inline-flex;align-items:center;gap:6px;min-width:0;max-width:100%}
#topSsid{max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wifi-bars{display:inline-flex;align-items:flex-end;flex-shrink:0;gap:2px;height:12px;vertical-align:middle}
.wifi-bars span{width:3px;border-radius:1px;background:var(--signal-off)}
.wifi-bars span:nth-child(1){height:4px}
.wifi-bars span:nth-child(2){height:6px}
.wifi-bars span:nth-child(3){height:9px}
.wifi-bars span:nth-child(4){height:12px}
.wifi-bars span.on{background:var(--accent)}
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* Panes */
.pane{display:none;max-width:1080px}.pane.active{display:block}

/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.dashboard-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.dashboard-grid>.card{min-width:0;margin-bottom:0}
.dashboard-grid .time-row{gap:12px;flex-wrap:wrap}
.dashboard-grid .time-row .value{font-size:12px;margin-left:auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:12px}
.card h3{color:var(--accent);margin-bottom:12px;font-size:14px;text-transform:uppercase;letter-spacing:0.5px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card-header .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)}
.card-title{font-size:18px;font-weight:600;margin-bottom:4px}
.storage-meter{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:4px}
.storage-meter-fill{height:100%;background:var(--accent);width:0}
#dashStorageSummary{font-size:12px;text-align:right}

/* Badges */
.badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:12px;letter-spacing:0.5px;text-transform:uppercase}
.badge-therapy{background:var(--success-bg);color:var(--green);border:1px solid var(--success-border)}
.badge-streaming{background:var(--info-bg);color:var(--cyan);border:1px solid var(--info-border)}
.badge-idle{background:var(--idle-bg);color:var(--text-dim);border:1px solid var(--border)}
.badge-error{background:var(--error-bg);color:var(--red);border:1px solid var(--error-border)}
.badge-feed{background:var(--success-bg);color:var(--green);border:1px solid var(--success-border)}

/* Rows, fields */
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--separator)}
.row:last-child{border-bottom:none}
.setting-group{margin-top:14px}
.setting-group .setting-group{margin-left:12px}
.setting-group h4{font-size:13px;color:var(--text);margin-bottom:4px}
.row label{flex:1;font-size:14px}
.row select,.row input[type=number],.row input[type=date]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;min-width:140px;font-size:14px}
#p-report .row{gap:12px;flex-wrap:wrap}
#p-report .btn-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.report-controls{display:flex;align-items:flex-end;gap:10px 16px;flex-wrap:wrap}
#p-report .report-controls .row{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding:0;border:0}
#p-report .report-controls label{font-size:12px;color:var(--text-dim)}
#p-report .report-controls .btn-row{align-self:flex-end}
.report-date-controls{display:flex;gap:4px}
.report-date-controls .btn{padding:7px 9px}
.report-note{font-size:12px;color:var(--text-dim);margin:12px 0;line-height:1.5}
.report-note:empty{display:none}
#reportAvailability{display:block;min-height:1.5em}
#reportGrid .stat{gap:12px;align-items:baseline}
.report-result-head{position:relative;display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.report-result-head h3{margin-bottom:16px}
.report-selection{font-size:12px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.report-load-state{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:6px;height:14px;white-space:nowrap;font-size:11px;color:var(--text-dim)}
.report-load-state .spinner{flex:none;margin:0;width:14px;height:14px;border-width:2px}
#reportStatsCard{container-type:inline-size}
.report-metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.report-metric{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:'label label' 'value spark' 'unit delta';grid-template-rows:16px 28px 20px;gap:3px 4px;align-items:center;min-width:0;text-align:left;padding:8px;border:1px solid var(--border);border-top:2px solid var(--metric-color);border-radius:5px;background:var(--bg);color:var(--text);font:inherit}
.report-metric-label{grid-area:label;white-space:nowrap}
.report-metric-unit{grid-area:unit;white-space:nowrap}
.report-metric-label,.report-metric-unit{font-size:11px;color:var(--text-dim)}
.report-metric-value{grid-area:value;font-size:20px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.report-metric[aria-expanded]{cursor:pointer}
.report-metric[aria-expanded]:hover,.report-metric[aria-expanded=true]{background:var(--border)}
.report-metric:focus-visible{outline:2px solid var(--metric-color);outline-offset:2px}
.report-metric svg{grid-area:spark;justify-self:end;width:48px;height:22px}
.report-metric[data-metric=usage] .report-metric-value{grid-column:1/-1}
.report-metric[data-metric=usage] svg{grid-area:unit;justify-self:start}
.report-metric-delta{grid-area:delta;justify-self:end;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.report-history{margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px}
.report-history svg{display:block;width:100%;height:auto;max-height:180px;color:var(--text-dim)}
.report-history-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;margin-bottom:6px}
.report-events{display:flex;flex-wrap:wrap;gap:8px 18px;margin:12px 0 18px;font-size:12px;font-variant-numeric:tabular-nums}
.report-events span{white-space:nowrap}
.report-events b{margin-left:6px}
@container(max-width:900px){.report-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container(max-width:520px){.report-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.report-statistics>summary{cursor:pointer;font-size:12px;color:var(--text-dim);padding:4px 0}
.report-statistics[open]>summary{margin-bottom:8px}
.report-stat-source{margin-left:8px;color:var(--text-dim);font-size:10px}
.report-settings{margin-top:16px}
.report-channel-options{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.report-channel-options .btn{padding:4px 9px;font-weight:500}
.report-channel-options .btn[aria-pressed=true]{background:var(--accent-dim);border-color:var(--accent)}
.report-channel-options .btn[aria-pressed=false]{color:var(--text-dim)}
.report-interval{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--border)}
.report-interval:last-child{border-bottom:none}
.report-sessions{display:flex;flex-wrap:wrap;gap:8px}
.report-session{border:1px solid var(--accent);border-radius:999px;padding:5px 10px;background:var(--accent-dim);color:var(--accent);font:inherit;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.report-session[aria-pressed=false]{border-color:var(--border);background:transparent;color:var(--text-dim);text-decoration:line-through}
.report-picker{position:relative}
.report-calendar{position:absolute;left:0;top:calc(100% + 6px);z-index:10;width:262px;max-width:calc(100vw - 72px);padding:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px var(--shadow)}
.report-calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:13px}
.report-calendar-head .btn{padding:4px 10px}
.report-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.report-calendar-grid span{text-align:center;padding:5px 0;font-size:11px;color:var(--text-dim)}
.report-calendar-grid button{position:relative;border:0;border-radius:5px;padding:8px 0;background:transparent;color:var(--text);font:inherit;font-size:12px;cursor:pointer}
.report-calendar-grid button:disabled{color:var(--text-dim);opacity:.35;cursor:default}
.report-calendar-grid button:not(:disabled)::after{content:'';position:absolute;bottom:2px;left:calc(50% - 2px);width:4px;height:4px;border-radius:50%;background:var(--accent)}
.report-calendar-grid button[aria-pressed=true]{background:var(--border);font-weight:700}
.interval-duration{font-size:12px;color:var(--text-dim);white-space:nowrap}
.interval-range{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.report-table-wrap{overflow-x:auto}
.report-table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
.report-table th,.report-table td{padding:8px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.report-table th:first-child,.report-table td:first-child{text-align:left}
.report-plots canvas{display:block;width:100%;touch-action:pan-y;cursor:crosshair}
.report-plots canvas:focus{outline:none}
.report-plots canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.report-chart-surface{position:relative}
.report-plot-overlay{position:absolute;inset:18px 8px 22px 44px;overflow:hidden;pointer-events:none}
.report-plot-cursor{position:absolute;top:0;bottom:0;border-left:1px dashed var(--cursor);transform:translateX(-.5px)}
.report-plot-selection{position:absolute;top:0;bottom:0;box-sizing:border-box;background:var(--selection);border:1px solid var(--cyan)}
.report-plots .chart-card{margin:8px 0;padding:10px 16px}
.report-chart-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:11px}
.report-chart-legend span{white-space:nowrap}
#reportSeriesNote{margin:4px 0}
#reportSeriesNote{display:block;min-height:18px}
.report-chart-head,.report-chart-toolbar{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.report-chart-head{margin-bottom:4px}
.report-chart-value{margin-left:auto;color:var(--text);white-space:nowrap}
.report-chart-toolbar{color:var(--text-dim)}
.report-chart-toolbar h3{margin:0}
.report-chart-actions{display:flex;align-items:center;gap:8px}
.report-chart-actions .btn{padding:8px 12px;min-width:36px}
#reportSessions{margin:12px 0}
#reportCursor{min-width:8ch;color:var(--text);font-variant-numeric:tabular-nums}
.row input[type=number]{width:100px}
input[type=text],input[type=password]{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 10px;width:200px;font-size:14px}

/* Buttons */
.btn{padding:8px 20px;border:1px solid var(--border-light);border-radius:8px;background:transparent;color:var(--text);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:0.3px;transition:all 0.15s}
a.btn{display:inline-block;text-decoration:none}
a.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn:hover{background:var(--hover-strong);border-color:var(--text-dim)}
.btn:disabled,.btn[aria-disabled=true]{opacity:0.4;cursor:not-allowed}
.btn-accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn-accent:hover{background:var(--accent-hover)}
.btn-danger{background:var(--danger-bg);color:var(--danger-ink);border-color:var(--danger-bg)}
.btn-danger:hover{background:var(--danger-hover)}
.btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-row{margin-top:12px;text-align:right}
.icon-button{display:inline-flex;align-items:center;justify-content:center;width:32px;height:30px;padding:4px;flex:none}
.icon-button svg{width:18px;height:18px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-picker{position:relative;flex:none}
.theme-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:20;min-width:180px;max-width:calc(100vw - 32px);max-height:70vh;overflow-y:auto;padding:6px;background:var(--card,Canvas);border:1px solid var(--border-light);border-radius:8px;box-shadow:0 8px 24px var(--shadow)}
.theme-menu .btn{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;text-align:left;padding:8px 10px;border-color:transparent;letter-spacing:0}
.theme-menu .btn>span:last-of-type{min-width:0;overflow-wrap:anywhere}
.theme-menu .btn[aria-checked=true]{color:var(--accent);background:var(--accent-dim)}
.theme-menu .btn[aria-checked=true]::after{content:'\2713';margin-left:auto}
.theme-menu .icon{width:18px;height:18px}

/* Status grid */
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 32px}
.stat{padding:6px 0;font-size:14px;display:flex;justify-content:space-between;border-bottom:1px solid var(--separator)}
.stat:last-child{border-bottom:none}
.stat .k{color:var(--text-dim)}
.stat .v{color:var(--text);font-weight:500;text-align:right;padding-right:8px}

/* Configuration */
#configCategories{margin:16px 0}
#configFields .btn-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
[data-config-form][data-loading="1"]::before{content:'Loading...';display:block;color:var(--text-dim);margin:12px 0}
.config-section-title{color:var(--accent);margin:16px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
[data-config-form] .row{gap:16px}
[data-config-form] label{min-width:0;overflow-wrap:anywhere}
[data-config-form] label small{display:block;color:var(--text-dim);font-weight:normal;margin-top:4px;line-height:1.4}
#configWifi{padding:12px 0;border-bottom:1px solid var(--border);margin-bottom:8px}

/* Device info */
.device-info{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.device-info .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px}
.device-info .value{font-size:14px;font-weight:500}

/* Time rows */
.time-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.time-row:last-child{border-bottom:none}
.time-row .label{font-size:12px;color:var(--text-dim)}
.time-row .value{font-size:14px;font-family:'SF Mono','Consolas',monospace;font-weight:500}

/* Oximeter card */
.dashboard-grid .oxi-source-row{flex-wrap:nowrap;align-items:center}
.oxi-source-value{min-width:0;text-align:right}
.oxi-source-name{display:block;font-size:13px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oxi-address{display:block;min-height:16px;font:11px/16px 'SF Mono',Consolas,monospace;color:var(--text-dim)}
.oxi-values{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.oxi-metric{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px}
.oxi-metric .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px}
.oxi-metric .big{font-size:32px;font-weight:700;line-height:1.2}
.oxi-metric .unit{font-size:12px;font-weight:400;color:var(--text-dim);margin-left:2px}
.ble-device{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;padding:12px 0;border-bottom:1px solid var(--border)}
.ble-device:last-child{border-bottom:none}
.ble-device-info{flex:1;min-width:0}
.ble-device-name{display:block;font-size:14px;font-weight:500;overflow-wrap:anywhere}
.ble-device-address{display:block;margin-top:4px;color:var(--text-dim);font:11px 'SF Mono',Consolas,monospace;overflow-wrap:anywhere}
.ble-device-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ble-device-actions .btn{padding:8px 14px;white-space:nowrap}
.ble-device-actions .ble-auto{min-width:144px}
.ble-empty{color:var(--text-dim);font-size:13px;padding:8px 0}

/* Charts */
.chart-card{background:var(--chart-card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px;overflow:hidden}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.chart-header .label{font-size:12px;color:var(--text-dim)}
.chart-header .value{font-size:20px;font-weight:700;font-family:monospace}
.chart-header .unit{font-size:12px;color:var(--text-dim);margin-left:4px}
.chart-row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.telemetry-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.telemetry-header h3{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text)}

/* Upload */
.upload-area{border:2px dashed var(--border);border-radius:8px;padding:40px;text-align:center;margin:12px 0;cursor:pointer}
.upload-area.dragover{border-color:var(--accent);background:var(--hover)}
.firmware-note{font-size:13px;color:var(--text-dim);overflow-wrap:anywhere;margin:10px 0}
.firmware-note:empty{display:none}
#firmwareRepositoryState{display:block;height:1.4em;line-height:1.4;overflow:auto;margin:8px 0}
.firmware-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.firmware-toolbar .btn{white-space:nowrap}
.firmware-section-title{margin:22px 0 12px;color:var(--blue);font-size:12px;font-weight:500;text-transform:uppercase}
.firmware-messages{display:block;width:100%;height:150px;resize:vertical;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);padding:10px 12px;margin:8px 0 4px;font:12px/1.6 monospace}
.firmware-card{font-size:14px}
.firmware-card .row{gap:16px}
.firmware-card .row>label{flex:1}
.firmware-card .value{min-width:0;max-width:70%;text-align:right;overflow-wrap:anywhere}
.firmware-card input[type=file],.firmware-card input[type=url]{max-width:100%;width:300px;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:inherit}
.firmware-card .btn{font-size:inherit}
.firmware-card .btn-group{justify-content:flex-start;margin-top:12px}
#firmwareEntries .storage-row{grid-template-columns:minmax(0,1fr) auto}
@media(max-width:768px){
  .firmware-card .row{flex-wrap:wrap}
  .firmware-card .row:has(input,select)>label{flex-basis:100%}
  .firmware-card .row>select,.firmware-card input[type=file],.firmware-card input[type=url]{width:100%;max-width:100%}
  #firmwareEntries .storage-row{grid-template-columns:minmax(0,1fr)}
  #firmwareEntries .storage-entry-actions{justify-content:flex-start}
  #firmwareRepositoryState{height:2.8em}
}
.firmware-list{border:1px solid var(--border-light);border-radius:8px;overflow:hidden;background:var(--surface);min-height:60px}
.firmware-list.dragover{border-color:var(--accent);background:var(--hover)}
.firmware-dialog{width:min(440px,calc(100vw - 32px));box-sizing:border-box;padding:22px;border:1px solid var(--border-light);border-radius:10px;background:var(--surface);color:var(--text)}
.firmware-dialog::backdrop{background:rgba(0,0,0,.55)}
.firmware-dialog h3{margin:0 0 16px}
.firmware-dialog label{display:flex;align-items:center;gap:8px;margin:20px 0}
.firmware-dialog .btn-row{display:flex;justify-content:flex-end;gap:8px}
#firmwareEntries .storage-entry-actions{grid-column:auto;flex-wrap:wrap}
.progress{height:6px;background:var(--border);border-radius:3px;margin-top:12px;overflow:hidden;display:none}
.progress .bar{height:100%;background:var(--accent);width:0;transition:width 0.3s}

/* Messages */
.msg{padding:8px 12px;border-radius:6px;margin:8px 0;font-size:13px;display:none}
.msg.ok{display:block;background:var(--success-bg);color:var(--green);border:1px solid var(--success-border)}
.msg.err{display:block;background:var(--error-bg);color:var(--red);border:1px solid var(--error-border)}

/* Toast */
.toast-container{position:fixed;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:12px 20px;border-radius:8px;font-size:13px;font-weight:500;animation:slideIn 0.3s ease;min-width:240px;box-shadow:0 4px 20px var(--shadow);pointer-events:auto}
.toast.ok{background:var(--success-bg);color:var(--green);border:1px solid var(--success-border)}
.toast.err{background:var(--error-bg);color:var(--red);border:1px solid var(--error-border)}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}

/* Storage */
#storageUsage{font-size:12px;color:var(--text-dim);margin-bottom:16px}
.storage-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#storagePath,#firmwareRepositoryPath{flex:1 1 200px;min-width:0;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font:12px 'SF Mono',Consolas,monospace;overflow-wrap:anywhere}
.storage-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-bottom:12px}
#storageEntries:not(:empty){border:1px solid var(--border-light);border-radius:8px;overflow:hidden;background:var(--surface)}
.storage-row{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--border)}
.storage-row:last-child{border-bottom:none}
.storage-row:hover{background:var(--hover-soft)}
.storage-row input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.storage-row a{color:var(--text);font-size:14px;font-weight:600;text-decoration:none;overflow-wrap:anywhere;cursor:pointer}
.storage-row a:hover{color:var(--accent)}
.storage-row a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.storage-row small{display:block;color:var(--text-dim);margin-top:4px;font:11px 'SF Mono',Consolas,monospace;overflow-wrap:anywhere;line-height:1.5}
.storage-row .storage-download{width:38px;height:34px;padding:0;font-size:20px;line-height:1}
.storage-entry-actions{display:flex;gap:8px;align-items:center}
#storageMessage{font-size:12px;color:var(--text-dim);line-height:1.5;height:3em;overflow:auto;margin:10px 0}
.storage-pagination{display:flex;align-items:center;gap:8px;margin-top:12px}
#storagePage{font-size:12px;color:var(--text-dim);margin:0 4px}

/* Spinner */
.spinner{display:none;border:3px solid var(--border-light);border-top:3px solid var(--accent);border-radius:50%;width:20px;height:20px;animation:spin 0.8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Bottom nav */
.bottom-nav{display:none;background:var(--surface);border-top:1px solid var(--border);justify-content:flex-start;padding:8px 0;padding-bottom:calc(8px + env(safe-area-inset-bottom));overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.bottom-nav .bnav-item{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text-dim);cursor:pointer;padding:4px 10px;text-decoration:none;flex-shrink:0;white-space:nowrap}
.bottom-nav .bnav-item .icon{width:22px;height:22px}
.bottom-nav .bnav-item .icon svg{width:21px;height:21px}
.bottom-nav .bnav-item.active{color:var(--accent)}
#otaNavMobile .icon{position:relative}
.update-badge{position:absolute;top:-2px;right:-4px;width:10px;height:10px;border:2px solid var(--surface);border-radius:50%;background:var(--orange)}

/* Release notes */
#otaVersionHint{font-size:13px;line-height:1.5;color:var(--text-dim);margin:12px 0;overflow-wrap:anywhere}
.release-notes-dialog{margin:auto;width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);overflow:hidden}
.release-notes-dialog[open]{display:flex;flex-direction:column}
.release-notes-dialog::backdrop{background:var(--shadow)}
.release-notes-header{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:16px;border-bottom:1px solid var(--border);flex:none}
.release-notes-header h2{font-size:17px;line-height:1.4;overflow-wrap:anywhere;min-width:0}
.release-notes-header .btn{flex:none;min-height:44px}
.release-notes-body{padding:16px;overflow:auto;min-height:0;line-height:1.6;font-size:14px;overflow-wrap:anywhere}
.release-notes-body :is(h1,h2,h3,h4,h5,h6){font-size:14px;line-height:1.4;margin:20px 0 10px;color:var(--accent)}
.release-notes-body h1{font-size:18px}.release-notes-body h2{font-size:16px}
.release-notes-body>:first-child{margin-top:0}
.release-notes-body p,.release-notes-body ul,.release-notes-body pre{margin:10px 0}
.release-notes-body ul{padding-left:22px}.release-notes-body li{margin:5px 0}
.release-notes-body code{font:12px 'SF Mono',Consolas,monospace;background:var(--surface);border-radius:4px;padding:2px 4px}
.release-notes-body pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;background:var(--surface);border-radius:6px}
.release-notes-body pre code{padding:0}

/* Responsive */
@media(pointer:coarse){
  .icon-button{width:44px;height:44px}
}
@media(max-width:768px){
  [data-config-form] .row{flex-direction:column;align-items:stretch;gap:8px}
  [data-config-form] .row input,[data-config-form] .row select{width:100%}
  #p-setup .row{flex-direction:column;align-items:stretch;gap:8px}
  #p-setup .row input{width:100%}
  body{display:flex;flex-direction:column;min-height:0;height:100vh;height:100dvh}
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr);height:auto;flex:1;min-height:0}
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .content{padding:16px}
  .card-grid{grid-template-columns:1fr}
  .chart-row-2{grid-template-columns:1fr}
  .topbar{padding:10px 16px}
  .topbar .page-title{font-size:14px}
  .ble-device{flex-direction:column;align-items:stretch}
  .ble-device-actions{justify-content:flex-end}
  .ble-device-actions .btn{flex:1}
  .ble-device-actions .ble-auto{flex-basis:100%}
  .status-grid{grid-template-columns:1fr}
  #storagePath{flex-basis:100%}
  .storage-actions .btn{width:100%}
  .storage-row{gap:8px;padding:10px}
  .storage-entry-actions{grid-column:2 / -1;justify-content:flex-end}
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>AirBridge</h1>
      <small id="ver"></small>
      <small id="verBuild" style="color:var(--text-faint)"></small>
      <a id="otaUpdateNotice" class="update-notice" href="#ota" data-tab="ota" hidden></a>
    </div>
    <nav>
      <a class="nav-item active" data-tab="status"><span class="icon"><svg aria-hidden="true"><use href="#icon-dashboard"/></svg></span> <span data-i18n="nav.dashboard"></span></a>
      <a class="nav-item" data-tab="report"><span class="icon"><svg aria-hidden="true"><use href="#icon-report"/></svg></span> <span data-i18n="nav.report"></span></a>
      <a class="nav-item" data-tab="sync" hidden><span class="icon"><svg aria-hidden="true"><use href="#icon-sync"/></svg></span> <span data-i18n="nav.sync"></span></a>
      <a class="nav-item" data-tab="clinical"><span class="icon"><svg aria-hidden="true"><use href="#icon-clinical"/></svg></span> <span data-i18n="nav.clinical"></span></a>
      <a class="nav-item" data-tab="bluetooth"><span class="icon"><svg aria-hidden="true"><use href="#icon-oximetry"/></svg></span> <span data-i18n="nav.oximetry"></span></a>
      <a class="nav-item" data-tab="console"><span class="icon"><svg aria-hidden="true"><use href="#icon-console"/></svg></span> <span data-i18n="nav.console"></span></a>
      <a class="nav-item" data-tab="storage" hidden><span class="icon"><svg aria-hidden="true"><use href="#icon-storage"/></svg></span> <span data-i18n="nav.storage"></span></a>
      <a class="nav-item" data-tab="device"><span class="icon"><svg aria-hidden="true"><use href="#icon-config"/></svg></span> <span data-i18n="nav.config"></span></a>
      <a class="nav-item" data-tab="ota"><span class="icon"><svg aria-hidden="true"><use href="#icon-ota"/></svg></span> <span data-i18n="nav.ota"></span></a>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="left">
        <span id="liveIndicator" style="width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block" title="" data-i18n-title="status.sseConnected"></span>
      </div>
      <div class="right">
        <span id="topUptime">--</span>
        <span class="wifi-status">
          <span id="topWifi" class="wifi-bars" title="--"><span></span><span></span><span></span><span></span></span>
          <span id="topSsid">WiFi: --</span>
        </span>
        <span title="" data-i18n-title="status.freeMemory"><span id="topHeap">-- heap</span><span id="topPsram" hidden></span></span>
        <button class="btn icon-button" id="refreshButton" type="button" onclick="loadStatus()" aria-label="" data-i18n-aria-label="common.refresh" title="" data-i18n-title="common.refresh"><svg aria-hidden="true"><use href="#icon-refresh"/></svg></button>
        <div class="theme-picker" id="themePicker">
          <button class="btn icon-button" id="themeButton" type="button" disabled aria-haspopup="menu" aria-expanded="false" aria-controls="themeMenu" data-i18n-aria-label="theme.title" data-i18n-title="theme.title" onclick="toggleThemeMenu()"><svg aria-hidden="true"><use id="themeIcon" href="#icon-auto"/></svg></button>
          <div class="theme-menu" id="themeMenu" role="menu" data-i18n-aria-label="theme.title" hidden></div>
        </div>
      </div>
    </div>

    <div class="content">

      <!-- STATUS / DASHBOARD -->
      <div class="pane" id="p-status">
        <div class="card-grid dashboard-grid">
          <div class="card">
            <div class="card-header">
              <span class="label"><span data-i18n="status.device"></span></span>
              <span class="badge badge-idle" id="dashRopBadge"><span data-i18n="common.standby"></span></span>
            </div>
            <div class="card-title" id="dashPna">--</div>
            <div class="time-row">
              <span class="label"><span data-i18n="status.serial"></span></span>
              <span class="value" id="dashSrn">--</span>
            </div>
            <div class="time-row">
              <span class="label"><span data-i18n="status.therapyMode"></span></span>
              <span class="value" id="dashMode">--</span>
            </div>
            <div class="time-row">
              <span class="label"><span data-i18n="status.motorHours"></span></span>
              <span class="value" id="dashMhr">--</span>
            </div>
            <div class="btn-group">
              <button class="btn" onclick="ropCmd('start')" id="btnTherapy" style="font-size:11px;padding:6px 14px"><span data-i18n="common.therapy"></span></button>
              <button class="btn" onclick="ropCmd('standby')" id="btnStandby" style="font-size:11px;padding:6px 14px"><span data-i18n="common.standby"></span></button>
              <button class="btn" onclick="ropCmd('energy_save')" id="btnPwrSave" style="font-size:11px;padding:6px 14px"><span data-i18n="status.powerSave"></span></button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <span class="label"><span data-i18n="status.system"></span></span>
            </div>
            <div class="time-row">
              <span class="label"><span data-i18n="status.airbridgeTime"></span></span>
              <span class="value" id="dashEspTime">--</span>
            </div>
            <div class="time-row">
              <span class="label"><span data-i18n="status.resmedTime"></span></span>
              <span class="value" id="dashResmedTime">--</span>
            </div>
            <div class="btn-group">
              <button class="btn" style="font-size:11px;padding:6px 14px" onclick="timeAction('ntp_sync')">NTP</button>
              <button class="btn" style="font-size:11px;padding:6px 14px" onclick="timeAction('sync_to_resmed')"><span data-i18n="status.toResmed"></span></button>
              <button class="btn" style="font-size:11px;padding:6px 14px" onclick="timeAction('sync_from_resmed')"><span data-i18n="status.fromResmed"></span></button>
            </div>
            <div class="time-row">
              <span class="label"><span data-i18n="common.sd"></span></span>
              <span class="value" id="dashStorageSummary">--</span>
            </div>
            <div class="storage-meter" id="dashStorageMeter" role="meter" aria-label="" data-i18n-aria-label="status.sdUsage" aria-valuemin="0" aria-valuemax="100" hidden>
              <div class="storage-meter-fill" id="dashStorageFill"></div>

          </div>

          <div class="card">
            <div class="card-header">
              <span class="label"><span data-i18n="nav.oximetry"></span></span>

              </div>
              <div class="oxi-metric">
                <div><span class="big" style="color:var(--cyan)" id="dashPulse">--</span><span class="unit">bpm</span></div>
                <div class="label">Pulse Rate</div>
              </div>
            </div>
            <div class="time-row oxi-source-row">
              <span class="label"><span data-i18n="common.source"></span></span>
              <div class="oxi-source-value">
                <span class="oxi-source-name" id="dashOxiName">--</span>
                <span class="oxi-address" id="dashOxiAddr"></span>
              </div>
            </div>
            <div class="time-row">
              <span class="label">AirSense</span>
              <span class="badge badge-idle" id="dashFeedBadge"><span data-i18n="status.feedUnknown"></span></span>
            </div>
          </div>
        </div>

        <!-- Hidden status grid for renderStatus compatibility -->
        <div class="spinner" id="statusSpinner"></div>

        <!-- Telemetry -->
        <div class="telemetry-header">
          <h3><span data-i18n="status.live"></span></h3>
        </div>

        <div class="chart-card">
          <div class="chart-header">
            <span class="label">Mask Pressure</span>
            <div><span class="value" style="color:var(--cyan)" id="chartPressVal">--</span><span class="unit"> cmH2O</span></div>
          </div>
          <canvas id="cPress" height="140"></canvas>
        </div>

        <div class="chart-card">
          <div class="chart-header">
            <span class="label">Flow Rate</span>
            <div><span class="value" style="color:var(--blue)" id="chartFlowVal">--</span><span class="unit"> L/min</span></div>
          </div>
          <canvas id="cFlow" height="140"></canvas>
        </div>

        <div class="chart-card">
          <div class="chart-header">
            <span class="label">Mask Leak</span>
            <div><span class="value" style="color:var(--orange)" id="chartLeakVal">--</span><span class="unit"> L/min</span></div>
          </div>
          <canvas id="cLeak" height="120"></canvas>
        </div>

        <div class="chart-row-2">
          <div class="chart-card">
            <div class="chart-header">
              <span class="label">SpO2</span>
              <div><span class="value" style="color:var(--green)" id="chartSpo2Val">--</span><span class="unit"> %</span></div>
            </div>
            <canvas id="cSpo2" height="100"></canvas>
          </div>
          <div class="chart-card">

<script>
const UI_CATALOGS = /* UI_CATALOGS */ {};
let uiLanguage = null;
let uiPluralRules = new Intl.PluralRules('en');
const uiFormatters = new Map();
const uiBindings = new WeakMap();
const UI_ATTRIBUTES = {'data-i18n':'textContent', 'data-i18n-title':'title',
  'data-i18n-placeholder':'placeholder', 'data-i18n-aria-label':'aria-label'};

function resolveUiLanguage(override) {
  if (Object.hasOwn(UI_CATALOGS, override)) return override;
  for (const preference of navigator.languages?.length ? navigator.languages : [navigator.language]) {
    const tag = String(preference || '').toLowerCase();
    const supported = Object.keys(UI_CATALOGS).find(language => language.toLowerCase() === tag) || tag.split('-')[0];
    if (Object.hasOwn(UI_CATALOGS, supported)) return supported;
  }

}

function uiNumber(value, maximumFractionDigits = 2, minimumFractionDigits = 0) {
  const key = 'number:' + maximumFractionDigits + ':' + minimumFractionDigits;
  if (!uiFormatters.has(key)) uiFormatters.set(key, new Intl.NumberFormat(uiLanguage,
    {maximumFractionDigits, minimumFractionDigits}));
  return uiFormatters.get(key).format(value);
}

function uiDate(value, options) {
  const key = 'date:' + JSON.stringify(options);
  if (!uiFormatters.has(key)) uiFormatters.set(key, new Intl.DateTimeFormat(uiLanguage,
    {timeZone:'UTC', ...options}));
  return uiFormatters.get(key).format(value);
}

function uiMessage(key, params = {}, fallback) {

}

function uiClockMessage(value) {
  const match = /^(\d{4}-\d\d-\d\d)[ T](\d\d:\d\d)(:\d\d)?(?: (.*))?$/.exec(value || '');
  if (!match) return value || '--';
  return uiMessage('common.value', {value:{items:[{date:Date.parse(match[1] + 'T' + match[2] + (match[3] || ':00') + 'Z'),
    options:{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',
      ...(match[3] ? {second:'2-digit'} : {}),hourCycle:'h23'}},match[4]].filter(Boolean),separator:' '}});
}

function uiValue(value) {
  if (value?.key) return t(value.key, value.params, value.fallback);
  if (value?.items) return value.items.map(uiValue).join(value.separator);
  if (value?.date !== undefined) return uiDate(value.date, value.options);
  if (value?.number !== undefined) return Number.isFinite(value.number)
    ? uiNumber(value.number, value.max ?? 2, value.min ?? 0) : '--';
  return typeof value === 'number' ? uiNumber(value) : String(value ?? '');
}

function uiError(error) {
  if (error?.ui) return error.ui;
  const code = error?.message ?? error;
  return UI_CATALOGS.en['error.' + code] ? uiMessage('error.' + code) : String(code ?? '');
}

function uiFailure(key, params = {}) {
  return Object.assign(new Error(key), {ui:uiMessage(key, params)});
}

function t(key, params = {}, fallback = key) {
  let value = UI_CATALOGS[uiLanguage]?.[key] ?? UI_CATALOGS.en?.[key];
  if (value === undefined) return String(fallback);
  if (typeof value === 'object') value = value[uiPluralRules.select(params.count)] ?? value.other;
  return String(value).replace(/\{(\w+)\}/g, (_, name) => {
    return uiValue(params[name]);
  });
}

function uiText(el, value, attribute = 'textContent') {
  if (!el) return;
  const marker = Object.keys(UI_ATTRIBUTES).find(key => UI_ATTRIBUTES[key] === attribute);
  let bindings = uiBindings.get(el);
  if (value?.key) {
    if (!bindings) { bindings = {}; uiBindings.set(el, bindings); }
    bindings[attribute] = value;
    el.setAttribute(marker, value.key);
    value = t(value.key, value.params, value.fallback);
  } else {
    if (bindings) delete bindings[attribute];
    el.removeAttribute(marker);
  }
  if (attribute === 'textContent') el.textContent = value ?? '';
  else el.setAttribute(attribute, value ?? '');
}

function translateUi(root = document) {
  const selector = Object.keys(UI_ATTRIBUTES).map(key => '[' + key + ']').join(',');
  const elements = [...root.querySelectorAll(selector)];
  if (root.matches?.(selector)) elements.unshift(root);
  for (const el of elements) {
    for (const [marker, attribute] of Object.entries(UI_ATTRIBUTES)) {
      if (!el.hasAttribute(marker)) continue;
      const bound = uiBindings.get(el)?.[attribute];
      const value = bound ? t(bound.key, bound.params, bound.fallback) : t(el.getAttribute(marker));
      if (attribute === 'textContent') el.textContent = value;
      else el.setAttribute(attribute, value);
    }

}

function applyUiLanguage(override) {
  const language = resolveUiLanguage(override);
  if (language === uiLanguage && document.documentElement.lang === language) return;
  uiLanguage = language;
  uiPluralRules = new Intl.PluralRules(language);
  uiFormatters.clear();
  document.documentElement.lang = language;
  translateUi();
  if (reportPlot.summary) {
    renderReportMetrics(reportPlot.summary);
    renderReportHistory();
  }
  if (!document.getElementById('reportCalendar').hidden) {
    const day = document.activeElement?.dataset.day;
    renderReportCalendar();
    if (day) document.querySelector('#reportCalendar [data-day="'+day+'"]')?.focus();
  }
  if (reportPlot.view) scheduleReportDraw();
  if (document.getElementById('p-status').classList.contains('active')) updateCharts();
}

const G = {};
let settings = [], curMode = 0;

const themeCatalog = /* UI_THEMES */ [];
const uiThemeMedia = window.matchMedia('(prefers-color-scheme: dark)');
let uiThemePreference = 'auto', uiTheme = null, themeSaving = false;
let themeTarget = null, themePending = null, themeStyle = null;
let chartPalette = {};

for (const theme of [{id:'auto'}, ...themeCatalog]) {
  const choice = document.createElement('button');
  choice.type = 'button'; choice.className = 'btn'; choice.tabIndex = -1;
  choice.dataset.themeChoice = theme.id;
  choice.setAttribute('role', 'menuitemradio');
  const icon = theme.id === 'auto' ? 'auto' : theme.scheme === 'light' ? 'sun' : 'moon';
  choice.innerHTML = '<span class="icon"><svg aria-hidden="true"><use href="#icon-' + icon + '"/></svg></span>';
  const label = document.createElement('span');
  uiText(label, uiMessage('config.option.ui_theme.' + theme.id, {}, theme.id));
  choice.append(label);
  choice.addEventListener('click', () => selectUiTheme(theme.id));
  document.getElementById('themeMenu').append(choice);
}

function renderThemePicker() {
  const button = document.getElementById('themeButton');
  button.disabled = lastStatus.ui_theme === undefined;
  button.setAttribute('aria-disabled', String(themeSaving || button.disabled));
  button.setAttribute('aria-busy', String(themeSaving || !!themePending));
  const label = uiMessage('theme.current', {theme:uiMessage('config.option.ui_theme.' + uiThemePreference, {}, uiThemePreference)});
  uiText(button, label, 'aria-label');
  uiText(button, label, 'title');
  document.getElementById('themeIcon').setAttribute('href', uiThemePreference === 'auto'
    ? '#icon-auto' : themeCatalog.find(theme => theme.id === uiThemePreference)?.scheme === 'light' ? '#icon-sun' : '#icon-moon');
  for (const choice of document.querySelectorAll('[data-theme-choice]')) {
    choice.disabled = themeSaving;
    choice.setAttribute('aria-checked', String(choice.dataset.themeChoice === uiThemePreference));
  }
}

function applyUiTheme(preference, retry = false) {
  if (preference === undefined) return;
  const selected = themeCatalog.some(theme => theme.id === preference) ? preference : 'auto';
  const changed = selected !== uiThemePreference;
  uiThemePreference = selected;
  const id = uiThemePreference === 'auto' ? (uiThemeMedia.matches ? 'dark' : 'light') : uiThemePreference;
  renderThemePicker();
  if (id === themeTarget && (themePending || (!retry && !changed))) return;
  themeTarget = id;
  themePending?.remove(); themePending = null;
  if (id === uiTheme) { renderThemePicker(); return; }

  const link = document.createElement('link');
  link.rel = 'stylesheet'; link.href = themeCatalog.find(theme => theme.id === id).url;
  // Keep the current palette until its replacement is loaded; ignore superseded loads.
  link.media = 'not all';
  link.onload = () => {
    if (themePending !== link) return;
    themeStyle?.remove(); themeStyle = link; themePending = null;
    link.media = 'all'; uiTheme = id;
    const root = document.documentElement;
    root.dataset.theme = id; root.dataset.themeReady = '';
    const style = getComputedStyle(root);
    chartPalette = Object.fromEntries(['plot-bg','plot-text','plot-grid','plot-zero','blue','cyan',
      'orange','green','red','violet','magenta','slate','yellow','pink'].map(name =>
        [name, style.getPropertyValue('--' + name).trim()]));
    if (reportPlot.view) scheduleReportDraw();
    if (document.getElementById('p-status').classList.contains('active')) updateCharts();
    renderThemePicker();
  };
  link.onerror = () => {
    if (themePending !== link) return;
    link.remove(); themePending = null;
    document.documentElement.dataset.themeReady = '';
    renderThemePicker();
    showMsg(null, uiMessage('theme.loadFailed', {theme:uiMessage('config.option.ui_theme.' + id, {}, id)}), 'err');
  };
  themePending = link;
  document.head.append(link);
  renderThemePicker();
}

function closeThemeMenu(restoreFocus = false) {
  const menu = document.getElementById('themeMenu');
  if (menu.hidden) return;
  menu.hidden = true;
  const button = document.getElementById('themeButton');
  button.setAttribute('aria-expanded', 'false');
  if (restoreFocus) button.focus();
}

function toggleThemeMenu() {
  const menu = document.getElementById('themeMenu');
  if (!menu.hidden) { closeThemeMenu(true); return; }
  if (themeSaving || document.getElementById('themeButton').disabled) return;
  menu.hidden = false;
  document.getElementById('themeButton').setAttribute('aria-expanded', 'true');
  menu.querySelector('[aria-checked="true"]').focus();
}

async function selectUiTheme(preference) {
  if (themeSaving || (preference !== 'auto' && !themeCatalog.some(theme => theme.id === preference))) return;
  closeThemeMenu(true);
  if (preference === uiThemePreference) { applyUiTheme(preference, true); return; }
  themeSaving = true;
  renderThemePicker();
  try {
    const r = await api('/api/config', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ui_theme:preference})}, 5000);
    if (!r) return;
    const data = await r.json();
    if (!r.ok || data.ok !== true || data.saved !== 1)
      throw new Error(data.error || 'config_save_failed');
    // Only the owner status confirms the effective preference; never replay a lost write.
    if (!await loadStatus()) throw new Error('status_read_failed');
  } catch(e) {
    showMsg(null, uiMessage('common.error', {detail:uiError(e)}), 'err');
  } finally {
    themeSaving = false;
    renderThemePicker();
  }
}

document.addEventListener('pointerdown', event => {
  if (!document.getElementById('themePicker').contains(event.target)) closeThemeMenu();
});
document.getElementById('themePicker').addEventListener('focusout', event => {
  if (!event.currentTarget.contains(event.relatedTarget)) closeThemeMenu();
});
document.getElementById('themePicker').addEventListener('keydown', event => {
  const menu = document.getElementById('themeMenu');
  if (event.key === 'Escape' && !menu.hidden) {
    event.preventDefault(); closeThemeMenu(true); return;
  }
  if (!['ArrowDown','ArrowUp','Home','End'].includes(event.key)) return;
  if (menu.hidden) toggleThemeMenu();
  if (menu.hidden) return;
  event.preventDefault();
  const choices = [...menu.querySelectorAll('button')];
  const current = choices.indexOf(document.activeElement);
  const next = event.key === 'Home' ? 0 : event.key === 'End' ? choices.length-1
    : (current + (event.key === 'ArrowUp' ? -1 : 1) + choices.length) % choices.length;
  choices[next].focus();
});
uiThemeMedia.addEventListener('change', () => {
  if (themeTarget !== null && uiThemePreference === 'auto') applyUiTheme('auto');
});

// SSE
let evtSrc = null;
let liveEvtSrc = null;
function updateLiveSubscription() {
  const wanted = !document.hidden && document.getElementById('p-status').classList.contains('active');
  if (!wanted) {
    if (liveEvtSrc) liveEvtSrc.close();
    liveEvtSrc = null;
    return;
  }
  if (liveEvtSrc) return;
  liveEvtSrc = new EventSource('/events/live');
  liveEvtSrc.addEventListener('live', e => {
    try { updateChartsFromPush(JSON.parse(e.data)); } catch(ex) {}
  });
  liveEvtSrc.onopen = () => backfillLive();
}
document.addEventListener('visibilitychange', updateLiveSubscription);
function initSSE() {
  if (evtSrc) evtSrc.close();
  evtSrc = new EventSource('/events');
  evtSrc.addEventListener('status', e => {
    try { updateStatusFromPush(JSON.parse(e.data)); } catch(ex) { console.error('SSE status:', ex); }
  });
  evtSrc.addEventListener('exports', e => {
    try {
      const data = JSON.parse(e.data);
      applyExports(data);
    } catch(ex) { console.error(ex); }
  });
  evtSrc.addEventListener('ota', e => {
    try { otaSerial++; applyOtaStatus(JSON.parse(e.data)); } catch(ex) { console.error(ex); }
  });
  evtSrc.addEventListener('wifi', e => {
    const revision = JSON.parse(e.data).revision;
    if (revision === wifiRevision) return;
    wifiRevision = revision;
    wifiSerial++;
    // Refresh WiFi list if Config tab is active
    var pane = document.getElementById('p-device');
    if (pane && pane.classList.contains('active') && configSection === 'network') loadWifiNets();
    if (setupActive() && setupStep === 'network') loadSetupWifi();
  });
  evtSrc.onerror = () => {
    resmedDisconnected();
    if (themeTarget === null) applyUiTheme('auto');
    exportsFresh = false;
    renderExports();
    if (otaWatch) showMsg(document.getElementById('otaReleaseMsg'), uiMessage('ota.connectionLost'), 'err', 0);
    if (otaNotes) closeOtaNotes();
    var li = document.getElementById('liveIndicator');
    if (li) li.style.background = 'var(--text-faint)';
  };
  evtSrc.onopen = () => {
    resmedDisconnected(true);
    wifiRevision = null;
    wifiSerial++;
    otaSerial++;
    otaStatus = null;
    renderOtaNotice(null);
    updateOtaNotes(null);
    exportsSnapshot = null;
    bleLoadedRevision = null;
    reportReconnect();
    wakeClinicalRequests();
    var li = document.getElementById('liveIndicator');
    if (li) li.style.background = '';
  };
}

let lastStatus = {};
let statusRead = null, statusSerial = 0;
const statusPush = {};
let uiStarted = false;
function applyConfigRevision(d) {
  if (d.config_revision !== undefined && lastStatus.config_revision !== undefined &&
      d.config_revision !== lastStatus.config_revision) {
    document.querySelectorAll('[data-config-form]').forEach(root => { root.dataset.stale = '1'; });
    bleLoadedRevision = null;
  }
}
function updateStatusFromPush(d) {
  statusSerial++;
  applyConfigRevision(d);
  appendFirmwareProgress(d);
  Object.assign(statusPush, d);
  Object.assign(lastStatus, d);
  renderStatus(d);
  if (setupActive()) renderSetupDevice();
  updateBleFromPush(d);

}

function updateBleFromPush(d) {
  if (d.ble_revision !== undefined) bleRevision = d.ble_revision;
  // Update dashboard oxi card from any push
  var st = d.oxi || d.state;
  const dashboard = document.getElementById('p-status').classList.contains('active');
  if (st && dashboard) {
    var b = document.getElementById('dashOxiBadge');
    if (b) {
      uiText(b, uiMessage('state.' + st, {}, st));
      b.className = 'badge ' + (st === 'STREAMING' ? 'badge-streaming' : st === 'DISCONNECTED' ? 'badge-idle' : 'badge-idle');
    }
  }
  if (dashboard && (d.oxi_addr !== undefined || d.oxi_name !== undefined)) {
    const address = d.oxi_addr !== undefined ? d.oxi_addr : lastStatus.oxi_addr;
    const name = d.oxi_name !== undefined ? d.oxi_name : lastStatus.oxi_name;
    const label = document.getElementById('dashOxiName');
    label.textContent = name || address || '--';
    label.title = name || address || '';
    document.getElementById('dashOxiAddr').textContent = name ? address || '' : '';
  }
  if (d.feeding !== undefined && dashboard) {
    var fb = document.getElementById('dashFeedBadge');
    if (fb) {
      uiText(fb, uiMessage('status.feed', {state:uiMessage('common.' + d.feeding)}));
      fb.className = 'badge ' + (d.feeding === 'yes' ? 'badge-feed' : 'badge-idle');
    }
  }
  if (d.spo2 !== undefined && dashboard) {
    var s = document.getElementById('dashSpo2');
    if (s) s.textContent = d.spo2 >= 0 ? d.spo2 : '--';
  }
  if (d.pulse !== undefined && dashboard) {
    var p = document.getElementById('dashPulse');
    if (p) p.textContent = d.pulse >= 0 ? d.pulse : '--';
  }

  // BLE tab updates
  var pane = document.getElementById('p-bluetooth');
  if (!pane || !pane.classList.contains('active')) return;
  var g = document.getElementById('bleStatusGrid');
  if (!g || !g.children.length) { loadBle(); return; }
  if (bleRevision !== bleLoadedRevision) loadBle();
  var fields = {
    state: st, feeding: d.feeding,
    spo2: d.spo2 === undefined ? undefined : d.spo2 >= 0 ? d.spo2 + '%' : '--',
    pulse: d.pulse === undefined ? undefined : d.pulse >= 0 ? d.pulse + ' bpm' : '--'
  };
  for (var k in fields) {
    if (fields[k] === undefined) continue;
    var el = g.querySelector('[data-field="' + k + '"]');
    if (el) uiText(el, k === 'state' ? uiMessage('state.' + fields[k], {}, fields[k])
      : k === 'feeding' ? uiMessage('common.' + fields[k], {}, fields[k]) : fields[k]);
  }
  var sp = document.getElementById('bleScanSpinner');
  if (sp && st) sp.style.display = st === 'SCANNING' ? 'inline-block' : 'none';
  if (d.feeding !== undefined) {
    const feed = document.getElementById('btnFeed');
    uiText(feed, uiMessage(d.feeding === 'yes' ? 'ble.stopFeed' : 'ble.startFeed'));
    feed.onclick = () => bleAction(lastStatus.feeding === 'yes' ? 'stop_feed' : 'start_feed');
  }
  if (st) uiText(document.getElementById('btnOxiToggle'), uiMessage(st === 'DISABLED' ? 'common.enable' : 'common.disable'));
  if (st || d.oxi_addr !== undefined) updateBleConnections();
}

function appendLiveSamples(d, reset = false) {
  if (!Number.isInteger(d.seq)) return false;
  const samples = d.samples || [];
  const delta = liveSeq === null || reset ? samples.length : (d.seq - liveSeq) & 0xffff;
  if (liveSeq !== null && !reset && (delta === 0 || delta >= 0x8000)) return false;
  if (reset) for (const k in waveData) waveData[k].length = 0;
  const count = Math.min(delta, samples.length);
  if (count) {
    samples.slice(-count).forEach(s => {
      waveData.press.push(s[0]);
      waveData.flow.push(s[1]);
      waveData.leak.push(s[2]);
    });
    for (const k in waveData) { while (waveData[k].length > WAVE_PTS) waveData[k].shift(); }
  }
  liveSeq = d.seq;
  return true;
}

function updateChartsFromPush(d) {
  // SSE and HTTP backfill can overlap. Append only samples newer than liveSeq.
  if (!appendLiveSamples(d)) return;
  updateCharts(false);
}

function updateOxiChart(d) {
  if (d.spo2 === undefined || !Number.isFinite(d.sample_ms)) return;
  const bucket = Math.floor(d.sample_ms / 2000);
  if (bucket === slowBucket) return;
  if (slowBucket !== null && bucket < slowBucket) {
    slowData.spo2.length = slowData.pulse.length = 0;
    slowBucket = null;
  }
  const gaps = slowBucket === null ? 0 : Math.min(SLOW_PTS - 1, bucket - slowBucket - 1);
  for (const [key, value] of Object.entries({spo2:d.spo2, pulse:d.pulse})) {
    for (let i = 0; i < gaps; i++) slowData[key].push(-32768);
    slowData[key].push(value >= 0 ? value : -32768);
    if (slowData[key].length > SLOW_PTS) slowData[key].splice(0, slowData[key].length - SLOW_PTS);
  }
  slowBucket = bucket;
  if (!document.hidden && document.getElementById('p-status').classList.contains('active')) updateCharts(true);
}

// Initial setup shares Config forms and the existing status/WiFi events.
let setupStep = 'network';
let setupBusy = false;
let setupWifiRead = null;
const SETUP_STEPS = ['network', 'airsense', 'time', 'smb', 'sleephq', 'access'];

function setupActive() {
  return document.getElementById('p-setup').classList.contains('active');
}

function rememberSetup(step) {
  try { sessionStorage.setItem('airbridge.setup', step); } catch(e) {}
}

function setupSteps() {
  return SETUP_STEPS.filter(id => configStorageSupported || (id !== 'smb' && id !== 'sleephq'));
}

function setupLock(busy) {
  setupBusy = busy;
  document.querySelectorAll('#setupActions button, #setupForms input, #setupForms select, #setupForms button, #setupNetwork input').forEach(button => { button.disabled = busy; });
  document.getElementById('setupBack').disabled = busy || setupSteps().indexOf(setupStep) === 0;
}

function renderSetupDevice() {
  const el = document.getElementById('setupDevice');
  const state = lastStatus.system;
  const identity = [lastStatus.pna, lastStatus.srn].filter(Boolean).join(' | ');
  uiText(el, uiMessage(!state || state === 'ERROR' ? 'setup.deviceUnknown' : 'setup.deviceStatus',
    {state:uiMessage('state.' + state, {}, state), identity}));
}

function setupNetworkSelected() {
  const mode = document.querySelector('#setup-network [data-key="wifi_mode"]');
  if (mode && mode.value === '1' && document.getElementById('setupSsid').value) mode.value = '0';
}

async function loadSetupWifi() {
  if (setupWifiRead) return setupWifiRead;
  const serial = wifiSerial;
  setupWifiRead = (async () => {
    try {
      const r = await api('/api/wifi', undefined, 5000);
      if (!r || !r.ok) throw new Error('wifi_read_failed');
      const d = await r.json();
      if (serial !== wifiSerial) return null;
      uiText(document.getElementById('setupWifiStatus'), uiMessage('setup.wifiState',
        {state:uiMessage('wifi.state.' + d.state, {}, d.state), ssid:d.ssid || '--',
          saved:d.networks.map(n => n.ssid).join(', ') || uiMessage('common.none')}));
      const link = document.getElementById('setupWifiLink');
      link.hidden = !d.ip;
      if (d.ip) { link.href = 'http://' + d.ip + '/wizard'; uiText(link, uiMessage('setup.continueAt', {ip:d.ip})); }
      return d;
    } catch(e) {
      showMsg(document.getElementById('setupMsg'), uiError(e), 'err');
      return null;
    } finally {
      setupWifiRead = null;
      if (serial !== wifiSerial && setupActive() && setupStep === 'network') loadSetupWifi();
    }
  })();
  return setupWifiRead;
}

async function renderSetup() {
  setupLock(true);
  try {
    const steps = setupSteps();
    const index = steps.indexOf(setupStep);
    rememberSetup(setupStep);
    uiText(document.getElementById('setupTitle'), uiMessage('setup.' + setupStep + '.title'));
    uiText(document.getElementById('setupProgress'), uiMessage('setup.progress', {step:index + 1, total:steps.length}));
    uiText(document.getElementById('setupNote'), uiMessage('setup.' + setupStep + '.note'));
    document.getElementById('setupNetwork').hidden = setupStep !== 'network';
    document.getElementById('setupDevice').hidden = setupStep !== 'airsense';
    uiText(document.getElementById('setupNext'), uiMessage(setupStep === 'access' ? 'setup.finish' : 'setup.saveNext'));
    uiText(document.getElementById('setupSkip'), uiMessage(setupStep === 'access' ? 'setup.keepAccess' : 'common.skip'));
    uiText(document.getElementById('setupMsg'), '');
    document.getElementById('setupMsg').className = 'msg';
    const forms = document.getElementById('setupForms');
    Array.from(forms.children).forEach(root => { root.hidden = true; });
    if (setupStep !== 'airsense') {
      let root = document.getElementById('setup-' + setupStep);
      if (!root) {
        root = document.createElement('div');
        root.id = 'setup-' + setupStep;
        root.dataset.configForm = setupStep;
        forms.appendChild(root);
      }
      root.hidden = false;
      if (!root.children.length || root.dataset.stale === '1')
        await loadConfigFields(root, setupStep, 'setupMsg');
      if (setupStep === 'network') {
        const mode = root.querySelector('[data-key="wifi_mode"]');
        if (mode) {
          // Unsafe modes remain available in Config, not in the AP setup flow.
          Array.from(mode.options).forEach(option => { if (['2', '3'].includes(option.value)) option.remove(); });
          if (!mode.value) mode.value = '0';
        }
        await loadSetupWifi();
      }
    } else renderSetupDevice();
    document.getElementById('setupTitle').focus();
  } finally { setupLock(false); }
}

async function startSetup() {
  if (setupBusy) return;
  showTab('setup');
  document.getElementById('setupActions').hidden = false;
  document.getElementById('setupFinish').hidden = true;
  let stored;
  try { stored = sessionStorage.getItem('airbridge.setup'); } catch(e) {}
  if (!Object.hasOwn(lastStatus, 'onboarding_complete')) {
    setupLock(true);
    const status = await loadStatus();
    setupLock(false);
    if (!status) {
      showMsg(document.getElementById('setupMsg'), uiMessage('setup.statusFailed'), 'err');
      document.getElementById('setupNext').disabled = true;
      document.getElementById('setupSkip').disabled = true;
      return;
    }

  setupStep = setupSteps().includes(stored) ? stored : 'network';

async function setupMove(direction, skip = false) {
  if (setupBusy) return;
  setupLock(true);
  try {
    const root = document.getElementById('setup-' + setupStep);
    if (direction > 0) {
      if (!skip && setupStep !== 'airsense') {
        if (!root || !root.children.length) {
          await renderSetup();
          return;
        }
        if (setupStep === 'network') {
          const ssid = document.getElementById('setupSsid');
          const pass = document.getElementById('setupPass');
          const wifi = await loadSetupWifi();
          if (!wifi) return;
          const mode = root.querySelector('[data-key="wifi_mode"]');
          if (mode.value !== '1' && !ssid.value && !wifi.networks.some(n => n.enabled === '1'))
            throw new Error('setup_network_required');
          if (ssid.value) {
            const idx = wifi.networks.findIndex(n => n.ssid === ssid.value);
            if (!await wifiAction(idx < 0 ? 'add' : 'update', ssid.value, pass.value,
                idx < 0 ? undefined : idx, 'setupMsg')) return;
            ssid.value = ''; pass.value = '';
          }
        }
        if (setupStep !== 'access' && !await saveConfig(root.id, 'setupMsg')) return;
      }
      if (setupStep === 'access') {
        const changes = skip ? {} : collectConfigChanges(root);
        if (!confirmAccessChange(root, changes)) return;
        // Do not issue authenticated background requests across a login change.
        if (evtSrc) { evtSrc.close(); evtSrc = null; }
        const r = await api('/api/onboarding', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(changes)});
        if (!r) { initSSE(); return; }
        const d = await r.json();
        if (!r.ok || d.ok !== true) throw new Error(d.error || 'setup_save_failed');
        lastStatus.onboarding_complete = 1;
        rememberSetup('done');
        document.getElementById('setupForms').innerHTML = '';
        document.getElementById('setupActions').hidden = true;
        document.getElementById('setupFinish').hidden = false;
        uiText(document.getElementById('setupNote'), uiMessage(Object.keys(changes).length ? 'setup.credentials' : 'setup.complete'));
        return;
      }
      if (skip && root) root.innerHTML = '';
      if (skip && setupStep === 'network') {
        document.getElementById('setupSsid').value = '';
        document.getElementById('setupPass').value = '';
      }
    }
    const steps = setupSteps();
    setupStep = steps[Math.max(0, steps.indexOf(setupStep) + direction)];
  } catch(e) {
    if (!evtSrc) initSSE();
    showMsg(document.getElementById('setupMsg'), uiMessage('setup.notConfirmed', {detail:uiError(e)}), 'err');
    return;
  } finally { setupLock(false); }
  await renderSetup();
}

function wifiSignalLevel(rssi) {
  var v = Number(rssi);
  if (!Number.isFinite(v) || v >= 0) return 0;

  if (v >= -75) return 2;

    if (!r) return;
    if (!r.ok) throw new Error("status_read_failed");
    const data = await r.json();

}

let reportGeneration = 0;
let reportController = null, reportRevision = null, reportEpoch = 0, reportPublishedSource = null;
let reportDataRevision = null, reportArtifactRevision = null, reportDataEpoch = 0, reportLoading = false, reportDirty = false, reportRefreshQueued = false;
const reportReads = {};
const reportCalendar = {days:[], month:null, cache:null, epoch:0};
// Origin-local therapy data. Failure/denial of IndexedDB only loses persistence,
// never access to the live API or the bounded RAM cache.
const reportBinary = {ram:new Map(), bytes:0, db:null, opening:null, flights:new Map()};
async function reportDatabase() {
  if (reportBinary.opening) return reportBinary.opening;
  reportBinary.opening = new Promise(resolve => {
    try {
      const request = indexedDB.open('airbridge-report-artifacts-v1',1);
      request.onupgradeneeded = () => {
        const store = request.result.createObjectStore('entries',{keyPath:'key'});
        store.createIndex('updated','updated');
        request.result.createObjectStore('accounting');
      };
      request.onsuccess = () => {
        reportBinary.db = request.result;
        reportBinary.db.onversionchange = () => { reportBinary.db.close(); reportBinary.db = null; };
        resolve(reportBinary.db);
      };
      request.onerror = request.onblocked = () => resolve(null);
    } catch { resolve(null); }
  });

}

function reportRememberBinary(key,value) {
  const bytes = value instanceof ArrayBuffer ? value.byteLength : JSON.stringify(value).length*2;
  const previous = reportBinary.ram.get(key);
  reportBinary.bytes -= previous?.bytes || 0;
  reportBinary.ram.delete(key);
  if (bytes <= 32*1024*1024) {
    reportBinary.ram.set(key,{value,bytes}); reportBinary.bytes += bytes;
  }
  while (reportBinary.bytes > 32*1024*1024 || reportBinary.ram.size > 2048) {
    const oldest = reportBinary.ram.keys().next().value;
    reportBinary.bytes -= reportBinary.ram.get(oldest).bytes; reportBinary.ram.delete(oldest);
  }
  return bytes;
}

async function reportCachedBinary(key) {
  if (reportBinary.ram.has(key)) return reportBinary.ram.get(key).value;
  const db = await reportDatabase();
  if (!db) return null;
  const value = await new Promise(resolve => {
    try {
      const request = db.transaction('entries').objectStore('entries').get(key);
      request.onsuccess = () => resolve(request.result?.value ?? null);
      request.onerror = () => resolve(null);
    } catch { resolve(null); }
  });
  if (value !== null) reportRememberBinary(key,value);
  return value;
}

async function reportStoreBinary(key,value) {
  const bytes = reportRememberBinary(key,value), db = await reportDatabase();
  if (!db || bytes > 256*1024*1024) return;
  await new Promise(resolve => {
    try {
      const tx = db.transaction(['entries','accounting'],'readwrite'), entries = tx.objectStore('entries');
      tx.oncomplete = tx.onabort = tx.onerror = () => resolve();
      const old = entries.get(key);
      old.onsuccess = () => {
        const accounting = tx.objectStore('accounting'), request = accounting.get('size');
        request.onsuccess = () => {
          let total = (request.result?.bytes || 0) - (old.result?.bytes || 0) + bytes;
          let count = (request.result?.count || 0) + (old.result ? 0 : 1);
          entries.put({key,value,bytes,updated:Date.now()});
          const cursor = entries.index('updated').openCursor();
          cursor.onsuccess = () => {
            const row = cursor.result;
            if (row && (total > 256*1024*1024 || count > 16384)) {
              if (row.value.key !== key) { total -= row.value.bytes; count--; row.delete(); }
              row.continue();
            } else accounting.put({bytes:total,count},'size');
          };
        };
      };
    } catch { resolve(); }
  });
}

function reportMergeRanges(ranges) {
  const merged = [];
  for (const range of [...ranges].sort((a,b) => a.first-b.first)) {
    const previous = merged.at(-1);
    if (previous && range.first <= previous.last+1) previous.last = Math.max(previous.last,range.last);
    else merged.push({...range});
  }
  return merged;
}

function reportMissingRanges(ranges, parts) {
  const covered = reportMergeRanges(parts), missing = [];
  for (const range of ranges) {
    let first = range.first;
    for (const part of covered) {
      if (part.last < first) continue;
      if (part.first > range.last) break;
      if (part.first > first) missing.push({first,last:part.first-1});
      first = Math.max(first,part.last+1);
    }
    if (first <= range.last) missing.push({first,last:range.last});
  }
  return missing;
}

async function reportCachedArtifactParts(prefix, bytes, ranges) {
  const parts = [];
  const extent = key => {
    if (!key.startsWith(prefix)) return null;
    const suffix = key.slice(prefix.length), match = /^(\d+)-(\d+)$/.exec(suffix);
    const range = suffix === 'all' ? {first:0,last:bytes-1}
      : match ? {first:Number(match[1]),last:Number(match[2])} : null;
    return range && Number.isSafeInteger(range.first) && Number.isSafeInteger(range.last)
      && range.first >= 0 && range.last >= range.first && range.last < bytes ? range : null;
  };
  const needed = range => range && reportMissingRanges(ranges,parts)
    .some(gap => gap.first <= range.last && gap.last >= range.first);
  const add = (range, buffer) => {
    if (buffer instanceof ArrayBuffer && buffer.byteLength === range.last-range.first+1)
      parts.push({...range,buffer});
  };
  const cache = {parts, refresh() {
    for (const [key,entry] of reportBinary.ram) {
      const range = extent(key);
      if (needed(range)) add(range,entry.value);
    }
  }};
  cache.refresh();
  if (!reportMissingRanges(ranges,parts).length) return cache;
  const db = await reportDatabase();
  if (!db) return cache;
  // Discover legacy and merged extents by key, without loading unrelated tiles.
  const keys = await new Promise(resolve => {
    const found = [];
    try {
      const cursor = db.transaction('entries').objectStore('entries')
        .openKeyCursor(IDBKeyRange.bound(prefix,prefix+'\uffff'));
      cursor.onsuccess = () => {
        const row = cursor.result;
        if (!row) { resolve(found); return; }
        found.push(row.primaryKey); row.continue();
      };
      cursor.onerror = () => resolve(found);
    } catch { resolve(found); }
  });
  for (const key of keys) {
    const range = extent(key);
    if (needed(range)) add(range,await reportCachedBinary(key));
  }
  return cache;
}

function decodeReportRanges(response, buffer, ranges, bytes, full) {
  if (ranges.length === 1) {
    const {first,last} = ranges[0];
    if (!full && response.headers.get('Content-Range') !== 'bytes '+first+'-'+last+'/'+bytes)
      throw new Error('Invalid artifact range');
    if (buffer.byteLength !== last-first+1) throw new Error('Incomplete artifact');
    return [{first,last,buffer}];
  }
  const type = response.headers.get('Content-Type') || '';
  const match = /^multipart\/byteranges;\s*boundary=(?:"([\w-]{1,70})"|([\w-]{1,70}))$/i.exec(type);
  if (!match) throw new Error('Invalid artifact multipart type');
  const boundary = match[1] || match[2], text = new TextDecoder(), parts = [];
  let at = 0;
  // Advance by declared binary lengths, never by searching inside sample data.
  for (const {first,last} of ranges) {
    const head = text.decode(new Uint8Array(buffer,at,Math.min(512,buffer.byteLength-at)));
    const end = head.indexOf('\r\n\r\n');
    if (end < 0 || !head.startsWith('--'+boundary+'\r\n') || /[^\x20-\x7e\r\n]/.test(head.slice(0,end)))
      throw new Error('Incomplete artifact multipart header');
    const lines = head.slice(0,end).split('\r\n');
    const extent = lines.filter(line => /^content-range:/i.test(line));
    if (extent.length !== 1 || extent[0].toLowerCase() !== 'content-range: bytes '+first+'-'+last+'/'+bytes)
      throw new Error('Invalid artifact multipart range');
    at += end+4;
    const length = last-first+1;
    if (at+length+2 > buffer.byteLength || text.decode(new Uint8Array(buffer,at+length,2)) !== '\r\n')
      throw new Error('Incomplete artifact multipart data');
    parts.push({first,last,buffer:buffer.slice(at,at+length)}); at += length+2;
  }
  if (text.decode(new Uint8Array(buffer,at)) !== '--'+boundary+'--\r\n')
    throw new Error('Invalid artifact multipart end');
  return parts;
}

async function reportArtifactRanges(dataset, artifact, document, signal, requested) {
  if (!/^[a-f0-9]{64}$/.test(artifact.digest) || !Number.isInteger(artifact.bytes) || artifact.bytes <= 0)
    throw new Error('Invalid artifact identity');

      throw new Error('Invalid artifact range');

      const headers = full ? {} : {Range:'bytes='+batch.map(range => range.first+'-'+range.last).join(',')};
      const response = await api('/api/report/artifact?day='+encodeURIComponent(artifact.day)

      const fetched = decodeReportRanges(response,await response.arrayBuffer(),batch,artifact.bytes,full);
      // A malformed/truncated multipart response publishes none of its parts.
      for (const part of fetched) await reportStoreBinary(prefix+part.first+'-'+part.last,part.buffer);
      return fetched;
