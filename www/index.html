  }
  return requested.map(({first,last}) => {
    const whole = parts.find(part => part.first <= first && part.last >= last);
    if (whole) return whole.first === first && whole.last === last ? whole.buffer : whole.buffer.slice(first-whole.first,last-whole.first+1);
    const out = new Uint8Array(last-first+1);
    for (const part of parts) {
      const start = Math.max(first,part.first), end = Math.min(last,part.last);
      if (start <= end) out.set(new Uint8Array(part.buffer,start-part.first,end-start+1),start-first);
    }
    return out.buffer;
  });
}

async function reportArtifactBytes(dataset, artifact, document, signal, first = null, last = null) {
  const buffers = await reportArtifactRanges(dataset,artifact,document,signal,
    [{first:first ?? 0,last:first === null ? artifact.bytes-1 : last}]);
  return buffers[0];
}

const reportSignalIds = ['Flow','Press','EprPress','MaskPress','Leak','MinVent','RespRate','TidVol','SpO2','Pulse','FlowLim','Snore','TgtVent','Ti','IERatio','AlvMinVent'];
function decodeReportMetadata(buffer, bytes) {
  const view = new DataView(buffer), text = new TextDecoder();
  if (buffer.byteLength < 64 || text.decode(new Uint8Array(buffer,0,8)) !== 'ABTILE01'
      || view.getUint16(8,true) !== 1 || view.getUint32(12,true) !== bytes || view.getUint16(18,true) !== 512)
    throw new Error('Unsupported artifact');
  const length = view.getUint16(10,true), count = view.getUint16(16,true);
  if (length > 4672 || length > buffer.byteLength || length < 64 || !count || count > 16) throw new Error('Invalid artifact header');
  let crc = 0xffffffff;
  for (let i = 0; i < length; i++) {
    crc ^= i >= 60 && i < 64 ? 0 : view.getUint8(i);
    for (let bit = 0; bit < 8; bit++) crc = (crc >>> 1) ^ (crc & 1 ? 0xedb88320 : 0);
  }
  if (((crc ^ 0xffffffff) >>> 0) !== view.getUint32(60,true)) throw new Error('Artifact metadata checksum');
  if (view.getBigUint64(52,true) !== 0n) throw new Error('Unsupported artifact flags');
  const tracks = [], ids = new Set(); let at = 64, offset = length;
  const string = (offset,length) => {
    const data = new Uint8Array(buffer,offset,length), end = data.indexOf(0);
    if (end < 0) throw new Error('Invalid artifact string');
    return text.decode(data.subarray(0,end));
  };
  for (let c = 0; c < count; c++) {
    if (at+96 > length) throw new Error('Truncated track');
    const id = view.getUint16(at,true), levels = view.getUint16(at+2,true), samples = view.getUint32(at+4,true);
    const origin = Number(view.getBigInt64(at+8,true)), record = Number(view.getBigUint64(at+16,true));
    const spr = view.getUint32(at+24,true), dmin = view.getInt32(at+28,true), dmax = view.getInt32(at+32,true);
    const pmin = view.getFloat64(at+40,true), pmax = view.getFloat64(at+48,true);
    if (!reportSignalIds[id] || ids.has(id) || !spr || !levels || levels > 12 || view.getUint32(at+36,true)
        || !Number.isSafeInteger(origin) || !Number.isSafeInteger(record) || record <= 0
        || dmin >= dmax || dmin < -32768 || dmax > 32767 || !Number.isFinite(pmin) || !Number.isFinite(pmax) || pmin >= pmax)
      throw new Error('Invalid track');
    ids.add(id);
    const track = {id:reportSignalIds[id],unit:string(at+56,16),label:string(at+72,24),samples,origin,
      step:record/spr/1000,scale:(pmax-pmin)/(dmax-dmin),bias:pmin-dmin*(pmax-pmin)/(dmax-dmin),levels:[]};
    if (track.step < 1 || samples*track.step > 86400000) throw new Error('Invalid track axis');
    at += 96; let factor = 1;
    for (let l = 0; l < levels; l++,factor *= 4) {
      if (at+16 > length) throw new Error('Truncated level');
      const size = Math.ceil(samples/factor), tile = l ? 4096 : 1088, total = Math.ceil(size/512)*tile;
      if (view.getUint32(at,true) !== factor || view.getUint32(at+4,true) !== size
          || view.getUint32(at+8,true) !== offset || view.getUint32(at+12,true) !== total || offset+total > bytes)
        throw new Error('Invalid level layout');
      track.levels.push({factor,count:size,offset,bytes:total,tile}); offset += total; at += 16;
    }
    if (track.levels.at(-1).count > 512 || (levels > 1 && track.levels.at(-2).count <= 512)) throw new Error('Invalid pyramid');
    tracks.push(track);
  }
  if (at !== length || offset !== bytes) throw new Error('Invalid artifact length');
  return tracks;
}

async function reportArtifactTracks(manifest, artifact, signal) {
  const first = await reportArtifactBytes(manifest.dataset,artifact,false,signal,0,Math.min(artifact.bytes,4672)-1);
  return decodeReportMetadata(first,artifact.bytes);
}

function reportTrackLevel(track, view, px) {
  // Choose detail from the viewport, before aligning reusable transport blocks.
  if (track.step >= 1000 && track.levels[0].bytes <= 64*1024) return track.levels[0];
  const visible = Math.max(0,Math.min(view[1],track.origin+track.samples*track.step)-Math.max(view[0],track.origin))/track.step;
  let level = track.levels[0];
  for (const next of track.levels.slice(1)) { if (visible/next.factor < px) break; level = next; }
  return level;
}

function reportTrackPlan(track, range, px, adjacent = false) {
  const level = reportTrackLevel(track,range,px), step = track.step*level.factor;
  const first = Math.max(0,Math.floor((range[0]-track.origin)/step)-1);
  const last = Math.min(level.count,Math.ceil((range[1]-track.origin)/step)+1);
  const groups = [], span = 512*16*step;
  if (adjacent) groups.push(...new Set([Math.floor((range[0]-track.origin)/span)-1,Math.floor((range[1]-track.origin)/span)+1]));
  else if (first < last) for (let group = Math.floor(first/8192); group <= Math.floor((last-1)/8192); group++) groups.push(group);
  const ranges = [];
  for (const group of groups) {
    const from = level.offset+group*16*level.tile;
    if (group < 0 || from >= level.offset+level.bytes) continue;
    ranges.push({first:from,last:Math.min(level.offset+level.bytes,from+16*level.tile)-1});
  }
  return {track,level,step,first,last,ranges};
}

async function reportArtifactTrackBlocks(manifest, artifact, tracks, range, px, signal, adjacent = false) {
  // Only a complete owner summary can prove a channel has no valid samples.
  const empty = new Set(manifest.summary?.partial === false
    ? (manifest.summary.channels || []).filter(channel => channel.count === 0).map(channel => channel.id) : []);
  const plans = tracks.filter(track => !empty.has(track.id)).map(track => reportTrackPlan(track,range,px,adjacent));
  const buffers = await reportArtifactRanges(manifest.dataset,artifact,false,signal,plans.flatMap(plan => plan.ranges));
  let at = 0;
  for (const plan of plans) { plan.blocks = buffers.slice(at,at+plan.ranges.length); at += plan.ranges.length; }
  return plans;
}

function reportTrackSegment(plan) {
  const {track,level,step,first,last} = plan;
  if (first >= last) return null;
  const segment = {from_ms:track.origin+first*step,step_ms:step,raw:level.factor === 1,
    end_ms:Math.min(track.origin+last*step,track.origin+track.samples*track.step),points:[]};
  let block = null, blockIndex = -1;
  for (let i = first; i < last; i++) {
    const tile = Math.floor(i/512), group = Math.floor(tile/16)*16;
    if (group !== blockIndex) {
      block = new DataView(plan.blocks[Math.floor(i/8192)-Math.floor(first/8192)]);
      blockIndex = group;
    }
    const at = (tile-blockIndex)*level.tile, slot = i%512;
    let low, high, count;
    if (segment.raw) {
      count = (block.getUint8(at+1024+Math.floor(slot/8)) >>> (slot%8)) & 1;
      low = high = block.getInt16(at+slot*2,true);
    } else {
      low = block.getInt16(at+slot*8,true); high = block.getInt16(at+slot*8+2,true);
      count = block.getUint32(at+slot*8+4,true);
    }
    const expected = Math.min(level.factor,track.samples-i*level.factor);
    if (count > expected || (count && low > high)) throw new Error('Invalid artifact cell');
    segment.points.push(count ? [low*track.scale+track.bias,high*track.scale+track.bias,count,expected] : null);
  }
  return segment;
}

async function reportArtifactSeries(request, px, signal, publish) {
  const manifest = reportPlot.summary.artifact_manifest;
  const data = {from_ms:request.view[0],to_ms:request.view[1],requested_from_ms:request.view[0],requested_to_ms:request.view[1],
    channels:[],events:[],partial:!!reportPlot.summary.partial,events_truncated:false,excluded:request.excluded,data_revision:reportPlot.summary.data_revision};
  const channels = new Map(), sources = [];
  for (const artifact of manifest.artifacts) {
    if (reportPlot.hiddenSessions.has(artifact.session)) continue;
    const tracks = await reportArtifactTracks(manifest,artifact,signal);
    for (const track of tracks) {
      if (!reportSignalIds.slice(0,12).includes(track.id)) continue;
      if (!channels.has(track.id)) channels.set(track.id,{id:track.id,label:track.label,unit:track.unit,segments:[]});
    }
    sources.push({artifact,tracks:tracks.filter(track => reportSignalIds.slice(0,12).includes(track.id))});
  }
  data.channels = [...channels.values()]; publish(data);
  for (const group of manifest.event_groups || []) {
    if (reportPlot.hiddenSessions.has(group.session)) continue;
    const events = JSON.parse(new TextDecoder().decode(await reportArtifactBytes(manifest.dataset,group,true,signal)));
    data.events.push(...events.events);
  }
  publish(data);
  for (const {artifact,tracks} of sources) {
    if (signal.aborted) throw new DOMException('Aborted','AbortError');
    const plans = await reportArtifactTrackBlocks(manifest,artifact,tracks.filter(track => !reportPlot.hiddenChannels.has(track.id)),request.view,px,signal);
    for (const plan of plans) {
      const segment = reportTrackSegment(plan);
      if (segment) channels.get(plan.track.id).segments.push(segment);
      publish(data);
    }
  }
  return data;
}

let reportDisplayedSource = null;
const reportPlot = {summary:null, selection:null, full:null, view:null, fullSeries:null, series:null,
  history:null, historyMetric:null, historyPending:false,
  pending:null, flight:null, serial:0, cursor:null, frame:null, request:false, redraw:false, rows:[], resizeObserver:null,
  axes:null, hiddenSessions:new Set(), excluded:'', pointers:new Map(), gesture:null,
  hiddenChannels:new Set(), availableChannels:[]};

function reportSource() {
  if (lastStatus.report_source === 'edf') return document.getElementById('reportSourceChoice').value === 'device' ? 'device' : 'edf';
  return lastStatus.report_source === 'device' ? 'device' : null;
}

function applyReportStatus(d) {
  const source = reportSource();
  const changed = source !== reportPublishedSource;
  reportPublishedSource = source;
  if (changed) invalidateReportDays();
  if (d.report_data_revision !== undefined) {
    if (reportDataRevision !== null && d.report_data_revision !== reportDataRevision) {
      reportDataEpoch++;
      invalidateReportDays();
      if (source === 'edf' && (reportLoading || (reportPlot.summary && reportPlot.summary.data_revision !== d.report_data_revision))) queueReportRefresh();
    }
    reportDataRevision = d.report_data_revision;
    if (reportCalendar.cache && reportCalendar.cache.data_revision !== reportDataRevision) invalidateReportDays();
  }
  if (d.report_revision !== undefined && d.report_revision !== reportRevision) {
    reportRevision = d.report_revision;
    reportEpoch++;
    Object.values(reportReads).forEach(read => read.wake());
  }
  if (d.report_artifact_revision !== undefined && d.report_artifact_revision !== reportArtifactRevision) {
    reportArtifactRevision = d.report_artifact_revision;
    // Completion changes the index, not the identity of downloaded blocks.
    reportCalendar.cache = null;
  }
  renderReportAvailability();
  if (changed && document.getElementById('p-report').classList.contains('active')) loadReport();
}

function queueReportRefresh() {
  reportDirty = true;
  if (reportLoading || reportRefreshQueued) return;
  reportRefreshQueued = true;
  queueMicrotask(() => {
    reportRefreshQueued = false;
    if (!reportDirty || reportLoading || document.hidden || reportSource() !== 'edf' || !document.getElementById('p-report').classList.contains('active')) return;
    reportDirty = false;
    loadReport();
  });
}

function reportReconnect() {
  // Dataset revisions are boot-local. Reconnect cannot prove the device did not restart.
  reportDataEpoch++;
  invalidateReportDays();
  if (reportLoading) {
    reportDirty = true;
    if (reportReads.days) reportReads.days.cancel();
  }
  reportEpoch++;
  Object.values(reportReads).forEach(read => read.wake());
}

function invalidateReportDays() {
  reportCalendar.epoch++;
  reportCalendar.cache = null;
  reportCalendar.days = [];
}

function edfReportRequest(slot, query, generation, signal) {
  if (reportReads[slot]) reportReads[slot].cancel();
  return new Promise((resolve, reject) => {
    const controller = new AbortController();
    const read = {job:null, busy:false, epoch:reportEpoch, wake:attempt, cancel:() => controller.abort()};
    let done = false, cancelSent = false;
    const abort = () => {
      cancelJob(read.job);
      finish(combined.reason || new DOMException('Report request cancelled', 'AbortError'));
    };
    const combined = AbortSignal.any([signal, controller.signal]);
    combined.addEventListener('abort', abort, {once:true});
    reportReads[slot] = read;

    function cancelJob(job) {
      if (!job || cancelSent) return;
      cancelSent = true;
      api('/api/report?source=edf&job=' + encodeURIComponent(job), {method:'DELETE',keepalive:true,signal:AbortSignal.timeout(5000)}).catch(() => {});
    }

    function finish(error, data) {
      if (done) return;
      done = true;
      combined.removeEventListener('abort', abort);
      if (reportReads[slot] === read) delete reportReads[slot];
      read.wake = () => {};
      if (error) reject(error); else resolve(data);
    }

    async function attempt() {
      if (read.busy || combined.aborted || generation !== reportGeneration) return;
      read.busy = true;
      const epoch = reportEpoch;
      try {
        const requestSignal = AbortSignal.any([combined, AbortSignal.timeout(15000)]);
        const r = await api('/api/report?source=edf&' + (read.job ? 'job=' + encodeURIComponent(read.job) : query), {signal:requestSignal});
        if (!r) throw new Error('request_cancelled');
        const data = await r.json();
        if (combined.aborted || generation !== reportGeneration) {
          if (r.status === 202) cancelJob(data.job);
          return;
        }
        if (r.status !== 202) {
          if (!r.ok) throw new Error(data.error || 'edf_request_failed');
          finish(null, data);
          return;
        }
        if ((!read.job && !data.job) || (read.job && data.job && data.job !== read.job)) throw new Error('edf_invalid_job');
        if (data.job) read.job = data.job;
        read.epoch = epoch;
      } catch(e) { finish(e); return; }
      finally { read.busy = false; }
      // Completion can be pushed before the HTTP 202/body reaches the browser.
      if (read.epoch !== reportEpoch) attempt();
    }

    if (combined.aborted) abort(); else attempt();
  });
}

function renderReportAvailability() {
  const source = reportSource();
  document.getElementById('reportSourceRow').hidden = lastStatus.report_source !== 'edf';
  document.getElementById('reportDay').hidden = source === 'edf';
  document.getElementById('reportDatePicker').hidden = source !== 'edf';
  document.getElementById('reportDateLabel').setAttribute('for', source === 'edf' ? 'reportDateButton' : 'reportDay');
  const blocked = !source || (source === 'edf' ? lastStatus.report_available !== true
    : lastStatus.system !== 'IDLE' || lastStatus.rop !== 0);
  const busy = document.getElementById('reportResult').getAttribute('aria-busy') === 'true';
  const navigationBlocked = blocked && source !== 'edf';
  for (const id of ['reportView', 'reportDay', 'reportLatest', 'reportRefresh']) {
    document.getElementById(id).disabled = navigationBlocked || (id === 'reportRefresh' && busy);
  }
  document.getElementById('reportDateButton').disabled = navigationBlocked || !reportCalendar.days.length;
  const selected = document.getElementById('reportDay').value;
  document.getElementById('reportDayPrevious').disabled = navigationBlocked || !reportCalendar.days.some(d => reportDate(d.day) < selected);
  document.getElementById('reportDayNext').disabled = navigationBlocked || !reportCalendar.days.some(d => reportDate(d.day) > selected);
  uiText(document.getElementById('reportAvailability'), !source ? uiMessage('report.waiting')
    : source === 'device' ? (blocked ? uiMessage('report.standby') : '')
    : lastStatus.report_error === 'usb_storage' ? uiMessage('report.usb')
    : lastStatus.report_state === 'waiting_storage' ? (blocked ? uiMessage('report.waitingStorage') : '')
    : lastStatus.report_error ? uiError(lastStatus.report_error)
    : lastStatus.report_state === 'building' ? (blocked && !reportPlot.summary ? uiMessage('report.preparing') : '')
    : ({blocked:uiMessage('report.unavailable'), error:uiMessage('report.error')}[lastStatus.report_state] || ''));
  return blocked;
}

function reportDate(day) {
  return new Date(day * 86400000).toISOString().slice(0, 10);
}

function closeReportCalendar() {
  document.getElementById('reportCalendar').hidden = true;
  document.getElementById('reportDateButton').setAttribute('aria-expanded', 'false');
}

function toggleReportCalendar() {
  const calendar = document.getElementById('reportCalendar');
  if (!calendar.hidden) { closeReportCalendar(); return; }
  const selected = document.getElementById('reportDay').value;
  const day = selected ? Date.parse(selected + 'T00:00:00Z') / 86400000 : reportCalendar.days.at(-1)?.day;
  if (!Number.isFinite(day)) return;
  const date = new Date(day * 86400000);
  reportCalendar.month = Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),1);
  renderReportCalendar();
  calendar.hidden = false;
  document.getElementById('reportDateButton').setAttribute('aria-expanded', 'true');
}

function stepReportMonth(delta) {
  const date = new Date(reportCalendar.month);
  reportCalendar.month = Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+delta,1);
  renderReportCalendar();
}

function stepReportDay(delta) {
  const selected = document.getElementById('reportDay').value;
  const days = reportCalendar.days.filter(d => delta < 0 ? reportDate(d.day) < selected : reportDate(d.day) > selected);
  const next = delta < 0 ? days.at(-1) : days[0];
  if (!next) return;
  document.getElementById('reportDay').value = reportDate(next.day);
  loadReport();
}

function renderReportCalendar() {
  const grid = document.getElementById('reportCalendarGrid'); grid.replaceChildren();
  const date = new Date(reportCalendar.month), year = date.getUTCFullYear(), month = date.getUTCMonth();
  document.getElementById('reportMonth').textContent = uiDate(date, {month:'long',year:'numeric'});
  const from = Date.UTC(year,month,1)/86400000, to = Date.UTC(year,month+1,1)/86400000;
  document.getElementById('reportMonthPrevious').disabled = !reportCalendar.days.some(d => d.day < from);
  document.getElementById('reportMonthNext').disabled = !reportCalendar.days.some(d => d.day >= to);
  const days = new Map(reportCalendar.days.map(d => [d.day,d.session_count]));
  const selected = document.getElementById('reportDay').value;
  for (let weekday = 0; weekday < 7; weekday++) {
    const cell = document.createElement('span'); cell.textContent = uiDate(Date.UTC(2024,0,1+weekday), {weekday:'narrow'}); grid.append(cell);
  }
  for (let i = 0; i < (date.getUTCDay()+6)%7; i++) grid.append(document.createElement('span'));
  for (let day = from; day < to; day++) {
    const button = document.createElement('button'), value = reportDate(day);
    button.dataset.day = day;
    button.textContent = String(day-from+1); button.disabled = !days.has(day);
    uiText(button, uiMessage('common.value', {value:{date:day*86400000,options:{dateStyle:'full'}}}), 'aria-label');
    button.setAttribute('aria-pressed', String(value === selected));
    if (days.has(day)) uiText(button, uiMessage('report.sessionCount', {count:days.get(day)}), 'title');
    button.addEventListener('click', () => {
      document.getElementById('reportDay').value = value;
      closeReportCalendar(); loadReport();
    });
    grid.append(button);
  }
}

async function loadArtifactReport(view, selection, generation, signal) {
  const epoch = reportDataEpoch;
  const offline = lastStatus.report_available !== true;
  let days = reportCalendar.cache;
  if (!days) {
    if (offline) days = await reportCachedBinary('current-index');
    else {
      days = await edfReportRequest('days','action=days',generation,signal);
      await reportStoreBinary('current-index',days);
    }
  }
  if (!days?.dataset) throw new Error('report_no_cached_index');
  if (signal.aborted || generation !== reportGeneration || epoch !== reportDataEpoch) throw new DOMException('Aborted','AbortError');
  reportCalendar.cache = days;
  const dates = (days.days || []).filter(d => Number.isInteger(d.day) && d.day > 0).sort((a,b) => a.day-b.day);
  reportCalendar.days = dates;
  const date = document.getElementById('reportDay');
  date.min = dates.length ? reportDate(dates[0].day) : '';
  date.max = dates.length ? reportDate(dates.at(-1).day) : '';
  renderReportAvailability();
  if (view !== 'day') {
    const key = 'period:'+days.dataset+':'+selection;
    if (offline) {
      const saved = await reportCachedBinary(key);
      if (!saved) throw new Error('report_period_not_cached');
      return {...saved,stale:true};
    }
    const period = [1,7,30,90,180,365][selection];
    const publication = days.periods?.find(p => p.period === period && !p.stale);
    const data = publication
      ? JSON.parse(new TextDecoder().decode(await reportArtifactBytes(days.dataset,publication,true,signal)))
      : await edfReportRequest('summary','action=prepare&view=period&period='+selection,generation,signal);
    await reportStoreBinary(key,data);
    return {...data,stale:!!days.stale};
  }
  const chosen = dates.find(d => d.day === (selection || dates.at(-1)?.day));
  const day = chosen?.day || selection || 0;
  let manifest = null, stale = !!chosen?.stale || !!days.stale || offline;
  const saved = await reportCachedBinary('day:'+days.dataset+':'+day);
  if (saved && (offline || saved.identity === chosen?.identity)) manifest = saved;
  if (!manifest && chosen?.publication) {
    try {
      const bytes = await reportArtifactBytes(days.dataset,chosen.publication,true,signal);
      manifest = JSON.parse(new TextDecoder().decode(bytes));
    } catch (error) {
      if (error.name === 'AbortError') throw error;
      manifest = saved; stale = true;
    }
  }
  if ((!manifest || chosen?.stale) && !offline) {
    try {
      manifest = await edfReportRequest('summary','action=prepare&day='+day,generation,signal);
      stale = false;
      // The new head is discovered through the owner index, never synthesized.
      reportCalendar.cache = null;
    } catch (error) { if (!manifest || error.name === 'AbortError') throw error; }
  }
  if (!manifest || manifest.dataset !== days.dataset || !Array.isArray(manifest.artifacts)) throw new Error('report_publication_unavailable');
  if (signal.aborted || generation !== reportGeneration || epoch !== reportDataEpoch) throw new DOMException('Aborted','AbortError');
  await reportStoreBinary('day:'+manifest.dataset+':'+manifest.day,manifest);
  reportPlot.selection = 'view=day&day='+manifest.day;
  return {...manifest.summary,data_revision:days.data_revision,artifact_manifest:manifest,stale};
}

async function loadReport(latest = false, refresh = false) {
  const generation = ++reportGeneration;
  if (reportController) reportController.abort();
  reportController = new AbortController();
  reportPlot.pending = null; reportPlot.request = false;
  reportPlot.gesture = null; reportPlot.pointers.clear();
  closeReportCalendar();
  if (refresh || reportPublishedSource !== reportSource()) {
    invalidateReportDays();
  }
  reportPublishedSource = reportSource();
  reportLoading = false; reportDirty = false;
  for (const id of ['reportMaskCard','reportChartsCard']) document.getElementById(id).inert = false;
  if (renderReportAvailability() && reportSource() !== 'edf') {
    uiText(document.getElementById('reportLoadState'), reportDisplayedSource ? uiMessage('report.previous') : '');
    document.getElementById('reportSpinner').style.display = 'none';
    document.getElementById('reportResult').setAttribute('aria-busy', 'false');
    return;
  }
  const source = reportSource();
  reportLoading = true;
  const dataEpoch = reportDataEpoch;
  const selected = document.getElementById('reportView').value;
  const day = selected === 'day';
  const view = day ? 'day' : 'period';
  const date = document.getElementById('reportDay');
  if (latest) date.value = '';
  document.getElementById('reportDayRow').hidden = !day;
  document.getElementById('reportLatest').hidden = !day;
  const prior = reportDisplayedSource !== null;
  uiText(document.getElementById('reportLoadState'), uiMessage(prior ? 'report.loadingPrevious' : 'common.loading'));
  for (const id of ['reportMaskCard','reportChartsCard']) document.getElementById(id).inert = true;
  if (!prior) uiText(document.getElementById('reportTitle'), uiMessage(source === 'edf' ? 'report.statistics' : day ? 'report.therapyDay' : 'report.period'));
  document.getElementById('reportMsg').style.display = 'none';
  document.getElementById('reportRefresh').disabled = true;
  document.getElementById('reportResult').setAttribute('aria-busy', 'true');
  document.getElementById('reportSpinner').style.display = 'block';
  try {
    const selection = day ? (date.value ? Date.parse(date.value + 'T00:00:00Z') / 86400000 : 0)
      : Number(selected);
    if (!Number.isInteger(selection)) throw new Error('report_invalid_date');
    let data;
    if (source === 'edf') {
      data = await loadArtifactReport(view,selection,generation,reportController.signal);
      if (dataEpoch !== reportDataEpoch) { reportDirty = true; return; }
      reportDirty = false;
    } else {
      const query = '?' + (lastStatus.report_source === 'edf' ? 'source=device&' : '') + 'view=' + view + (day ? '&day=' : '&period=') + selection;
      data = await settingsRequest({method:day ? 'GET' : 'POST', signal:reportController.signal}, '/api/report', query);
    }
    if (generation !== reportGeneration) return;
    renderReport(data);
  } catch(e) {
    if (generation !== reportGeneration) return;

    if (e.name !== 'AbortError' && (e.message !== 'report_not_idle' || !renderReportAvailability()))
      showMsg(document.getElementById('reportMsg'), uiError(e), 'err', source === 'edf' ? 0 : 5000);
  } finally {
    if (generation === reportGeneration) {
      reportLoading = false;
      for (const id of ['reportMaskCard','reportChartsCard']) document.getElementById(id).inert = false;
      if (document.getElementById('reportLoadState').textContent) uiText(document.getElementById('reportLoadState'), prior ? uiMessage('report.previous') : '');
      document.getElementById('reportSpinner').style.display = 'none';
      document.getElementById('reportResult').setAttribute('aria-busy', 'false');
      renderReportAvailability();
      if (reportDirty) queueReportRefresh();
    }
  }
}

function reportTime(ms) {
  return new Date(ms).toISOString().slice(0, 19).replace('T', ' ');
}

function reportNumber(value) {
  return Number.isFinite(value) ? uiNumber(value) : '--';
}

function reportDurationMessage(seconds, compact = false) {
  if (!Number.isFinite(seconds)) return '--';
  const hours = Math.floor(seconds/3600), minutes = Math.floor(seconds%3600/60);
  const unit = hours ? (minutes ? 'HoursMinutes' : 'Hours') : 'Minutes';
  return uiMessage('duration.' + (compact ? 'compact' + unit : unit[0].toLowerCase() + unit.slice(1)), {hours,minutes});
}

function reportDuration(seconds, compact = false) {
  return uiValue(reportDurationMessage(seconds, compact));
}

function reportSessions() {
  return (reportPlot.summary?.sessions || []).filter(s => Number.isFinite(s.start_ms)
    && Number.isFinite(s.end_ms) && s.end_ms > s.start_ms);
}

function reportSessionRange() {
  const sessions = reportSessions().filter(s => !reportPlot.hiddenSessions.has(s.id));
  return sessions.length ? [Math.min(...sessions.map(s => s.start_ms)), Math.max(...sessions.map(s => s.end_ms))] : null;
}

const reportMetrics = [
  {id:'usage',labelKey:'report.usage',unit:'',field:'used_seconds',color:'var(--sky)'},

function renderReportMetrics(data) {

  for (const metric of reportMetrics) {
    const format = value => !Number.isFinite(value) ? '--'
      : metric.id === 'usage' ? (value < 0 ? '-' : '') + reportDuration(Math.round(Math.abs(value)/60)*60,true) : uiNumber(value, metric.digits, metric.digits);
    const value = metric.field ? data[metric.field] : data.channels?.find(c => c.id === metric.channel)?.mean;
    const tile = document.createElement(data.view === 'day' ? 'button' : 'div'); tile.className = 'report-metric';
    tile.dataset.metric = metric.id;

    if (data.view === 'day') {

      const item = document.createElement('span'); item.className = 'report-metric-' + className;

      if (trend.points.filter(Number.isFinite).length > 1) {
        const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
        svg.setAttribute('aria-hidden','true'); drawReportHistory(svg,metric,trend,false); tile.append(svg);
      }

      delta.textContent = Number.isFinite(trend.delta)
        ? (trend.delta > 0 ? '+' : '') + format(trend.delta) : '--';

  }
  document.getElementById('reportMetrics').replaceChildren(fragment);
  if (focused) [...document.getElementById('reportMetrics').children].find(tile => tile.dataset.metric === focused)?.focus({preventScroll:true});

function drawReportHistory(svg, metric, trend, expanded) {
  svg.replaceChildren();
  const width = expanded ? 600 : 56, height = expanded ? 160 : 24;
  const left = expanded ? 58 : 2, right = expanded ? 18 : 2, top = expanded ? 12 : 2, bottom = expanded ? 24 : 2;
  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
  const points = trend?.points || [], values = points.filter(Number.isFinite);
  if (!values.length) return;
  if (Number.isFinite(trend.baseline)) values.push(trend.baseline);
  const low = Math.min(...values), high = Math.max(...values), pad = Math.max((high-low)*.1,.01);
  const x = i => left + i/13*(width-left-right), y = value => top+(high+pad-value)/(high-low+2*pad)*(height-top-bottom);
  const node = (tag,attributes,text) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg',tag);
    for (const [name,value] of Object.entries(attributes)) el.setAttribute(name,String(value));
    if (text !== undefined) el.textContent = text;
    svg.append(el); return el;
  };
  let path = '', previous = false;
  points.forEach((value,i) => {
    if (!Number.isFinite(value)) { previous = false; return; }
    path += `${previous ? 'L' : 'M'}${x(i)} ${y(value)} `; previous = true;
  });
  node('path',{d:path,fill:'none',stroke:metric.color,'stroke-width':1.5});
  points.forEach((value,i) => {
    if (!Number.isFinite(value)) return;
    const dot = node('circle',{cx:x(i),cy:y(value),r:expanded ? 3 : 1.4,fill:metric.color});
    const title = document.createElementNS('http://www.w3.org/2000/svg','title');
    title.textContent = uiDate((reportPlot.history.first_day+i)*86400000,{dateStyle:'medium'})+': '+(metric.id === 'usage' ? reportDuration(value) : reportNumber(value)+' '+metric.unit);
    dot.append(title);
  });
  if (!expanded) return;
  if (Number.isFinite(trend.baseline)) node('line',{x1:left,x2:width-right,y1:y(trend.baseline),y2:y(trend.baseline),stroke:'currentColor','stroke-dasharray':'3 4'});
  for (const value of new Set([low,high])) node('text',{x:left-6,y:y(value)+4,'text-anchor':'end',fill:'currentColor','font-size':11},metric.id === 'usage' ? reportDuration(value) : reportNumber(value));
  for (const i of [0,6,13]) node('text',{x:x(i),y:height-3,'text-anchor':i === 0 ? 'start' : i === 13 ? 'end' : 'middle',fill:'currentColor','font-size':11},uiDate((reportPlot.history.first_day+i)*86400000,{month:'2-digit',day:'2-digit'}));
}

function renderReportSessions(focusId = null) {

      end:reportTime(session.end_ms).slice(11,16), duration:reportDurationMessage((session.end_ms-session.start_ms)/1000)}));
    button.setAttribute('aria-pressed', String(!reportPlot.hiddenSessions.has(session.id)));
    uiText(button, uiMessage('report.dateRange', {from:{date:session.start_ms,options:{dateStyle:'medium',timeStyle:'medium',hourCycle:'h23'}},
      to:{date:session.end_ms,options:{dateStyle:'medium',timeStyle:'medium',hourCycle:'h23'}}}), 'title');
    button.disabled = !Number.isInteger(session.id) || session.id < 0 || session.id >= 8192;
    button.addEventListener('click', () => toggleReportSession(session.id));
    sessions.append(button);
    if (session.id === focusId) button.focus();

function toggleReportSession(id) {
  if (reportLoading) return;
  const wasEmpty = !reportSessionRange();
  if (reportPlot.hiddenSessions.has(id)) reportPlot.hiddenSessions.delete(id);
  else reportPlot.hiddenSessions.add(id);
  const full = reportSessionRange();
  if (full && (wasEmpty || full[0] !== reportPlot.full[0] || full[1] !== reportPlot.full[1])) {
    reportPlot.full = full;
    reportPlot.view = [...full];
  }
  reportPlot.excluded = [...reportPlot.hiddenSessions].sort((a,b) => a-b).join(',');
  reportPlot.serial++;
  // Reject in-flight display results; immutable per-session bytes remain reusable.
  reportPlot.fullSeries = reportPlot.series = reportPlot.cursor = reportPlot.pending = null;
  reportPlot.flight?.controller?.abort();
  renderReportSessions(id);
  scheduleReportDraw(true);
}

function setReportViewport(from, to) {
  if (!reportPlot.full || !Number.isFinite(from) || !Number.isFinite(to)) return;
  const [first,last] = reportPlot.full;
  const width = Math.max(Math.min(1000,last-first), Math.min(last-first,to-from));
  from = Math.max(first, Math.min(last-width, from));
  if (reportPlot.view && reportPlot.view[0] === from && reportPlot.view[1] === from+width) return;
  reportPlot.view = [from,from+width];
  reportPlot.redraw = true;
  reportPlot.serial++;
  reportPlot.flight?.controller?.abort();
  reportPlot.prefetch?.abort();
}

function zoomReportViewport(factor) {
  if (reportLoading || reportPlot.gesture || !reportPlot.full || !reportPlot.view) return;
  const [from,to] = reportPlot.view, span = reportPlot.full[1]-reportPlot.full[0];
  const width = Math.max(Math.min(1000,span), Math.min(span,(to-from)*factor));
  const center = (from+to)/2, serial = reportPlot.serial;
  setReportViewport(center-width/2,center+width/2);
  if (reportPlot.serial !== serial) scheduleReportDraw(true);
}

function resetReportViewport() {
  if (!reportPlot.full) return;
  setReportViewport(...reportPlot.full);
  scheduleReportDraw(true);
}

function scheduleReportDraw(request = false, redraw = true) {
  if (request) reportPlot.prefetch?.abort();
  reportPlot.request ||= request;
  reportPlot.redraw ||= redraw;
  if (reportPlot.frame !== null) return;
  reportPlot.frame = requestAnimationFrame(() => {
    reportPlot.frame = null;
    if (!reportPlot.view || document.getElementById('reportChartsCard').hidden) return;
    const redraw = reportPlot.redraw; reportPlot.redraw = false;
    if (redraw) drawReportPlots(); else drawReportInteraction();
    // Only interaction/release queues data; animation frames never form a loop.
    if (reportPlot.request) {
      reportPlot.request = false;
      reportPlot.pending = {view:[...reportPlot.view], serial:reportPlot.serial, generation:reportGeneration, excluded:reportPlot.excluded};
      drainReportSeries();
    }
  });
}

async function drainReportSeries() {
  if (reportLoading || reportPlot.flight || reportPlot.gesture || reportPlot.request || !reportPlot.pending || !reportPlot.summary) return;
  const request = reportPlot.pending; reportPlot.pending = null;
  const full = reportPlot.full;
  reportPlot.flight = request;
  const allHidden = reportSessions().every(s => reportPlot.hiddenSessions.has(s.id));
  const note = document.getElementById('reportSeriesNote'); uiText(note, uiMessage(allHidden ? 'report.noSessions' : 'report.chartLoading'));
  try {
    request.controller = new AbortController();
    const signal = AbortSignal.any([reportController.signal,request.controller.signal]);
    // All plot cards share this box geometry, including before channels mount.
    const plotStyle = getComputedStyle(document.getElementById('reportEventCard'));
    const inset = ['paddingLeft','paddingRight','borderLeftWidth','borderRightWidth']
      .reduce((width,key) => width+parseFloat(plotStyle[key]),0);
    const px = Math.max(1, Math.min(1200, Math.floor(document.getElementById('reportPlots').clientWidth - inset - 52)));
    request.px = px;
    const current = () => request.generation === reportGeneration && request.serial === reportPlot.serial
      && request.excluded === reportPlot.excluded && !signal.aborted;
    const data = await reportArtifactSeries(request,px,signal,data => {
      if (!current()) return;
      reportPlot.series = data;
      presentReportChannels(data);
    });
    if (!current()) return;
    if (request.view[0] === full[0] && request.view[1] === full[1]) {
      reportPlot.fullSeries = data;
    }
    if (request.serial !== reportPlot.serial) return;
    reportPlot.series = data;
    uiText(note, allHidden ? uiMessage('report.noSessions') : uiMessage('common.value', {value:{items:
      [data.partial ? uiMessage('report.chartPartial') : null, data.events_truncated ? uiMessage('report.chartZoom') : null].filter(Boolean), separator:' '}}));
    presentReportChannels(data);
    prefetchReportPublications(request,signal).catch(() => {});
  } catch(e) {
    if (request.generation === reportGeneration && request.serial === reportPlot.serial && e.name !== 'AbortError') {
      reportPlot.pending = null;
      uiText(note, uiMessage('report.chartFailed', {detail:uiError(e)}));
    }
  } finally {
    if (reportPlot.flight === request) reportPlot.flight = null;
    drainReportSeries();
  }
}

function presentReportChannels(data) {
    const plots = document.getElementById('reportPlots');
    const channels = [...(data.channels || [])];
    if (channels.some(channel => channel.id === 'MinVent')) {
      const beforeVent = channels.filter(channel => channel.id === 'FlowLim' || channel.id === 'Snore');
      for (const channel of beforeVent) channels.splice(channels.indexOf(channel),1);
      channels.splice(channels.findIndex(channel => channel.id === 'MinVent'),0,...beforeVent);
    }
    if (reportPlot.availableChannels.map(c => c.id).join('|') !== channels.map(channel => channel.id).join('|')) {
      reportPlot.availableChannels = channels.map(({id,label,unit}) => ({id,label,unit}));
      renderReportChannelOptions();
      plots.replaceChildren(); reportPlot.rows = [];
      const groups = [];
      for (const channel of channels) {
        if (channel.unit === 'cmH2O') {
          const pressure = groups.find(group => group[0].unit === 'cmH2O');
          if (pressure) pressure.push(channel); else groups.push([channel]);
        } else groups.push([channel]);
      }
      for (const group of groups) {
        const card = document.createElement('div'); card.className = 'chart-card';
        const head = document.createElement('div'); head.className = 'report-chart-head';
        const channel = group[0];
        const title = document.createElement('span'); title.textContent = (group.length > 1 ? 'Pressure' : channel.label) + (channel.unit ? ' (' + channel.unit + ')' : '');
        const value = document.createElement('span'); value.className = 'report-chart-value';
        head.append(title,value);
        const members = group.map(member => ({id:member.id,title:null,value:null}));
        if (group.length > 1) {
          const legend = document.createElement('div'); legend.className = 'report-chart-legend';
          members.forEach((member,i) => {
            member.title = document.createElement('span'); member.title.textContent = group[i].label;
            member.title.style.color = reportChannelColor(member.id);
            member.value = document.createElement('span'); member.value.className = 'report-chart-value';
            member.title.append(member.value); legend.append(member.title);
          });
          head.append(legend);
        }
        const canvas = document.createElement('canvas'); canvas.height = 220;
        uiText(canvas, uiMessage('report.channelPlot', {channels:group.map(c => c.label).join(', ')}), 'aria-label');
        canvas.tabIndex = 0;
        card.append(head,canvas); plots.append(card);
        bindReportPlot(canvas);
        reportPlot.rows.push({channel:channel.id,channels:members,card,canvas,title,value});
      }
    }
    scheduleReportDraw();
}

async function prefetchReportPublications(request, parent) {
  reportPlot.prefetch?.abort();
  const controller = new AbortController(); reportPlot.prefetch = controller;
  const signal = AbortSignal.any([parent,controller.signal]);
  const dataset = reportPlot.summary.artifact_manifest.dataset;
  const current = reportPlot.summary.artifact_manifest;
  // Adjacent blocks precede other days, using the visible LOD rather than a
  // widened viewport which could silently select a different resolution.
  for (const artifact of current.artifacts) {
    if (reportPlot.hiddenSessions.has(artifact.session)) continue;
    if (signal.aborted || reportPlot.gesture || reportLoading) return;
    const tracks = (await reportArtifactTracks(current,artifact,signal))
      .filter(track => reportSignalIds.slice(0,12).includes(track.id) && !reportPlot.hiddenChannels.has(track.id));
    await reportArtifactTrackBlocks(current,artifact,tracks,request.view,request.px || 800,signal,true);
  }
  const day = reportPlot.summary.day;
  const days = [...reportCalendar.days].filter(d => d.publication && !d.stale && d.day !== day);
  const previous = days.filter(d => d.day < day).at(-1), next = days.find(d => d.day > day);
  const selected = [...new Set([previous,next,...days.slice(-14).reverse()].filter(Boolean))];
  for (const item of selected) {
    if (signal.aborted || request.generation !== reportGeneration || request.serial !== reportPlot.serial
        || reportPlot.gesture || reportLoading || lastStatus.report_available !== true) return;
    const buffer = await reportArtifactBytes(dataset,item.publication,true,signal);
    const manifest = JSON.parse(new TextDecoder().decode(buffer));
    if (manifest.dataset !== dataset) return;
    await reportStoreBinary('day:'+dataset+':'+manifest.day,manifest);
    for (const group of manifest.event_groups || []) await reportArtifactBytes(dataset,group,true,signal);
    const sessions = manifest.summary.sessions.filter(s => Number.isFinite(s.start_ms) && Number.isFinite(s.end_ms));
    if (!sessions.length) continue;
    const range = [Math.min(...sessions.map(s => s.start_ms)),Math.max(...sessions.map(s => s.end_ms))];
    for (const artifact of manifest.artifacts) {
      if (signal.aborted || reportPlot.gesture) return;
      const tracks = (await reportArtifactTracks(manifest,artifact,signal))
        .filter(track => reportSignalIds.slice(0,12).includes(track.id) && !reportPlot.hiddenChannels.has(track.id));
      await reportArtifactTrackBlocks(manifest,artifact,tracks,range,800,signal);
    }
  }
}

function renderReportChannelOptions() {
  const options = document.getElementById('reportChannelOptions'); options.replaceChildren();
  for (const channel of reportPlot.availableChannels) {
    const button = document.createElement('button'); button.className = 'btn';
    button.textContent = channel.label;
    button.setAttribute('aria-pressed',String(!reportPlot.hiddenChannels.has(channel.id)));
    button.addEventListener('click', () => {
      if (reportPlot.hiddenChannels.has(channel.id)) reportPlot.hiddenChannels.delete(channel.id);
      else reportPlot.hiddenChannels.add(channel.id);
      button.setAttribute('aria-pressed',String(!reportPlot.hiddenChannels.has(channel.id)));
      reportPlot.serial++;
      reportPlot.flight?.controller?.abort();
      scheduleReportDraw(true);
    });
    options.append(button);
  }
}

function reportChannelColor(id) {
  const token = {flow:'blue',press:'cyan',pressure:'cyan',eprpress:'orange',maskpress:'green',
    leak:'orange',minvent:'green',resprate:'cyan',tidvol:'slate',spo2:'green',pulse:'red',
    flowlim:'yellow',snore:'pink'}[String(id).toLowerCase()] || 'cyan';
  return chartPalette[token];
}

function reportBucket(bucket) {
  return Array.isArray(bucket) && Number.isFinite(bucket[0]) && Number.isFinite(bucket[1]) && bucket[0] <= bucket[1];
}

function reportAxes(channels, view) {
  const axes = {};
  const pressure = channels.filter(c => c.unit === 'cmH2O');
  for (const channel of channels) {
    let low = Infinity, high = -Infinity;
    const group = channel.unit === 'cmH2O' ? pressure : [channel];
    for (const member of group) for (const segment of member.segments || []) {
      const {points,from_ms:origin,step_ms:step} = segment;
      const first = view ? Math.max(0,Math.floor((view[0]-origin)/step)) : 0;
      const last = view ? Math.min(points.length-1,Math.ceil((view[1]-origin)/step)) : points.length-1;
      for (let i = first; i <= last; i++) {
        const bucket = points[i], time = origin+i*step;
        if (!reportBucket(bucket)) continue;
        let bottom = bucket[0], top = bucket[1];
        if (view && segment.raw && (time < view[0] || time > view[1])) {
          // Include only the visible part of a real line crossing the edge.
          // A missing neighbor must not manufacture an interpolated sample.
          const next = time < view[0] ? i+1 : i-1;
          const edge = time < view[0] ? view[0] : view[1];
          const fraction = (edge-time)/((next-i)*step);
          if (!reportBucket(points[next]) || fraction < 0 || fraction > 1) continue;
          bottom = top = bucket[0]+(points[next][0]-bucket[0])*fraction;
        } else if (view && !segment.raw && (time >= view[1]
            || Math.min(time+step,segment.end_ms ?? Infinity) <= view[0])) continue;
        low = Math.min(low,bottom); high = Math.max(high,top);
      }
    }
    const id = channel.id.toLowerCase();
    const minimum = channel.unit === 'cmH2O' ? 2 : channel.unit === '%' ? 5
      : channel.unit === 'mL' ? 200 : id === 'flow' || id === 'pulse' ? 20
      : id === 'leak' || channel.unit === 'bpm' ? 10 : channel.unit === 'L/min' ? 5 : 1;
    if (!Number.isFinite(low)) { low = channel.unit === '%' ? 95 : 0; high = id === 'flow' ? 0 : low+minimum; }
    if (id === 'flow') {
      // Pad the symmetric extent once, independently of the major ticks.
      const extent = Math.max(Math.max(Math.abs(low),Math.abs(high))*1.08,minimum/2);
      const quantum = 10**Math.floor(Math.log10(extent))/5;
      high = Math.ceil(extent/quantum)*quantum; low = -high;
      const power = 10**Math.floor(Math.log10(high/2));
      const step = [10,5,2.5,2,1].find(n => n*power <= high/2)*power;
      axes[channel.id] = {low,high,step};
      continue;
    }
    const center = (low+high)/2, span = Math.max(minimum,(high-low)*1.16);
    low = center-span/2; high = center+span/2;
    if (low < 0) { high -= low; low = 0; }
    if (channel.unit === '%' && high > 100) { low = Math.max(0,low-(high-100)); high = 100; }
    const rough = (high-low)/4, power = 10**Math.floor(Math.log10(rough));
    const step = [1,2,5,10].find(n => n*power >= rough)*power;
    low = Math.floor(low/step)*step; high = Math.ceil(high/step)*step;
    if (channel.unit === '%') high = Math.min(100,high);
    axes[channel.id] = {low,high,step};
  }
  return axes;
}

function drawReportEventMarkers(ctx, events, view, x, pad, height, suppressLabels) {
  const colors = {oa:chartPalette.cyan,ca:chartPalette.magenta,ua:chartPalette.violet,
    h:chartPalette.orange,rera:chartPalette.slate,csr:chartPalette.violet,
    csr_start:chartPalette.violet,csr_end:chartPalette.violet};
  const markers = (events || []).filter(event => {
    const type = String(event.type).toLowerCase();
    return colors[type] && Number.isFinite(event.time_ms) && (event.duration_ms > 0
      ? (type === 'csr' ? event.time_ms > view[0] : event.time_ms >= view[0]) && event.time_ms-event.duration_ms < view[1]
      : event.time_ms >= view[0] && event.time_ms < view[1]);
  }).sort((a,b) => a.time_ms-b.time_ms);
  const lanes = [-Infinity,-Infinity,-Infinity];
  ctx.save();
  ctx.lineWidth = 1; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
  for (const event of markers) {
    const type = String(event.type).toLowerCase(), color = colors[type];
    const end = x(Math.min(view[1],event.time_ms)), start = x(Math.max(view[0],event.time_ms - (event.duration_ms || 0)));
    // EVE marks publication/end; show the preceding duration only when resolved.
    if (end-start >= 4) {
      ctx.save(); ctx.globalAlpha *= .13; ctx.fillStyle = color;
      ctx.fillRect(start,pad.t,end-start,height); ctx.restore();
    }
    const inView = event.time_ms >= view[0] && event.time_ms < view[1];
    if (inView) {
      ctx.strokeStyle = color;
      ctx.beginPath(); ctx.moveTo(end,pad.t); ctx.lineTo(end,pad.t+height); ctx.stroke();
    }
    if (suppressLabels) continue;
    const labelX = type === 'csr' ? start : end;
    const lane = lanes.findIndex(last => labelX-last >= 30);
    if (lane < 0) continue; // Keep every marker even when all label lanes are full.
    if (!inView && type !== 'csr') continue;
    lanes[lane] = labelX;
    ctx.fillStyle = color;
    ctx.fillText(type === 'csr_start' ? 'CSR+' : type === 'csr_end' ? 'CSR-' : type.toUpperCase(),labelX+3,pad.t+10+lane*12);
  }
  ctx.restore();
}

function prepareReportCanvas(canvas) {
  const W = Math.max(100, canvas.getBoundingClientRect().width);
  const H = Number(canvas.dataset.reportHeight ||= canvas.getAttribute('height') || canvas.height);
  const dpr = window.devicePixelRatio || 1;
  canvas.style.height = H + 'px';
  if (canvas.width !== Math.round(W*dpr)) canvas.width = Math.round(W*dpr);
  if (canvas.height !== Math.round(H*dpr)) canvas.height = Math.round(H*dpr);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,W,H};
}

function drawArtifactSegment(ctx, segment, x, y, flowMidline = false) {
  const points = segment.points;
  if (segment.raw) {
    let first = -1, minimum = 0, maximum = 0, last = 0, pixel = null;
    let connected = false, runCount = 0, lastX = 0, lastY = 0;
    const endRun = () => {
      if (runCount === 1) ctx.lineTo(lastX+0.5,lastY);
      connected = false; runCount = 0;
    };
    const emit = i => {
      lastX = x(segment.from_ms+i*segment.step_ms); lastY = y(points[i][0]);
      if (connected) ctx.lineTo(lastX,lastY); else { ctx.moveTo(lastX,lastY); connected = true; }
      runCount++;
    };
    const flush = () => {
      if (first < 0) return;
      emit(first);
      const early = Math.min(minimum,maximum), late = Math.max(minimum,maximum);
      if (early > first && early < last) emit(early);
      if (late !== early && late > first && late < last) emit(late);
      if (last !== first) emit(last);
      first = -1;
    };
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      if (!reportBucket(points[i])) { flush(); endRun(); pixel = null; continue; }
      const at = Math.floor(x(segment.from_ms+i*segment.step_ms));
      if (pixel !== at) { flush(); pixel = at; }
      if (first < 0) first = minimum = maximum = i;
      else {
        if (points[i][0] < points[minimum][0]) minimum = i;
        if (points[i][0] > points[maximum][0]) maximum = i;
      }
      last = i;
    }
    flush(); endRun(); ctx.stroke();
    return;
  }
  const complete = i => reportBucket(points[i]) && points[i][2] === points[i][3];
  const xx = i => x((segment.from_ms+i*segment.step_ms
    + Math.min(segment.from_ms+(i+1)*segment.step_ms,segment.end_ms ?? Infinity))/2);
  const bar = (at, low, high) => {
    ctx.moveTo(at-(low === high ? 0.5 : 0),y(low));
    ctx.lineTo(at+(low === high ? 0.5 : 0),y(high));
  };
  let pixel = null, low = 0, high = 0;
  const flush = () => {
    if (pixel !== null) bar(pixel+0.5,low,high);
    pixel = null;
  };
  ctx.globalAlpha = 0.55; ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    if (!complete(i)) { flush(); continue; }
    const at = Math.floor(xx(i));
    if (at !== pixel) { flush(); pixel = at; low = points[i][0]; high = points[i][1]; }
    else { low = Math.min(low,points[i][0]); high = Math.max(high,points[i][1]); }
  }
  flush(); ctx.stroke();

  // Partial cells say how much is present, not where: never connect them.
  ctx.globalAlpha = 0.35; ctx.beginPath();
  for (let i = 0; i < points.length; i++) {
    if (reportBucket(points[i]) && !complete(i)) bar(xx(i),points[i][0],points[i][1]);
  }
  ctx.stroke(); ctx.globalAlpha = 1;
  if (flowMidline) {
    let connected = false;
    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      if (!complete(i)) { connected = false; continue; }
      // This is the envelope midpoint, not a sample or a statistical mean.
      const mid = y((points[i][0]+points[i][1])/2), at = xx(i);
      if (connected) ctx.lineTo(at,mid); else ctx.moveTo(at,mid);
      connected = true;
    }
    ctx.stroke();
  }
}

function reportArtifactValue(channel, time) {
  for (const segment of channel?.segments || []) {
    const i = Math.floor((time-segment.from_ms)/segment.step_ms);
    if (i >= 0 && i < segment.points.length) return segment.points[i];
  }
  return null;
}

function reportTimeTicks(view, width) {
  const span = view[1]-view[0], day = 86400000;
  const spacing = span >= day ? 120 : 90;
  const rough = span/Math.max(3,Math.floor(width/spacing));
  const seconds = [0.1,0.2,0.5,1,2,5,10,15,30,60,120,300,600,900,1800,
    3600,7200,10800,21600,43200,86400];
  const step = (seconds.find(s => s*1000 >= rough) || Math.ceil(rough/day)*86400)*1000;
  const ticks = [];
  // Published timestamps encode device wall time; never apply browser timezone.
  for (let time = Math.ceil(view[0]/step)*step; time <= view[1]; time += step) {
    const text = reportTime(time);
    const label = step < 1000 ? new Date(time).toISOString().slice(11,23)
      : step < 60000 ? text.slice(11,19)
      : step >= day ? uiDate(time,{month:'2-digit',day:'2-digit'})
      : span >= day ? uiDate(time,{month:'2-digit',day:'2-digit'})+' '+text.slice(11,16) : text.slice(11,16);
    ticks.push({time,label});
  }
  return ticks;
}

function drawEdfChart(canvas, channel, data, color) {
  const {ctx,W,H} = prepareReportCanvas(canvas);
  const members = (Array.isArray(channel) ? channel : [channel]).filter(Boolean);
  const firstChannel = members[0];
  const pad = {l:44,r:8,t:18,b:22}, gw = W-pad.l-pad.r, gh = H-pad.t-pad.b;
  const view = reportPlot.view;
  const x = time => pad.l + (time-view[0])/(view[1]-view[0])*gw;
  const {low,high,step} = reportPlot.axes?.[firstChannel?.id]
    || reportAxes(data?.channels || [],view)[firstChannel?.id] || {low:0,high:1,step:0.25};
  const y = value => pad.t + gh*(1-(value-low)/(high-low));
  ctx.clearRect(0,0,W,H); ctx.fillStyle = chartPalette['plot-bg']; ctx.fillRect(0,0,W,H);
  ctx.font = '11px sans-serif'; ctx.lineWidth = 1;
  ctx.fillStyle = chartPalette['plot-text']; ctx.textAlign = 'right';
  for (let i = Math.floor(high/step); members.length && i >= Math.ceil(low/step); i--) {
    const v = step*i, yy = y(v);
    ctx.strokeStyle = v === 0 ? chartPalette['plot-zero'] : chartPalette['plot-grid'];
    ctx.setLineDash(v === 0 ? [] : [2,4]);
    ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(W-pad.r,yy); ctx.stroke();
    ctx.fillText(reportNumber(v),pad.l-4,yy+3);
  }
  ctx.setLineDash([]);
  ctx.textAlign = 'left'; ctx.fillStyle = color;
  ctx.save(); ctx.beginPath(); ctx.rect(pad.l,pad.t,gw,gh); ctx.clip();
  for (const member of members) if (data) {
    const memberColor = members.length > 1 ? reportChannelColor(member.id) : color;
    ctx.strokeStyle = memberColor; ctx.fillStyle = memberColor; ctx.lineWidth = 1.2;
    for (const segment of member.segments || []) drawArtifactSegment(ctx,segment,x,y,member.id === 'Flow');
  }
  drawReportEventMarkers(ctx,data?.events,view,x,pad,gh,members.length > 0);
  ctx.restore(); ctx.fillStyle = chartPalette['plot-text']; ctx.strokeStyle = chartPalette['plot-zero'];
  ctx.textAlign = 'center';
  let lastLabelRight = -Infinity;
  for (const {time,label} of reportTimeTicks(view,gw)) {
    const at = x(time), half = ctx.measureText(label).width/2;
    ctx.beginPath(); ctx.moveTo(at,H-pad.b); ctx.lineTo(at,H-pad.b+4); ctx.stroke();
    if (at-half < 0 || at+half > W || at-half < lastLabelRight+8) continue;
    ctx.fillText(label,at,H-5);
    lastLabelRight = at+half;
  }
}

function reportPlotData() {
  const fullSeries = reportPlot.fullSeries;
  const current = reportPlot.series, view = reportPlot.view;
  return current && fullSeries && (view[0] < current.from_ms || view[1] > current.to_ms) ? fullSeries : current;
}

function drawReportPlots() {
  const data = reportPlotData(), view = reportPlot.view;
  reportPlot.axes = reportAxes((data?.channels || []).filter(channel => !reportPlot.hiddenChannels.has(channel.id)),view);
  drawEdfChart(document.getElementById('reportEventStrip'),null,data,chartPalette.cyan);
  reportPlot.rows.forEach(row => {
    const members = row.channels || [{id:row.channel,title:row.title,value:row.value}];
    const shown = members.filter(member => !reportPlot.hiddenChannels.has(member.id));
    if (row.card) row.card.hidden = !shown.length;
    for (const member of members) if (member.title) {
      member.title.hidden = !shown.includes(member);
      member.title.style.color = reportChannelColor(member.id);
    }
    if (!shown.length) return;
    const channels = shown.map(member => data?.channels?.find(c => c.id === member.id) || {id:member.id});
    drawEdfChart(row.canvas,channels,data,reportChannelColor(shown[0].id));
    row.title.style.color = members.length > 1 ? '' : reportChannelColor(shown[0].id);
  });
  drawReportInteraction(data);
}

function drawReportInteraction(data = reportPlotData()) {
  const view = reportPlot.view;
  const cursor = reportPlot.cursor !== null && reportPlot.summary.sessions.some(s => !reportPlot.hiddenSessions.has(s.id)
    && reportPlot.cursor >= s.start_ms && reportPlot.cursor < s.end_ms) ? reportPlot.cursor : null;
  const position = time => Math.max(0,Math.min(100,100*(time-view[0])/(view[1]-view[0])));
  const update = canvas => {
    const overlay = canvas.reportOverlay;
    if (!overlay) return;
    overlay.cursor.hidden = cursor === null || cursor < view[0] || cursor > view[1];
    if (!overlay.cursor.hidden) overlay.cursor.style.left = position(cursor)+'%';
    const selection = reportPlot.gesture?.selection;
    overlay.selection.hidden = !selection || selection[1] <= view[0] || selection[0] >= view[1];
    if (!overlay.selection.hidden) {
      const left = position(selection[0]);
      overlay.selection.style.left = left+'%';
      overlay.selection.style.width = (position(selection[1])-left)+'%';
    }
  };
  update(document.getElementById('reportEventStrip'));
  reportPlot.rows.forEach(row => {
    if (row.card.hidden) return;
    update(row.canvas);
    const shown = row.channels.filter(member => !reportPlot.hiddenChannels.has(member.id));
    const channels = shown.map(member => data?.channels?.find(c => c.id === member.id));
    shown.forEach((member,i) => {
      const bucket = cursor === null ? null : reportArtifactValue(channels[i],cursor);
      const low = reportBucket(bucket) ? reportNumber(bucket[0]) : '--';
      const high = reportBucket(bucket) ? reportNumber(bucket[1]) : '--';
      const text = cursor === null ? '' : low === high ? low : low + '..' + high;
      (member.value || row.value).textContent = text ? (row.channels.length > 1 ? ' ' : '') + text : '';
    });
  });
  document.getElementById('reportCursor').textContent = cursor === null ? '' : reportTime(cursor).slice(11);
}

function reportPointerX(canvas, clientX) {
  const rect = canvas.getBoundingClientRect();
  return Math.max(0,Math.min(1,(clientX-rect.left-44)/(Math.max(100,rect.width)-52)));
}

function bindReportPlot(canvas) {
  if (!reportPlot.resizeObserver && typeof ResizeObserver === 'function') {
    reportPlot.resizeObserver = new ResizeObserver(entries => {
      if (reportPlot.view && entries.some(entry => entry.contentRect.width > 0 && entry.contentRect.height > 0)) scheduleReportDraw();
    });
    reportPlot.resizeObserver.observe(document.getElementById('reportPlots'));
    reportPlot.resizeObserver.observe(document.getElementById('reportEventCard'));
  }
  if (canvas.dataset.reportBound) return;
  canvas.dataset.reportBound = '1';
  const surface = document.createElement('div'); surface.className = 'report-chart-surface';
  canvas.replaceWith(surface); surface.append(canvas);
  const overlay = document.createElement('div'); overlay.className = 'report-plot-overlay';
  overlay.setAttribute('aria-hidden','true');
  const cursor = document.createElement('div'); cursor.className = 'report-plot-cursor'; cursor.hidden = true;
  const selection = document.createElement('div'); selection.className = 'report-plot-selection'; selection.hidden = true;
  overlay.append(selection,cursor); surface.append(overlay);
  canvas.reportOverlay = {cursor,selection};
  uiText(canvas, uiMessage('report.gesture'), 'title');
  canvas.addEventListener('dblclick', resetReportViewport);
  canvas.addEventListener('keydown', e => {
    if (!reportPlot.view) return;
    const [from,to] = reportPlot.view, width = to-from;
    if (e.key === 'Home') resetReportViewport();
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      const shift = width*0.1*(e.key === 'ArrowLeft' ? -1 : 1);

    if (reportLoading || !reportPlot.view || (e.pointerType === 'mouse' && e.button !== 0)) return;

    if (e.pointerType !== 'touch') { e.preventDefault(); canvas.setPointerCapture(e.pointerId); }
    canvas.focus({preventScroll:true});
    const x = reportPointerX(canvas,e.clientX);
    reportPlot.pointers.set(e.pointerId,x);
    const view = reportPlot.view;
    const logicalWidth = Math.max(100,canvas.getBoundingClientRect().width);
    const mode = reportPlot.pointers.size === 2 ? 'pinch' : 'select';

    reportPlot.gesture = {canvas,mode,view:[...view],points:[...reportPlot.pointers.values()],

      origin:[e.clientX,e.clientY]};

      reportPlot.pointers.set(e.pointerId,x);
      const points = [...reportPlot.pointers.values()], base = gesture.points, view = gesture.view;
      const width = view[1]-view[0], fullWidth = reportPlot.full[1]-reportPlot.full[0];
      if (points.length === 2 && base.length === 2) {
        const distance = Math.abs(points[1]-points[0]), original = Math.abs(base[1]-base[0]);
        if (distance > 0.001 && original > 0.001) {
          const span = Math.max(Math.min(1000,fullWidth),Math.min(fullWidth,width*original/distance));

      move(e);

    }
    if (reportPlot.pending) reportPlot.pending = {...reportPlot.pending,view:[...reportPlot.view],serial:reportPlot.serial};

    const needsData = reportPlot.serial !== gesture.initialSerial

  canvas.addEventListener('pointerleave', () => {
    if (!reportPlot.gesture) { reportPlot.cursor = null; scheduleReportDraw(false,false); }
  });
}

function renderField(s) {
  const div = document.createElement('div');
  div.className = 'row';
  const label = document.createElement('label');
  if (s.source === 'custom') label.textContent = s.label + (s.units ? ' (' + s.units + ')' : '');
  else uiText(label, uiMessage('common.value', {value:{items:[
    uiMessage('clinical.label.' + s.cmd, {}, s.label), s.units ? '(' + s.units + ')' : null
  ].filter(Boolean),separator:' '}}));
  div.appendChild(label);
  if (s.type === 'enum') {
    const select = document.createElement('select');
    select.dataset.cmd = s.cmd;
    const options = s.options || [];
    options.forEach((o, i) => {
      const option = document.createElement('option');
      option.value = typeof o === 'object' ? o.value : i;
      if (s.source === 'custom') option.textContent = typeof o === 'object' ? o.label : o;
      else uiText(option, uiMessage('clinical.option.' + s.cmd + '.' + option.value, {}, typeof o === 'object' ? o.label : o));
      select.appendChild(option);
    });
    select.value = String(s.value);
    select.dataset.orig = select.value;
    select.disabled = s.editable === false || options.length === 0;
    div.appendChild(select);
  } else {
    const input = document.createElement('input');
    input.type = 'number';
    input.dataset.cmd = s.cmd;
    input.value = s.display !== undefined ? s.display : (s.value >= 0 ? s.value : '');
    input.dataset.orig = input.value;
    input.step = s.step || 1;
    if (s.min !== undefined) input.min = s.min;
    if (s.max !== undefined) input.max = s.max;
    input.disabled = s.editable === false;
    div.appendChild(input);
  }
  return div;
}

let clinicalRevision = null, clinicalEpoch = 0;
const clinicalWaiters = new Set();

function wakeClinicalRequests() {
  clinicalEpoch++;
  clinicalWaiters.forEach(wake => wake());
}

async function settingsRequest(options, endpoint = '/api/settings', query = '') {
  const controller = new AbortController();
  const signal = options?.signal ? AbortSignal.any([options.signal, controller.signal]) : controller.signal;
  const timer = setTimeout(() => controller.abort(new Error('settings_timeout')), 35000);
  let wake = null;
  const changed = () => { if (wake) { const resolve = wake; wake = null; resolve(); } };
  clinicalWaiters.add(changed);
  signal.addEventListener('abort', changed);
  try {
    signal.throwIfAborted();
    let epoch = clinicalEpoch;
    let r = await api(endpoint + query, {...options, signal});
    if (!r) throw new Error('request_cancelled');
    let data = await r.json();
    const job = data.job;
    while (r.status === 202) {
      if (!job) throw new Error('settings_job_unavailable');
      signal.throwIfAborted();
      // A completion during the previous HTTP request already permits retrieval.
      if (epoch === clinicalEpoch) await new Promise(resolve => { wake = resolve; });
      signal.throwIfAborted();
      epoch = clinicalEpoch;
      r = await api(endpoint + '?job=' + encodeURIComponent(job), {signal});
      if (!r) throw new Error('request_cancelled');
      data = await r.json();
    }
    signal.throwIfAborted();
    if (!r.ok) throw new Error(data.error || 'settings_request_failed');
    return data;
  } finally {
    clearTimeout(timer);
    signal.removeEventListener('abort', changed);
    clinicalWaiters.delete(changed);
  }
}

let clinicalRead = null, clinicalGeneration = 0, clinicalSaving = false;
function clinicalDirty(except) {
  return Array.from(document.querySelectorAll('#p-clinical [data-cmd]')).some(
    inp => inp.dataset.cmd !== except && inp.value !== inp.dataset.orig);
}

function loadSettings(force = false) {
  if (clinicalRead) return clinicalRead;
  if (clinicalSaving && !force) return Promise.resolve(false);
  if (!force && clinicalDirty() && !confirm(t('clinical.unsavedRefresh')))
    return Promise.resolve(false);
  const generation = ++clinicalGeneration;
  const fields = Array.from(document.querySelectorAll('#p-clinical [data-cmd]'));
  const values = fields.map(inp => inp.value);
  clinicalRead = (async () => {
  const spinner = document.getElementById('clinicalSpinner');
  const msgEl = document.getElementById('clinicalMsg');
  if (spinner) spinner.style.display = 'block';
  try {
    const data = await settingsRequest();
    if (generation !== clinicalGeneration) return false;
    if (fields.some((inp, i) => inp.value !== values[i])) {
      showMsg(msgEl, uiMessage('clinical.keptDrafts'), 'ok');
      return false;
    }
    settings = data;
    const containers = {therapy:'therapyFields',comfort:'comfortFields',accessories:'accessoriesFields',options:'optionsFields',configuration:'configurationFields'};
    for (const c in containers) { const el = document.getElementById(containers[c]); if (el) el.innerHTML = ''; }
    const groups = new Map();
    settings.forEach(s => {
      const target = containers[s.group];
      const el = document.getElementById(target);
      if (el) {
        let parent = el;
        const path = [s.group];
        (s.groups || []).forEach(name => {
          path.push(name);
          const key = JSON.stringify(path);
          let section = groups.get(key);
          if (!section) {
            section = document.createElement('section');
            section.className = 'setting-group';
            const heading = document.createElement('h4');
            heading.textContent = name;
            section.appendChild(heading);
            parent.appendChild(section);
            groups.set(key, section);
          }
          parent = section;
        });
        const field = renderField(s);
        parent.appendChild(field);
        if (s.cmd === 'MOP') {
          const select = field.querySelector('select');
          if (select) select.addEventListener('change', async e => {
            const previous = select.dataset.orig;
            if (clinicalSaving || (clinicalDirty('MOP') &&
                !confirm(t('clinical.unsavedMode')))) {
              select.value = previous;
              return;
            }
            try {
              const saved = await writeClinical({MOP:String(e.target.value)});
              if (saved.errors) throw new Error(saved.errors.join(', '));
            } catch (error) {
              select.value = previous;
              showMsg(msgEl, uiError(error), 'err');
            }
          });
          curMode = parseInt(s.value) || 0;
        }
      }
    });
    return true;
  } catch(e) { showMsg(msgEl, uiMessage('common.error', {detail:uiError(e)}), 'err'); return false; }
  finally { if (spinner && generation === clinicalGeneration) spinner.style.display = 'none'; }
  })();
  const pending = clinicalRead;
  pending.finally(() => { if (clinicalRead === pending) clinicalRead = null; });
  return pending;
}

async function writeClinical(changes) {
  clinicalSaving = true;
  clinicalGeneration++;
  clinicalRead = null;
  const controls = Array.from(document.querySelectorAll(
    '#p-clinical input:enabled, #p-clinical select:enabled, #p-clinical button:enabled'));
  controls.forEach(control => { control.disabled = true; });
  try {
    const result = await settingsRequest({method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(changes)});
    if (!result.errors && !await loadSettings(true))
      throw new Error('settings_readback_failed');
    return result;
  } finally {
    clinicalSaving = false;
    controls.forEach(control => { control.disabled = false; });
    document.getElementById('clinicalSpinner').style.display = 'none';
  }
}

async function saveSettings() {
  if (clinicalSaving) return;
  const changes = {};
  let invalid = null;
  const containers = {therapy:'therapyFields',comfort:'comfortFields',accessories:'accessoriesFields',options:'optionsFields',configuration:'configurationFields'};
  Object.keys(containers).forEach(g => {
    const el = document.getElementById(containers[g]); if (!el) return;
    el.querySelectorAll('[data-cmd]').forEach(inp => {
      if (inp.disabled) return;
      const s = settings.find(x => x.cmd === inp.dataset.cmd); if (!s) return;
      const newVal = inp.value;
      if (s.type !== 'enum') {
        if (newVal === '' && s.value < 0) return;
        if (newVal.trim() === '' || !Number.isFinite(Number(newVal)) || !inp.checkValidity()) {
          if (!invalid) invalid = inp;
          return;
        }
      }
      if (s.type === 'enum') { if (parseInt(newVal) !== parseInt(s.value)) changes[s.cmd] = newVal; }
      else if (s.type === 'numeric') {
        const display = parseFloat(newVal);
        let raw = Math.round(display);
        if (s.scale > 0) raw = Math.round(display * s.scale);
        else if (s.scale < 0) raw = Math.round(display / Math.abs(s.scale));
        if (raw !== Number(s.value)) changes[s.cmd] = String(raw);
      }
      else if (s.scale_div && s.scale_div > 1) { const raw = Math.round(parseFloat(newVal) * s.scale_div); if (raw !== parseInt(s.value)) changes[s.cmd] = String(raw); }
      else { if (newVal !== String(s.value)) changes[s.cmd] = newVal; }
    });
  });
  const msgEl = document.getElementById('clinicalMsg');
  if (invalid) {
    invalid.focus();
    invalid.reportValidity();
    showMsg(msgEl, uiMessage('clinical.invalid', {key:invalid.dataset.cmd}), 'err');
    return;
  }
  if (!Object.keys(changes).length) { showMsg(msgEl, uiMessage('common.noChanges'), 'ok'); return; }
  try {
    const d = await writeClinical(changes);
    if (d.errors && d.errors.length) showMsg(msgEl, uiMessage('common.errors', {detail:{items:d.errors.map(uiError),separator:', '}}), 'err');
    else showMsg(msgEl, uiMessage('clinical.saved', {count:Object.keys(changes).length}), 'ok');
  } catch(e) { showMsg(msgEl, uiMessage('common.error', {detail:uiError(e)}), 'err'); }
}

let wifiRead = null, wifiSerial = 0, wifiRevision = null;
function loadWifiNets() {
  if (wifiRead) return wifiRead;
  const serial = wifiSerial;
  wifiRead = (async () => {
  try {
    var r = await api('/api/wifi', undefined, 5000); if (!r || !r.ok) return;
    var d = await r.json();

      d.networks.forEach(function(net, i) {
        var row = document.createElement('div');

        var rssi_str = net.rssi ? ' (' + net.rssi + ' dBm)' : '';

          ? ' <span class="badge badge-streaming wifi-connected" style="margin-left:8px"></span>'
          : (net.rssi ? ' <span style="color:var(--text-dim);margin-left:8px;font-size:12px">' + net.rssi + ' dBm</span>' : '');
        row.innerHTML = '<label><strong></strong>' + status +

        row.querySelector('strong').textContent = net.ssid;
        if (connected) uiText(row.querySelector('.wifi-connected'), uiMessage('wifi.connectedSignal', {signal:rssi_str}));
        translateUi(row);
        row.querySelector('button').onclick = () => wifiRemove(i);
        el.appendChild(row);
      });
    } else {
      el.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px 0" data-i18n="wifi.noNetworks"></div>';
      translateUi(el);
    }
    var ws = document.getElementById('wifiState');
    uiText(ws, uiMessage(d.roam === '1' ? 'wifi.roamingState' : 'wifi.state', {state:uiMessage('wifi.state.' + d.state, {}, d.state)}));
  } catch(e) { console.error(e); }
  })().finally(() => {
    wifiRead = null;
    if (serial !== wifiSerial && document.getElementById('p-device').classList.contains('active') && configSection === 'network') loadWifiNets();
