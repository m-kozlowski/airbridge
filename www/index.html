// ESP32 OTA
const efi = document.getElementById('espFileInput');
const efu = document.getElementById('espFirmwareUrl');
efi.addEventListener('change', () => {
  if (efi.files.length) efu.value = '';
  renderEspInstall();
});
efu.addEventListener('input', () => {
  if (efu.value.trim()) efi.value = '';
  renderEspInstall();
});

function renderEspInstall(d = otaStatus) {
  const active = espSubmitting || espReady || !!otaWatch?.restarting ||
    ['checking', 'installing', 'rebooting', 'busy'].includes(d?.state);
  const url = efu.value.trim(), file = efi.files[0];
  const blocked = url ? d?.blocked : d?.upload_blocked;
  document.getElementById('btnOtaCheck').disabled = !d || active ||
    d.state === 'disabled' || !!d.blocked;
  document.getElementById('btnOtaInstall').disabled = !d || active ||
    !d.release_installable || !!d.blocked;
  efi.disabled = efu.disabled = !d || active;
  const button = document.getElementById('btnEspInstall');
  button.disabled = !d || active || !!blocked || (!file && !url) || (!!file && !!url);
  uiText(button, blocked ? uiMessage('ota.blockedReason', {reason:uiError(blocked)}) : '', 'title');
  const reboot = document.getElementById('btnEspReboot');
  reboot.style.display = espReady ? '' : 'none';
  reboot.disabled = espSubmitting;
}

async function espInstall() {
  if (document.getElementById('btnEspInstall').disabled) return;
  const file = efi.files[0], url = efu.value.trim();
  if (file) return espUploadFile(file);
  try {
    const parsed = new URL(url);
    if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('update_url_invalid');
  } catch(e) {
    showMsg(document.getElementById('otaReleaseMsg'), uiMessage('ota.invalidFirmwareUrl'), 'err', 0);
    return;
  }
  return otaAction('install', url);
}

function uploadResponse(xhr) {
  let data;
  try { data = JSON.parse(xhr.responseText); }
  catch(e) { throw uiFailure('ota.badUploadResponse', {status:String(xhr.status)}); }
  if (xhr.status !== 200 || !data || (data.ok !== true && data.ok !== 'true')) {
    const error = (data && data.error) || xhr.statusText;
    throw error ? new Error(error) : uiFailure('ota.uploadRejected');
  }
  return data;
}

async function espUploadFile(file) {
  var msgEl = document.getElementById('otaReleaseMsg');
  espSubmitting = true;
  if (otaStatus) renderOtaStatus(otaStatus);
  showMsg(msgEl, uiMessage('ota.uploadSending'), 'ok', 0);
  var prog = document.getElementById('otaReleaseProgress'), bar = document.getElementById('otaReleaseBar');
  prog.style.display = 'block'; bar.style.width = '0%';
  uiText(document.getElementById('espProgressText'), '0%');
  try {
    await new Promise((resolve, reject) => {
      var xhr = new XMLHttpRequest();
      xhr.upload.onprogress = function(e) {
        if (!e.lengthComputable) return;
        const percent = Math.floor(e.loaded / e.total * 100);
        bar.style.width = percent + '%';
        uiText(document.getElementById('espProgressText'), percent + '%');
      };
      xhr.onload = function() {
        try { resolve(uploadResponse(xhr)); } catch(e) { reject(e); }
      };
      xhr.onerror = xhr.onabort = () => reject(uiFailure('ota.uploadError'));
      var fd = new FormData(); fd.append('firmware', file);
      xhr.open('POST', '/api/esp32/upload'); xhr.send(fd);
    });
    espReady = true;
    bar.style.width = '100%';
    uiText(document.getElementById('espProgressText'), '100%');
    await espReboot();
  } catch(e) { showMsg(msgEl, uiMessage('ota.uploadFailed', {error:uiError(e)}), 'err', 0); }
  finally { espSubmitting = false; if (otaStatus) renderOtaStatus(otaStatus, true); }
}

async function espReboot() {
  const baseline = {...lastStatus};
  const msg = document.getElementById('otaReleaseMsg');
  espSubmitting = true;
  renderEspInstall();
  showMsg(msg, uiMessage('ota.rebooting'), 'ok', 0);
  try {
    const response = await api('/api/reboot', {method:'POST'});
    if (!response?.ok) throw uiFailure('ota.requestRejected');
    watchOta(true, baseline);
    finishOtaObservation();
  } catch(e) {
    showMsg(msg, uiMessage('ota.restartFailed', {error:uiError(e)}), 'err', 0);
  } finally { espSubmitting = false; renderEspInstall(); }
}

function firmwareImageMessages(d) {
  const messages = [];
  const warn = (key, params = {}) => messages.push(uiMessage(key, params));
  let allOk = true;
  if (d.bid && d.bid_ok === false) { warn('ota.unsupportedBootloader', {bid:d.bid}); allOk = false; }
  if (d.blx_crc === 'fail') { warn('ota.blxCrcMismatch'); allOk = false; }
  if (d.ccx_crc === 'fail') { warn('ota.ccxCrcMismatch'); allOk = false; }
  if (d.cdx_crc === 'fail') { warn('ota.cdxCrcMismatch'); allOk = false; }
  if (d.blx_patch === 'method_a') { warn('ota.dangerousBootloader'); allOk = false; }
  else if (d.blx_patch === 'method_b') warn('ota.safeBootloaderPatch');
  else if (d.blx_patch === 'partial') { warn('ota.partialBootloaderPatch'); allOk = false; }
  else if (d.blx_patch === 'none' && d.bid) warn('ota.noBootloaderPatch');
  if (allOk && d.bid && d.bid_ok === true && d.crc_ok === true)
    warn('ota.verificationPassed', {bid:d.bid});
  return messages;
}

let resmedFresh = false, resmedRequest = false;
let resmedAuthFailed = false, resmedConnectionSerial = 0;
let firmwareRepository = null, firmwareRepositoryRead = null, firmwareRepositoryDirty = true;
let firmwareRepositorySerial = 0, firmwareRepositoryRevision = null, firmwareRepositoryError = '';
let firmwareDirectory = '';
let firmwareOffset = 0;
let firmwareConfirmationKey = '';
let firmwareUploadRequest = false, firmwareUploadId = null;
let firmwareUploadProgress = {sent:0,total:0,failed:false};
let firmwareProgressKind = 'operation';
let firmwareUploadAbort = null;
let firmwareUploadChoice = null;
let firmwareInstallIntent = null;

function firmwarePhase(phase) {
  const block = /^(Erase|Flash) (BLX|CCX|CDX|CMX)$/.exec(phase || '');
  return block ? uiMessage('ota.phase.' + block[1], {block:block[2]}) :
    uiMessage('ota.phase.' + phase, {}, phase || '--');
}

function appendFirmwareMessages(messages) {
  if (!messages.length) return;
  const el = document.getElementById('firmwareMessages');
  const time = new Date().toLocaleTimeString(uiLanguage,
    {hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  el.value += messages.map(message => time + '  ' + uiValue(message)).join('\n') + '\n';
  el.scrollTop = el.scrollHeight;
}

function appendFirmwareProgress(data) {
  // The first snapshot is a baseline, not a replay of an earlier operation.
  if (!resmedFresh || resmedAuthFailed) return;
  for (const key of ['file_upload', 'resmed']) {
    const state = data[key], previous = lastStatus[key];
    if (!state?.id || !previous) continue;
    const old = state.id === previous.id ? previous : {};
    const upload = key === 'file_upload', path = upload ? 'path' : 'source_path';
    if (upload && state.sd && !state.repository) continue;
    const messages = [];
    if (state[path] && state[path] !== old[path]) messages.push(state[path]);
    if (upload && state.detected_block && state.detected_block !== old.detected_block)
      messages.push(uiMessage('ota.flashDetected', {block:state.detected_block, size:Math.round(state.size/1024)}));
    if (['bid', 'bid_ok', 'crc_ok', 'blx_crc', 'ccx_crc', 'cdx_crc', 'blx_patch']
        .some(field => state[field] !== old[field]))
      messages.push(...firmwareImageMessages(state));
    if (!upload && state.phase && state.phase !== 'Idle' && state.phase !== old.phase)
      messages.push(firmwarePhase(state.phase));
    if (state.error && state.error !== old.error)
      messages.push(uiMessage(upload ? 'ota.uploadFailed' : 'ota.error', {error:uiError(state.error)}));
    else if (upload && state.ready && !old.ready)
      messages.push(uiMessage(state.repository ? 'ota.repositoryUploadReady' : 'ota.stagedUploadReady'));
    appendFirmwareMessages(messages);
  }
}

function resmedDisconnected(reconnect = false) {
  resmedFresh = false;
  firmwareInstallIntent = null;
  fi.value = '';
  closeFirmwareUploadChoice();
  firmwareUploadAbort?.abort();
  firmwareConfirmationKey = '';
  document.getElementById('firmwareDumpConsent').checked = false;
  if (reconnect) {
    resmedConnectionSerial++;
    firmwareRepositorySerial++;
    firmwareRepositoryRevision = null;
    firmwareRepository = null;
    firmwareRepositoryDirty = true;
    firmwareUploadId = null;
    firmwareUploadProgress = {sent:0,total:0,failed:false};
    delete lastStatus.resmed;
    delete lastStatus.file_upload;
    delete lastStatus.firmware_repository_revision;
    renderFirmwareRepository();
  }
  renderResmedStatus();
}

function applyResmedStatus(data) {
  if (resmedAuthFailed) return;
  if (data.resmed !== undefined) resmedFresh = true;
  if (data.file_upload?.active && (!data.file_upload.sd || data.file_upload.repository)) firmwareProgressKind = 'upload';
  if (data.resmed?.active) firmwareProgressKind = 'operation';
  if (data.firmware_repository_revision !== undefined && data.firmware_repository_revision !== firmwareRepositoryRevision) {
    firmwareRepositoryRevision = data.firmware_repository_revision;
    firmwareRepositorySerial++;
    firmwareRepositoryDirty = true;
  }
  renderResmedStatus();
  loadFirmwareRepository();
  continueFirmwareInstall();
}

async function loadFirmwareRepository() {
  if (storageMutation || firmwareRepositoryRead || !firmwareRepositoryDirty || !resmedFresh ||
      !document.getElementById('p-ota').classList.contains('active')) return;
  const serial = firmwareRepositorySerial;
  firmwareRepositoryDirty = false;
  firmwareRepositoryError = '';
  firmwareRepositoryRead = (async () => {
    try {
      const query = new URLSearchParams({offset:firmwareOffset});
      if (firmwareDirectory) query.set('path', firmwareDirectory);
      const response = await api('/api/resmed/repository?' + query, undefined, 15000);
      if (!response) { resmedAuthFailed = true; resmedDisconnected(); return; }
      const data = await response.json();
      if (serial !== firmwareRepositorySerial || storageMutation || !resmedFresh) return;
      if (!response.ok) {
        if (data.error === 'directory_not_found' && firmwareDirectory &&
            firmwareRepository?.root && firmwareDirectory !== firmwareRepository.root) {
          firmwareDirectory = firmwareDirectory.slice(0, firmwareDirectory.lastIndexOf('/'));
          firmwareOffset = 0;
          firmwareRepositoryDirty = true;
          return;
        }
        throw new Error(data.error || 'repository_unavailable');
      }
      if (typeof data.supported !== 'boolean' || typeof data.ready !== 'boolean' || !Array.isArray(data.entries))
        throw new Error('repository_invalid_response');
      firmwareRepository = data;
      if (data.ready) {
        firmwareDirectory = data.path;
        if (firmwareOffset && !data.entries.length) {
          firmwareOffset = 0;
          firmwareRepositoryDirty = true;
          return;
        }
      }
      renderFirmwareRepository();
    } catch(error) {
      if (serial === firmwareRepositorySerial) firmwareRepositoryError = uiError(error);
    }
  })().finally(() => {
    firmwareRepositoryRead = null;
    renderResmedStatus();
    if (firmwareRepositoryDirty) loadFirmwareRepository();
  });
  renderResmedStatus();
  return firmwareRepositoryRead;
}

function openFirmwareDirectory(path, offset = 0) {
  if (!resmedFresh || !firmwareRepository?.ready || firmwareRepositoryDirty ||
      firmwareRepositoryRead || firmwareRepositoryError || storageMutation ||
      resmedRequest || firmwareUploadRequest) return;
  path ??= firmwareDirectory.slice(0, firmwareDirectory.lastIndexOf('/'));
  const ancestor = path.startsWith(firmwareRepository.root + '/') &&
    firmwareDirectory.startsWith(path + '/');
  if (path !== firmwareDirectory && path !== firmwareRepository.root && !ancestor && !firmwareRepository.entries.some(entry =>
    entry.directory && entry.path === path)) return;
  firmwareDirectory = path;
  firmwareOffset = Math.max(0, offset);
  firmwareRepositorySerial++;
  firmwareRepositoryDirty = true;
  loadFirmwareRepository();
}

function renderFirmwareRepository() {
  const entries = document.getElementById('firmwareEntries');
  // An invalidated inventory is not an empty directory. Keep its rows inert
  // until the owner publishes the replacement or the card becomes unavailable.
  if (firmwareRepository?.supported && firmwareRepository.available !== false &&
      !firmwareRepository.ready) return;
  entries.replaceChildren();
  if (!firmwareRepository?.ready) return;
  const root = firmwareRepository.root;
  if (!firmwareDirectory || (firmwareDirectory !== root && !firmwareDirectory.startsWith(root + '/')))
    firmwareDirectory = root;
  for (const entry of [...firmwareRepository.entries].sort((a, b) =>
      Number(!!b.directory) - Number(!!a.directory) || a.name.localeCompare(b.name))) {
    const row = document.createElement('div'); row.className = 'storage-row';
    const content = document.createElement('div');
    const relative = entry.name;
    const name = document.createElement('a'); name.textContent = relative;
    if (entry.directory) {
      name.textContent += '/';
      name.href = '#ota';
      name.onclick = event => {
        event.preventDefault();
        if (name.getAttribute('aria-disabled') !== 'true') openFirmwareDirectory(entry.path);
      };
      content.append(name);
      row.append(content);
      entries.append(row);
      continue;
    }
    name.href = '/api/storage/download?path=' + encodeURIComponent(entry.path);
    name.download = entry.name;
    uiText(name, uiMessage('storage.downloadFile', {name:relative}), 'aria-label');
    name.onclick = event => { if (name.getAttribute('aria-disabled') === 'true') event.preventDefault(); };
    const detail = document.createElement('small');
    uiText(detail, uiMessage('common.value', {value:{items:[
      uiMessage('common.unit', {value:{number:entry.size/1024,max:1,min:1}, unit:'KiB'}),
      ...(entry.modified > 0 ? [syncStorageTimestamp(entry.modified)] : [])], separator:' | '}}));
    content.append(name, detail);
    const actions = document.createElement('div'); actions.className = 'storage-entry-actions';
    const install = document.createElement('button'); install.className = 'btn btn-accent';
    install.dataset.firmwareAction = 'install';
    install.dataset.path = entry.path;
    uiText(install, uiMessage('ota.installImage'));
    uiText(install, uiMessage('ota.repositoryAction', {action:uiMessage('ota.installImage'), name:relative}), 'aria-label');
    install.onclick = () => startFlash(entry.path);
    actions.append(install);
    for (const kind of ['rename', 'delete']) {
      if (kind === 'rename' && entry.bootloader === true) continue;
      const button = document.createElement('button'); button.className = 'btn' + (kind === 'delete' ? ' btn-danger' : '');
      button.dataset.firmwareAction = kind;
      const action = uiMessage(kind === 'delete' ? 'ota.repositoryDelete' : 'storage.rename');
      uiText(button, action);
      uiText(button, uiMessage('ota.repositoryAction', {action,name:relative}), 'aria-label');
      button.onclick = () => mutateFirmwareEntry(kind, entry);
      actions.append(button);
    }
    row.append(content, actions); entries.append(row);
  }
}

async function mutateFirmwareEntry(kind, entry) {
  if (kind === 'rename') return storageRename(entry.name, entry.path, true);
  if (confirm(t('storage.confirmDelete', {names:entry.name})))
    return storageMutate('delete', new URLSearchParams({path:entry.path}), true);
}

async function refreshFirmwareRepository() {
  if (!resmedFresh || resmedRequest || firmwareUploadRequest) return;
  resmedRequest = true;
  renderResmedStatus();
  try {
    const response = await api('/api/resmed/repository', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'refresh'})}, 5000);
    if (!response) { resmedAuthFailed = true; resmedDisconnected(); return; }
    const data = await response.json();
    if (!response.ok || data.ok !== true) throw new Error(data.error || 'repository_unavailable');
    // Completion is published by the repository owner, including unchanged scans.
  } catch(error) { firmwareRepositoryError = uiError(error); }
  finally { resmedRequest = false; renderResmedStatus(); }
}

function resmedInstallSource() {
  const upload = lastStatus.file_upload;
  if (upload?.ready === true && upload.sd !== true && upload.repository === false &&
      (firmwareUploadId === null || upload.id === firmwareUploadId)) return {upload_id:upload.id};
  return null;
}

function renderResmedStatus() {
  const state = lastStatus.resmed || {};
  const otherUpload = lastStatus.file_upload?.sd && !lastStatus.file_upload.repository;
  const upload = otherUpload ? null : lastStatus.file_upload;
  const repository = firmwareRepository;
  const busy = !!storageMutation || resmedRequest || firmwareUploadRequest || !!firmwareInstallIntent ||
    (otherUpload && lastStatus.file_upload.active);
  const repositoryReady = resmedFresh && repository?.ready && !firmwareRepositoryDirty && !firmwareRepositoryRead && !firmwareRepositoryError;
  document.getElementById('firmwareRepository').hidden = repository?.supported === false;
  uiText(document.getElementById('firmwareRepositoryPath'), firmwareDirectory || repository?.root || '');
  document.getElementById('firmwareRepositoryPath').hidden = !repository?.root;
  document.getElementById('firmwareUp').disabled = !repositoryReady || busy ||
    !firmwareDirectory || firmwareDirectory === repository?.root;
  document.getElementById('firmwarePages').hidden = !firmwareOffset && !repository?.more;
  document.getElementById('firmwarePrev').disabled = !repositoryReady || busy || !firmwareOffset;
  document.getElementById('firmwareNext').disabled = !repositoryReady || busy || !repository?.more;
  const uploadAllowed = resmedFresh && !busy && upload?.active !== true && state.upload_allowed === true;
  const repositoryUploadAllowed = uploadAllowed && repositoryReady && repository?.supported === true;
  fi.disabled = !uploadAllowed;
  rfi.disabled = !repositoryUploadAllowed;
  document.getElementById('btnFirmwareAdd').disabled = !repositoryUploadAllowed;
  document.getElementById('firmwareBootloader').disabled = !repositoryUploadAllowed;
  document.getElementById('btnFirmwareUploadChoice').disabled = !repositoryUploadAllowed || !firmwareUploadChoice;
  const uploadCancel = document.getElementById('btnFirmwareUploadCancel');
  uploadCancel.hidden = upload?.cancel_allowed !== true;
  uploadCancel.disabled = !resmedFresh || resmedRequest;
  uiText(uploadCancel, uiMessage(upload?.ready && upload.repository === false ? 'ota.discardStagedUpload' : 'common.cancel'));
  document.getElementById('btnFirmwareRefresh').disabled = !resmedFresh || busy || !!firmwareRepositoryRead;
  const staged = upload?.repository === false && (upload.active || upload.ready);
  document.querySelectorAll('#firmwareEntries button').forEach(el => {
    el.disabled = !repositoryReady || busy || staged ||
      (el.dataset.firmwareAction === 'install' && state.install_allowed !== true);
    if (el.dataset.firmwareAction === 'install')
      uiText(el, state.install_blocked || state.blocked ? uiError(state.install_blocked || state.blocked) : '', 'title');
  });
  document.querySelectorAll('#firmwareEntries a').forEach(el => { el.setAttribute('aria-disabled', String(!repositoryReady || busy)); });
  const repositoryError = repository?.supported === false ? '' : firmwareRepositoryError ||
    (repository?.error && !['storage_busy', 'storage_changed'].includes(repository.error) ? uiError(repository.error) : '');
  uiText(document.getElementById('firmwareRepositoryState'), !resmedFresh ? '' :
    repositoryError || (state.active || upload?.active || firmwareUploadRequest ? '' : storageMutation ?
    uiMessage(storageMutation === 'delete' ? 'storage.deleting' : 'storage.renaming') :
    repository?.supported !== false && (repository?.error || (repository && !repository.ready)) ?
      uiMessage('ota.repositoryRefreshing') :
    repository?.supported !== false && (firmwareRepositoryRead || !repository) ? uiMessage('ota.repositoryLoading') :
    state.blocked ? uiError(state.blocked) :
    repository?.supported === false ? '' :
      !repository?.entries.length ? uiMessage(firmwareDirectory === repository?.root ?
        'ota.repositoryEmpty' : 'storage.emptyDirectory') : ''));
  document.getElementById('btnFirmwareDump').disabled = !resmedFresh || busy || state.dump_allowed !== true;
  uiText(document.getElementById('btnFirmwareDump'),
    state.dump_blocked || state.blocked ? uiError(state.dump_blocked || state.blocked) : '', 'title');

  const source = resmedInstallSource();
  document.getElementById('btnFlash').disabled = !resmedFresh || busy || state.install_allowed !== true ||
    !(source || (fi.files[0] && uploadAllowed));
  document.querySelectorAll('#flashBlock, #flashBlx, #forceBlx, #flashPreserveSettings').forEach(el => { el.disabled = !resmedFresh || busy || state.active === true; });
  document.getElementById('btnFlashCancel').style.display = state.cancel_allowed === true ? '' : 'none';
  document.getElementById('btnFlashCancel').disabled = !resmedFresh || busy;
  uiText(document.getElementById('btnFlash'),
    state.install_blocked || state.blocked ? uiError(state.install_blocked || state.blocked) : '', 'title');
  const localUpload = firmwareUploadRequest || (firmwareUploadProgress.total > 0 &&
    (firmwareUploadId === null || upload?.id !== firmwareUploadId));
  const showUpload = !state.active && (firmwareUploadRequest || upload?.active ||
    firmwareProgressKind === 'upload' || (!state.id && upload?.id));
  // Chunk ACKs prove owner drain and can arrive before the corresponding SSE.
  const uploadWritten = Math.max(upload?.written || 0,
    firmwareUploadId !== null && upload?.id === firmwareUploadId ? firmwareUploadProgress.sent : 0);
  const phase = showUpload ? uiMessage(localUpload ?
    (firmwareUploadProgress.failed ? 'ota.phase.Error' : firmwareUploadRequest ? 'ota.uploadSending' : 'ota.uploadSaving') :
    upload?.error ? 'ota.phase.Error' : upload?.ready ?
      (upload.repository ? 'ota.repositoryUploadReady' : 'ota.stagedUploadReady') :
    upload?.active ? (uploadWritten < upload.size ? 'ota.uploadSending' : 'ota.uploadSaving') :
    'ota.phase.Idle') : firmwarePhase(state.phase);
  uiText(document.getElementById('flashPhase'), !resmedFresh ? uiMessage('ota.resmedStatusUnavailable') :
    phase);
  const progressTotal = showUpload ? (localUpload ? firmwareUploadProgress.total : upload?.size) : state.total;
  const progressSent = (showUpload ? (localUpload ? firmwareUploadProgress.sent : uploadWritten) : state.sent) || 0;
  document.getElementById('flashProgress').style.display = progressTotal > 0 ? 'block' : 'none';
  document.getElementById('flashBar').style.width = (progressTotal > 0 ? Math.max(0, Math.min(100, progressSent/progressTotal*100)) : 0) + '%';
  uiText(document.getElementById('flashProgressText'), progressTotal > 0 ?
    uiMessage('ota.transferProgress', {percent:Math.round(100 * progressSent / progressTotal),
      sent:Math.round(progressSent/1024),total:Math.round(progressTotal/1024)}) : '--');

  const confirmationKey = state.confirmation_required ? state.id + ':' + state.device_bid + ':' + state.recovery_path : '';
  if (confirmationKey !== firmwareConfirmationKey) {
    firmwareConfirmationKey = confirmationKey;
    document.getElementById('firmwareDumpConsent').checked = false;
  }
  document.getElementById('firmwareDumpConfirmation').hidden = !state.confirmation_required;
  document.getElementById('firmwareDumpConsent').disabled = !resmedFresh || busy || state.confirmation_required !== true;
  uiText(document.getElementById('firmwareRecoveryPath'), state.recovery_path ?
    uiMessage('ota.matchingBootloader', {bid:state.device_bid || '--',path:state.recovery_path}) : '');
  document.getElementById('btnConfirmFirmwareDump').disabled = !resmedFresh || busy ||
    state.confirmation_required !== true || state.recovery_available !== true || !state.recovery_path ||
    !document.getElementById('firmwareDumpConsent').checked;

}

function prepareFirmwareUpload(file, repository = false) {
  if (!file || (repository ? rfi : fi).disabled || firmwareUploadRequest) return;
  if (file.size !== 16384 || !repository) return uploadFile(file, repository);
  firmwareUploadChoice = file;
  document.getElementById('firmwareBootloader').checked = false;
  uiText(document.getElementById('firmwareBootloaderFile'), uiMessage('ota.fileInfo',
    {name:file.name, size:{number:file.size/1024, max:1, min:1}}));
  renderResmedStatus();
  document.getElementById('firmwareBootloaderDialog').showModal();
}

function closeFirmwareUploadChoice() {
  firmwareUploadChoice = null;
  document.getElementById('firmwareBootloaderDialog').close();
  document.getElementById('firmwareBootloader').checked = false;
  rfi.value = '';
}

function confirmFirmwareUploadChoice() {
  if (document.getElementById('btnFirmwareUploadChoice').disabled) return;
  const file = firmwareUploadChoice;
  const bootloader = document.getElementById('firmwareBootloader').checked;
  closeFirmwareUploadChoice();
  return uploadFile(file, true, bootloader);
}

document.getElementById('firmwareBootloaderDialog').addEventListener('cancel', closeFirmwareUploadChoice);

async function uploadFile(file, repository = false, bootloader = false) {
  if (!file || (repository ? rfi : fi).disabled || firmwareUploadRequest) return 0;
  const connection = resmedConnectionSerial;
  const controller = new AbortController();
  firmwareUploadAbort = controller;
  firmwareUploadRequest = true;
  firmwareUploadId = null;
  firmwareProgressKind = 'upload';
  firmwareUploadProgress = {sent:0,total:file.size,failed:false};
  appendFirmwareMessages([uiMessage('ota.uploadSending')]);
  renderResmedStatus();
  try {
    if (!file.size) throw uiFailure('ota.uploadRejected');
    let chunkBytes = 4096;
    for (let offset = 0; offset < file.size;) {
      if (controller.signal.aborted || connection !== resmedConnectionSerial) return;
      const end = Math.min(offset + chunkBytes, file.size);
      const query = new URLSearchParams({offset, final:end === file.size ? '1' : '0'});
      if (offset === 0) {
        query.set('size', file.size);
        if (repository) query.set('path',
          (bootloader ? firmwareRepository.root : firmwareDirectory || firmwareRepository.root) + '/' + file.name);
        else query.set('name', file.name);
        if (bootloader) query.set('bootloader', '1');
      } else query.set('id', firmwareUploadId);

      // The response acknowledges owner drain, not just receipt into its ring.
      const response = await api('/api/upload?' + query, {method:'POST',
        headers:{'Content-Type':'application/octet-stream'}, body:file.slice(offset, end), signal:controller.signal});
      if (controller.signal.aborted || connection !== resmedConnectionSerial) return;
      if (!response) {
        resmedAuthFailed = true;
        resmedDisconnected();
        firmwareUploadProgress.failed = true;
        appendFirmwareMessages([uiMessage('ota.uploadFailed', {error:uiError('authentication_failed')})]);
        return;
      }
      const data = await response.json();
      if (controller.signal.aborted || connection !== resmedConnectionSerial) return;
      if (!response.ok || !data || data.ok !== true) throw data?.error ? new Error(data.error) : uiFailure('ota.uploadRejected');
      if (!Number.isInteger(data.upload_id) || data.upload_id <= 0 ||
          (firmwareUploadId !== null && data.upload_id !== firmwareUploadId)) throw uiFailure('ota.uploadRejected');
      firmwareUploadId = data.upload_id;
      chunkBytes = data.chunk_bytes === undefined ? 4096 : data.chunk_bytes;
      if (!Number.isInteger(chunkBytes) || chunkBytes < 1 || chunkBytes > 65536)
        throw uiFailure('ota.uploadRejected');
      firmwareUploadProgress.sent = end;
      offset = end;
      renderResmedStatus();
    }
    if (lastStatus.file_upload?.id !== firmwareUploadId || lastStatus.file_upload.active)
      appendFirmwareMessages([uiMessage('ota.uploadSaving')]);
    return firmwareUploadId;
  } catch(error) {
    if (!controller.signal.aborted && connection === resmedConnectionSerial) {
      firmwareUploadProgress.failed = true;
      appendFirmwareMessages([uiMessage('ota.uploadFailed', {error:uiError(error)})]);
    }
    return 0;
  } finally {
    firmwareUploadAbort = null;
    firmwareUploadRequest = false;
    if (!repository) fi.value = '';
    rfi.value = '';
    document.getElementById('firmwareBootloader').checked = false;
    renderResmedStatus();
  }
}

function updateBlxVisibility() {
  const v = document.getElementById('flashBlock').value;
  document.getElementById('blxFlashRow').style.display = v === 'FULL' ? 'flex' : 'none';
  const showForce = v === 'BLX' || (v === 'FULL' && document.getElementById('flashBlx').checked);
  document.getElementById('blxForceRow').style.display = showForce ? 'flex' : 'none';
  if (!showForce) document.getElementById('forceBlx').checked = false;
  if (v !== 'FULL') document.getElementById('flashBlx').checked = false;
}
document.getElementById('flashBlock').addEventListener('change', updateBlxVisibility);
document.getElementById('flashBlx').addEventListener('change', updateBlxVisibility);
updateBlxVisibility();

async function startFlash(path = '') {
  if (path) {
    const button = [...document.querySelectorAll('#firmwareEntries [data-firmware-action=install]')]
      .find(button => button.dataset.path === path);
    if (!button || button.disabled) return;
  } else if (document.getElementById('btnFlash').disabled) return;
  const source = path ? {path} : resmedInstallSource();
  const file = path ? null : fi.files[0];
  if (!source && !file) return;
  const block = document.getElementById('flashBlock').value;
  const flashBlx = document.getElementById('flashBlx').checked;
  const forceBlx = document.getElementById('forceBlx').checked;
  const name = path || (source ? lastStatus.file_upload.path || t('ota.stagedSource', {id:source.upload_id}) : file.name);
  if (!confirm(t('ota.confirmInstall', {source:name}))) return;
  const options = {block:block||undefined, flash_blx:flashBlx, force_blx:forceBlx,
    preserve_settings:document.getElementById('flashPreserveSettings').checked};
  if (source) return resmedCommand({...source, ...options});

  // A click authorizes this upload only. SSE readiness, not the last HTTP ACK,
  // permits the install; disconnect/cancel drops this browser continuation.
  const intent = {options, upload_id:null};
  firmwareInstallIntent = intent;
  const id = await uploadFile(file);
  if (firmwareInstallIntent !== intent) return;
  if (!id) firmwareInstallIntent = null;
  else { intent.upload_id = id; continueFirmwareInstall(); }
  renderResmedStatus();
}

function continueFirmwareInstall() {
  const intent = firmwareInstallIntent, upload = lastStatus.file_upload;
  if (!intent?.upload_id || !resmedFresh || firmwareUploadRequest || resmedRequest) return;
  if (upload?.id > intent.upload_id) {
    firmwareInstallIntent = null;
    appendFirmwareMessages([uiMessage('ota.uploadFailed', {error:uiError('upload_not_owned')})]);
    renderResmedStatus();
    return;
  }
  if (upload?.id !== intent.upload_id) return;
  if (upload.error || (!upload.active && !upload.ready)) {
    firmwareInstallIntent = null;
    renderResmedStatus();
    return;
  }
  if (!upload.ready || upload.repository) return;
  firmwareInstallIntent = null;
  resmedCommand({...intent.options, upload_id:intent.upload_id});
}

async function resmedCommand(body, cancel = false) {
  if (!resmedFresh || resmedRequest) return;
  const connection = resmedConnectionSerial;
  resmedRequest = true;
  if (!cancel && body.action !== 'confirm_dump') firmwareProgressKind = 'operation';
  renderResmedStatus();
  try {
    const response = await api(cancel ? '/api/flash/cancel' : '/api/flash', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}, 5000);
    if (!response) { resmedAuthFailed = true; resmedDisconnected(); return; }
    const data = await response.json();
    if (connection !== resmedConnectionSerial) return;
    if (!response.ok || (data.ok !== true && data.ok !== 'true')) throw new Error(data.error || 'resmed_request_rejected');
  } catch(error) { appendFirmwareMessages([uiMessage('ota.error', {error:uiError(error)})]); }
  finally { resmedRequest = false; renderResmedStatus(); }
}

function dumpFirmware() {
  if (!document.getElementById('btnFirmwareDump').disabled) return resmedCommand({action:'dump'});
}

function confirmFirmwareDump() {
  if (document.getElementById('btnConfirmFirmwareDump').disabled) return;
  const id = lastStatus.resmed.id;
  document.getElementById('firmwareDumpConsent').checked = false;
  return resmedCommand({action:'confirm_dump',id,confirm:'INSTALL_PATCHED_BOOTLOADER'});
}

function cancelFlash() {
  if (!resmedFresh || resmedRequest) return;
  firmwareInstallIntent = null;
  if (lastStatus.file_upload?.cancel_allowed === true) {
    firmwareUploadAbort?.abort();
    return resmedCommand({}, true);
  }
  if (!document.getElementById('btnFlashCancel').disabled && lastStatus.resmed?.cancel_allowed === true)
    return resmedCommand({}, true);
}

// Charts
const WAVE_PTS = 500;     // ~20 s @ 25 Hz; covers 4-5 breath cycles
const waveData = {press:[],flow:[],leak:[]};
const slowData = {spo2:[],pulse:[]};
const SLOW_PTS = 150;
let liveSeq = null, slowBucket = null;

// Auto-rescaling. Values stored are raw; min/max grow on overshoot
const chartScales = {
  press: {min: 0,    max: 750, step: 250},               // raw, /50 = cmH2O
  flow:  {min: -250, max: 250, step: 100, symmetric: true}, // raw, /8.33 = L/min
  leak:  {min: 0,    max: 25,  step: 10},                // raw, /0.833 = L/min
};
function expandChartScale(name, values) {
  const scale = chartScales[name];
  if (!scale || !Array.isArray(values)) return scale;
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    if (!Number.isFinite(v) || v < -32000) continue;
    if (scale.symmetric) {
      while (v < scale.min || v > scale.max) {
        scale.min -= scale.step;
        scale.max += scale.step;
      }
    } else {
      while (v > scale.max) scale.max += scale.step;
    }
  }
  return scale;
}

function drawChart(canvasId, data, label, color, minY, maxY, unit, scale, signed) {
  const c = document.getElementById(canvasId); if (!c) return;
  var pw = c.parentElement ? c.parentElement.clientWidth - 32 : c.width;
  if (pw > 0 && pw !== c.width) c.width = pw;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const pad = {l:44,r:8,t:18,b:4};
  const gw = W-pad.l-pad.r, gh = H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = chartPalette['plot-bg'];
  ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle = chartPalette['plot-grid'];
  ctx.setLineDash([2,4]);
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) { const y = pad.t+gh*(i/4); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke(); }
  ctx.setLineDash([]);
  if (signed && minY < 0) {
    const zy = pad.t+gh*(1-(0-minY)/(maxY-minY));
    ctx.strokeStyle = chartPalette['plot-zero'];
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(pad.l,zy); ctx.lineTo(W-pad.r,zy); ctx.stroke();
    ctx.setLineDash([]);
  }
  // Y labels
  ctx.fillStyle = chartPalette['plot-text'];
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const v = maxY-(maxY-minY)*(i/4);
    const digits = Math.abs(v/scale)>=10 ? 0 : 1;
    ctx.fillText(uiNumber(v/scale,digits,digits)+unit, pad.l-4, pad.t+gh*(i/4)+3);
  }
  // Current value
  const cur = data.length ? data[data.length-1] : -32768;
  const curStr = (cur > -32000) ? uiNumber(cur/scale,1,1)+unit : '--';
  ctx.fillStyle = color;
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(label+': '+curStr, pad.l, 12);
  if (data.length < 2) return;
  // Line with glow
  ctx.save();
  ctx.globalAlpha *= .27;
  ctx.strokeStyle = color;
  ctx.lineWidth = 4;
  ctx.beginPath();
  let started = false;
  for (let i = 0; i < data.length; i++) {
    if (data[i] < -32000) continue;
    const x = pad.l+gw*(i/(data.length-1));
    const y = pad.t+gh*(1-Math.max(0,Math.min(1,(data[i]-minY)/(maxY-minY))));
    if (!started) { ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.restore();
  // Sharp line
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  started = false;
  for (let i = 0; i < data.length; i++) {
    if (data[i] < -32000) continue;
    const x = pad.l+gw*(i/(data.length-1));
    const y = pad.t+gh*(1-Math.max(0,Math.min(1,(data[i]-minY)/(maxY-minY))));
    if (!started) { ctx.moveTo(x,y); started=true; } else ctx.lineTo(x,y);
  }
  ctx.stroke();
}

function updateCharts(slowChanged = true) {
  const ps = expandChartScale('press', waveData.press);
  const fs = expandChartScale('flow',  waveData.flow);
  const ls = expandChartScale('leak',  waveData.leak);
  drawChart('cPress', waveData.press, 'Pressure', reportChannelColor('Press'), ps.min, ps.max, '', 50, false);
  drawChart('cFlow', waveData.flow, 'Flow (L/min)', reportChannelColor('Flow'), fs.min, fs.max, ' ', 8.33, true);
  drawChart('cLeak', waveData.leak, 'Leak (L/min)', reportChannelColor('Leak'), ls.min, ls.max, '', 0.833, false);
  if (slowChanged) {
    drawChart('cSpo2', slowData.spo2, 'SpO2', reportChannelColor('SpO2'), 80, 100, '%', 1, false);
    drawChart('cPulse', slowData.pulse, 'Pulse', reportChannelColor('Pulse'), 40, 160, '', 1, false);
  }
  // Update chart header values
  var p = waveData.press, f = waveData.flow, lk = waveData.leak,
      s = slowData.spo2, hr = slowData.pulse;
  var el;
  function lastValid(arr, scale, digits = 1) {
    for (var i = arr.length - 1; i >= 0; i--) { if (arr[i] > -32000) return uiNumber(arr[i]/scale,digits,digits); }
    return '--';
  }
  el = document.getElementById('chartPressVal'); if (el) el.textContent = lastValid(p, 50);
  el = document.getElementById('chartFlowVal'); if (el) el.textContent = lastValid(f, 8.33);
  el = document.getElementById('chartLeakVal'); if (el) el.textContent = lastValid(lk, 0.833);
  if (slowChanged) {
    el = document.getElementById('chartSpo2Val'); if (el) el.textContent = lastValid(s, 1, 0);
    el = document.getElementById('chartPulseVal'); if (el) el.textContent = lastValid(hr, 1, 0);
  }
}

let liveBackfill = 0;
async function backfillLive() {
  const generation = ++liveBackfill;
  const connection = liveEvtSrc;
  const requestedSeq = liveSeq;
  try {
    const r = await api('/api/live?since='+(requestedSeq === null ? 0 : requestedSeq));
    if (!r) return;
    const d = await r.json();
    if (!connection || connection !== liveEvtSrc || generation !== liveBackfill) return;
    // A response older than the requested sequence indicates a device restart
    // or an absence longer than the sequence comparison window.
    const reset = requestedSeq !== null && ((d.seq - requestedSeq) & 0xffff) >= 0x8000;
    appendLiveSamples(d, reset);
    updateCharts();
  } catch(e) { console.error(e); }
}

// Init
async function startUI() {
  const ht = window.location.hash.slice(1);
  const status = lastStatus;
  let deferred = false;
  try { deferred = sessionStorage.getItem('airbridge.setup') === 'later'; } catch(e) {}
  if (window.location.pathname === '/wizard' || ht === 'setup' ||
      (status && !status.onboarding_complete && !deferred)) await startSetup();
  else showTab(tabNames.includes(ht) ? ht : 'status');
  if (ht === 'storage' && !setupActive()) loadStorage();
}

applyUiLanguage('auto');
renderThemePicker();
